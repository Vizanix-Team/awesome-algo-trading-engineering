name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  workflow_dispatch: {}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

      - name: Check for trailing whitespace
        run: |
          if grep -rInE ' +$' --include='*.md' .; then
            echo "Trailing whitespace found in the files above."
            exit 1
          fi

      - name: Check for tabs in Markdown files
        run: |
          if grep -rIlP '\t' --include='*.md' .; then
            echo "Tab characters found in the files above; use spaces."
            exit 1
          fi
