name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  schedule:
    # Weekly, Monday 06:00 UTC — catches links that rot after merge.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate internal links in the README catalog
        run: |
          grep -oE '\]\((library/[^)]+)\)' README.md \
            | sed -E 's/^\]\((.*)\)$/\1/' \
            | sort | uniq -d > duplicates.txt
          if [ -s duplicates.txt ]; then
            echo "Duplicate catalog links found in README.md:"
            cat duplicates.txt
            exit 1
          fi

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/workflows/mlc-config.json'
          check-modified-files-only: 'no'
          base-branch: 'main'

      # This checks that the README catalog and every book's internal links
      # (chapter anchors, relative diagram paths, cross-book links) resolve.
      # It never edits or removes content — fixes go through a reviewed PR.
