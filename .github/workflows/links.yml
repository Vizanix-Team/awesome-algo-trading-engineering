name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  schedule:
    # Weekly, Monday 06:00 UTC — catches links that rot after merge.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate URLs
        run: |
          grep -oE '\]\(https?://[^)]+\)' README.md \
            | sed -E 's/^\]\((.*)\)$/\1/' \
            | sort | uniq -d > duplicates.txt
          if [ -s duplicates.txt ]; then
            echo "Duplicate URLs found in README.md:"
            cat duplicates.txt
            exit 1
          fi

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/workflows/mlc-config.json'
          check-modified-files-only: 'no'
          base-branch: 'main'

      # Broken links are reported as a failed check / annotated output for
      # maintainer review. This workflow never edits or removes content —
      # removal always goes through a reviewed pull request.
