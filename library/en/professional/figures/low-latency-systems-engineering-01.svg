<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Average Latency Hides the Tail That Costs You Races</text>
  <line x1="60" y1="260" x2="650" y2="260" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="260" stroke="#30363d"/>
  <text x="180" y="50" fill="#58a6ff" font-size="12" text-anchor="middle">System A: avg 10us</text>
  <g fill="#58a6ff" opacity="0.8">
    <rect x="80" y="230" width="16" height="30"/>
    <rect x="100" y="200" width="16" height="60"/>
    <rect x="120" y="150" width="16" height="110"/>
    <rect x="140" y="190" width="16" height="70"/>
    <rect x="160" y="225" width="16" height="35"/>
    <rect x="180" y="245" width="16" height="15"/>
    <rect x="200" y="252" width="16" height="8"/>
  </g>
  <rect x="230" y="140" width="8" height="10" fill="#f85149"/>
  <text x="234" y="130" fill="#f85149" font-size="10" text-anchor="middle">5ms spike</text>

  <text x="500" y="50" fill="#3fb950" font-size="12" text-anchor="middle">System B: avg 15us</text>
  <g fill="#3fb950" opacity="0.8">
    <rect x="400" y="245" width="16" height="15"/>
    <rect x="420" y="200" width="16" height="60"/>
    <rect x="440" y="150" width="16" height="110"/>
    <rect x="460" y="200" width="16" height="60"/>
    <rect x="480" y="240" width="16" height="20"/>
    <rect x="500" y="252" width="16" height="8"/>
    <rect x="520" y="255" width="16" height="5"/>
  </g>
  <text x="465" y="130" fill="#3fb950" font-size="10" text-anchor="middle">tight p99.9 (20us)</text>

  <text x="350" y="290" fill="#8b949e" font-size="11" text-anchor="middle">Latency (log scale) -- System A's lower average hides a race-losing tail; System B wins more races.</text>
</svg>
