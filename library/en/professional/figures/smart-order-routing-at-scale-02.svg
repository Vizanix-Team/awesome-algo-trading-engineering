<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Quadratic Leakage Penalty vs Consumption Ratio</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <polyline points="60,238 120,235 180,225 240,205 300,175 360,135 420,90 480,60" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="320" y="265" fill="#8b949e" font-size="11" text-anchor="middle">Consumption ratio: order size / venue displayed size</text>
  <text x="25" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90 25 150)">Leakage penalty</text>
  <text x="180" y="215" fill="#8b949e" font-size="10" text-anchor="middle">small slice: low penalty</text>
  <text x="440" y="75" fill="#f85149" font-size="10" text-anchor="middle">large slice: penalty grows fast</text>
</svg>
