<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Single-Producer Single-Consumer Lock-Free Ring Buffer</text>
  <circle cx="320" cy="160" r="110" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <g id="slots"></g>
  <g>
    <circle cx="320" cy="50" r="16" fill="#161b22" stroke="#58a6ff"/>
    <circle cx="404" cy="76" r="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="430" cy="160" r="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="404" cy="244" r="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="320" cy="270" r="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="236" cy="244" r="16" fill="#161b22" stroke="#f85149"/>
    <circle cx="210" cy="160" r="16" fill="#161b22" stroke="#30363d"/>
    <circle cx="236" cy="76" r="16" fill="#161b22" stroke="#30363d"/>
  </g>
  <text x="320" y="20" fill="#58a6ff" font-size="11" text-anchor="middle">write_idx (producer)</text>
  <text x="236" y="270" fill="#f85149" font-size="11" text-anchor="middle">read_idx (consumer)</text>
  <text x="120" y="160" fill="#3fb950" font-size="11" text-anchor="middle">unread</text>
  <text x="520" y="160" fill="#8b949e" font-size="11" text-anchor="middle">free slots</text>
  <text x="320" y="298" fill="#8b949e" font-size="11" text-anchor="middle">No lock: producer and consumer only coordinate via atomic index updates.</text>
</svg>
