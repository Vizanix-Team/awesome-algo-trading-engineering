<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="280" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Canary Rollout of a Newly Retrained Model</text>
  <defs>
    <marker id="dl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="110" width="140" height="60" rx="6" stroke="#a371f7"/>
    <rect x="260" y="60" width="160" height="55" rx="6" stroke="#3fb950"/>
    <rect x="260" y="160" width="160" height="55" rx="6" stroke="#d29922"/>
    <rect x="520" y="110" width="150" height="60" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="100" y="135" fill="#a371f7">Live order flow</text>
    <text x="100" y="152" fill="#8b949e" font-size="9">trading decisions</text>
    <text x="340" y="83" fill="#3fb950">Production model</text>
    <text x="340" y="99" fill="#8b949e" font-size="9">95% of traffic</text>
    <text x="340" y="183" fill="#d29922">Canary model</text>
    <text x="340" y="199" fill="#8b949e" font-size="9">5% of traffic</text>
    <text x="595" y="135">Compare outcomes</text>
    <text x="595" y="152" fill="#8b949e" font-size="9">over observation window</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#dl)">
    <line x1="170" y1="130" x2="260" y2="90"/>
    <line x1="170" y1="150" x2="260" y2="185"/>
    <line x1="420" y1="90" x2="520" y2="130"/>
    <line x1="420" y1="185" x2="520" y2="150"/>
  </g>
  <text x="350" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Full rollout only completes once the canary matches or beats production over a large enough sample.</text>
</svg>
