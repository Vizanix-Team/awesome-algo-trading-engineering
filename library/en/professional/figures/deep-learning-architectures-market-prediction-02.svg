<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Cross-Asset Attention</text>
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <circle cx="120" cy="180" r="30"/>
    <circle cx="270" cy="90" r="30"/>
    <circle cx="420" cy="90" r="30"/>
    <circle cx="520" cy="220" r="30"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="120" y="184">Asset A</text>
    <text x="270" y="94">Asset B</text>
    <text x="420" y="94">Asset C</text>
    <text x="520" y="224">Asset D</text>
  </g>
  <g stroke="#a371f7" fill="none">
    <line x1="150" y1="180" x2="240" y2="105" stroke-width="3"/>
    <line x1="150" y1="185" x2="390" y2="100" stroke-width="1"/>
    <line x1="150" y1="195" x2="495" y2="215" stroke-width="0.5"/>
  </g>
  <text x="230" y="130" fill="#a371f7" font-size="10">high attention</text>
  <text x="380" y="60" fill="#8b949e" font-size="9">low attention</text>
  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Asset A's prediction attends most heavily to Asset B, its economically closest peer, and weakly to C and D.</text>
</svg>
