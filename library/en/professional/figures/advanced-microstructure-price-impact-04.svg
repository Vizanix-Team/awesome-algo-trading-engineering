<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="500" height="420" fill="#0d1117"/>
  <text x="250" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Cross-Impact Matrix</text>
  <text x="250" y="46" fill="#8b949e" font-size="11" text-anchor="middle">How trading instrument (column) impacts price of instrument (row)</text>
  <g font-size="11" fill="#c9d1d9">
    <text x="120" y="85" text-anchor="middle">A</text>
    <text x="200" y="85" text-anchor="middle">B</text>
    <text x="280" y="85" text-anchor="middle">C</text>
    <text x="360" y="85" text-anchor="middle">D</text>
    <text x="80" y="120" text-anchor="end">A</text>
    <text x="80" y="180" text-anchor="end">B</text>
    <text x="80" y="240" text-anchor="end">C</text>
    <text x="80" y="300" text-anchor="end">D</text>
  </g>
  <g stroke="#30363d">
    <rect x="90" y="95" width="70" height="55" fill="#a371f7" opacity="0.9"/>
    <rect x="160" y="95" width="70" height="55" fill="#a371f7" opacity="0.15"/>
    <rect x="230" y="95" width="70" height="55" fill="#a371f7" opacity="0.35"/>
    <rect x="300" y="95" width="70" height="55" fill="#a371f7" opacity="0.05"/>

    <rect x="90" y="150" width="70" height="55" fill="#a371f7" opacity="0.15"/>
    <rect x="160" y="150" width="70" height="55" fill="#a371f7" opacity="0.9"/>
    <rect x="230" y="150" width="70" height="55" fill="#a371f7" opacity="0.1"/>
    <rect x="300" y="150" width="70" height="55" fill="#a371f7" opacity="0.05"/>

    <rect x="90" y="205" width="70" height="55" fill="#a371f7" opacity="0.35"/>
    <rect x="160" y="205" width="70" height="55" fill="#a371f7" opacity="0.1"/>
    <rect x="230" y="205" width="70" height="55" fill="#a371f7" opacity="0.9"/>
    <rect x="300" y="205" width="70" height="55" fill="#a371f7" opacity="0.4"/>

    <rect x="90" y="260" width="70" height="55" fill="#a371f7" opacity="0.05"/>
    <rect x="160" y="260" width="70" height="55" fill="#a371f7" opacity="0.05"/>
    <rect x="230" y="260" width="70" height="55" fill="#a371f7" opacity="0.4"/>
    <rect x="300" y="260" width="70" height="55" fill="#a371f7" opacity="0.9"/>
  </g>
  <text x="250" y="345" fill="#c9d1d9" font-size="11" text-anchor="middle">Diagonal = own-impact; off-diagonal = cross-impact between related instruments</text>
  <text x="250" y="385" fill="#8b949e" font-size="11" text-anchor="middle">Darker cells indicate stronger impact linkage (e.g. sector peers, ETF and components)</text>
</svg>
