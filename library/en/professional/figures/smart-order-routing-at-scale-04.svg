<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Venue Health State Machine</text>
  <defs>
    <marker id="vh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="40" y="120" width="150" height="60" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#d29922" stroke-width="1.5">
    <rect x="250" y="120" width="150" height="60" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="460" y="120" width="150" height="60" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="115" y="145" fill="#3fb950">Healthy</text>
    <text x="115" y="162" fill="#8b949e" font-size="10">full allocation</text>
    <text x="325" y="145" fill="#d29922">Degraded</text>
    <text x="325" y="162" fill="#8b949e" font-size="10">reduced allocation</text>
    <text x="535" y="145" fill="#f85149">Unavailable</text>
    <text x="535" y="162" fill="#8b949e" font-size="10">re-route, reconcile on return</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#vh)">
    <path d="M190,140 C210,140 230,140 250,140"/>
    <path d="M400,140 C420,140 440,140 460,140"/>
    <path d="M460,165 C400,200 250,200 190,165"/>
    <path d="M250,165 C220,190 150,190 100,180 C 80,175 70,165 70,180" fill="none"/>
  </g>
  <text x="330" y="220" fill="#8b949e" font-size="10" text-anchor="middle">rising reject rate / latency</text>
  <text x="325" y="250" fill="#8b949e" font-size="10" text-anchor="middle">recovers -&gt; healthy, worsens -&gt; unavailable</text>
</svg>
