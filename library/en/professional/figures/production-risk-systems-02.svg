<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Limit Hierarchy</text>
  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="220" y="50" width="200" height="45" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#d29922" stroke-width="1.5">
    <rect x="120" y="130" width="180" height="40" rx="6"/>
    <rect x="340" y="130" width="180" height="40" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="40" y="210" width="140" height="40" rx="6"/>
    <rect x="200" y="210" width="140" height="40" rx="6"/>
    <rect x="360" y="210" width="140" height="40" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="180" y="275" width="280" height="35" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="320" y="77" fill="#f85149">Firm gross / net exposure</text>
    <text x="210" y="154" fill="#d29922">Desk A</text>
    <text x="430" y="154" fill="#d29922">Desk B</text>
    <text x="110" y="234" fill="#3fb950" font-size="11">Strategy 1</text>
    <text x="270" y="234" fill="#3fb950" font-size="11">Strategy 2</text>
    <text x="430" y="234" fill="#3fb950" font-size="11">Strategy 3</text>
    <text x="320" y="296" fill="#58a6ff" font-size="11">Instrument concentration limit (cuts across all strategies)</text>
  </g>
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <line x1="280" y1="95" x2="210" y2="130"/>
    <line x1="360" y1="95" x2="430" y2="130"/>
    <line x1="180" y1="170" x2="110" y2="210"/>
    <line x1="220" y1="170" x2="270" y2="210"/>
    <line x1="430" y1="170" x2="430" y2="210"/>
  </g>
</svg>
