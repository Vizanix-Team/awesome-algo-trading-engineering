<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Standard Network Stack vs Kernel Bypass</text>
  <defs>
    <marker id="lb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f85149"/>
    </marker>
    <marker id="lg2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
  <text x="200" y="55" fill="#f85149" font-size="12" text-anchor="middle">Standard stack</text>
  <g fill="#161b22" stroke="#30363d">
    <rect x="80" y="70" width="240" height="36" rx="4"/>
    <rect x="80" y="116" width="240" height="36" rx="4"/>
    <rect x="80" y="162" width="240" height="36" rx="4"/>
    <rect x="80" y="208" width="240" height="36" rx="4"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="200" y="92">NIC interrupt</text>
    <text x="200" y="138">Kernel TCP/IP stack</text>
    <text x="200" y="184">Context switch to user space</text>
    <text x="200" y="230">Application logic</text>
  </g>
  <g stroke="#f85149" stroke-width="1.5" marker-end="url(#lb)">
    <line x1="200" y1="106" x2="200" y2="116"/>
    <line x1="200" y1="152" x2="200" y2="162"/>
    <line x1="200" y1="198" x2="200" y2="208"/>
  </g>
  <text x="200" y="270" fill="#f85149" font-size="10" text-anchor="middle">variable latency at every hop</text>

  <text x="530" y="55" fill="#3fb950" font-size="12" text-anchor="middle">Kernel bypass</text>
  <g fill="#161b22" stroke="#3fb950">
    <rect x="410" y="70" width="240" height="36" rx="4"/>
    <rect x="410" y="208" width="240" height="36" rx="4"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="530" y="92">NIC ring buffer</text>
    <text x="530" y="230">Application logic (busy-poll)</text>
  </g>
  <g stroke="#3fb950" stroke-width="1.5" marker-end="url(#lg2)">
    <line x1="530" y1="106" x2="530" y2="208"/>
  </g>
  <text x="530" y="270" fill="#3fb950" font-size="10" text-anchor="middle">no syscall, no context switch, predictable</text>
</svg>
