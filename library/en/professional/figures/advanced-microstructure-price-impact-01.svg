<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Temporary vs Permanent Impact</text>
  <line x1="60" y1="220" x2="580" y2="220" stroke="#30363d"/>
  <line x1="60" y1="220" x2="60" y2="60" stroke="#30363d"/>
  <rect x="150" y="60" width="120" height="160" fill="#58a6ff" opacity="0.08"/>
  <text x="210" y="75" fill="#58a6ff" font-size="10" text-anchor="middle">trading window</text>
  <polyline points="60,200 150,200 190,150 230,120 270,105 340,130 400,145 470,150 580,150" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <line x1="270" y1="105" x2="270" y2="220" stroke="#8b949e" stroke-dasharray="2,4"/>
  <text x="270" y="235" fill="#8b949e" font-size="10" text-anchor="middle">trading stops</text>
  <line x1="60" y1="150" x2="580" y2="150" stroke="#3fb950" stroke-dasharray="4,3"/>
  <text x="590" y="154" fill="#3fb950" font-size="10">permanent level</text>
  <line x1="60" y1="200" x2="580" y2="200" stroke="#8b949e" stroke-dasharray="2,4"/>
  <text x="590" y="204" fill="#8b949e" font-size="10">pre-trade price</text>
  <text x="300" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Price rises while trading (impact), then partially reverts, settling at a new permanent level.</text>
</svg>
