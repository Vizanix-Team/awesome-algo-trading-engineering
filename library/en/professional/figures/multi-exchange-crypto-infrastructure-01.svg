<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Per-Exchange Adapters Normalize to One Interface</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="60" width="130" height="40" rx="6"/>
    <rect x="30" y="115" width="130" height="40" rx="6"/>
    <rect x="30" y="170" width="130" height="40" rx="6"/>
    <rect x="30" y="225" width="130" height="40" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="95" y="84">Exchange A API</text>
    <text x="95" y="139">Exchange B API</text>
    <text x="95" y="194">Exchange C API</text>
    <text x="95" y="249">Exchange D API</text>
  </g>
  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="240" y="100" width="160" height="100" rx="6"/>
  </g>
  <text x="320" y="140" fill="#a371f7" font-size="12" text-anchor="middle">Adapter Layer</text>
  <text x="320" y="158" fill="#8b949e" font-size="10" text-anchor="middle">status, precision,</text>
  <text x="320" y="172" fill="#8b949e" font-size="10" text-anchor="middle">error code mapping</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="470" y="120" width="150" height="60" rx="6"/>
  </g>
  <text x="545" y="145" fill="#3fb950" font-size="12" text-anchor="middle">Common Internal</text>
  <text x="545" y="162" fill="#3fb950" font-size="12" text-anchor="middle">Representation</text>
  <defs>
    <marker id="mx" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#mx)">
    <line x1="160" y1="80" x2="240" y2="130"/>
    <line x1="160" y1="135" x2="240" y2="145"/>
    <line x1="160" y1="190" x2="240" y2="165"/>
    <line x1="160" y1="245" x2="240" y2="180"/>
    <line x1="400" y1="150" x2="470" y2="150"/>
  </g>
  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Core trading logic never sees a raw, venue-specific field or status code.</text>
</svg>
