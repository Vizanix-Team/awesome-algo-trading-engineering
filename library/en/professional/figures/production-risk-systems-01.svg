<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Kill Switch: Independent Layers</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="80" y="50" width="480" height="50" rx="6" stroke="#8b949e"/>
    <rect x="80" y="115" width="480" height="50" rx="6" stroke="#3fb950"/>
    <rect x="80" y="180" width="480" height="50" rx="6" stroke="#d29922"/>
    <rect x="80" y="245" width="480" height="50" rx="6" stroke="#f85149"/>
  </g>
  <g fill="#c9d1d9" font-size="12">
    <text x="100" y="72" fill="#8b949e">Layer 1 -- Application</text>
    <text x="100" y="90" fill="#8b949e" font-size="10">strategy checks shared kill flag before each order</text>
    <text x="100" y="137" fill="#3fb950">Layer 2 -- Gateway (chokepoint)</text>
    <text x="100" y="155" fill="#8b949e" font-size="10">every order to an exchange passes through here regardless of source</text>
    <text x="100" y="202" fill="#d29922">Layer 3 -- Exchange</text>
    <text x="100" y="220" fill="#8b949e" font-size="10">exchange-side kill switch API cancels resting orders for your firm ID</text>
    <text x="100" y="267" fill="#f85149">Layer 4 -- Physical</text>
    <text x="100" y="285" fill="#8b949e" font-size="10">disconnect network connectivity as absolute last resort</text>
  </g>
  <text x="320" y="320" fill="#8b949e" font-size="11" text-anchor="middle">Each layer must halt activity without depending on the layers above it working correctly.</text>
</svg>
