<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Monte Carlo Dropout: Prediction Uncertainty</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <g fill="#a371f7" opacity="0.7">
    <circle cx="150" cy="150" r="4"/><circle cx="160" cy="145" r="4"/><circle cx="145" cy="160" r="4"/>
    <circle cx="155" cy="155" r="4"/><circle cx="140" cy="148" r="4"/><circle cx="165" cy="158" r="4"/>
    <circle cx="152" cy="140" r="4"/><circle cx="148" cy="165" r="4"/><circle cx="158" cy="150" r="4"/>
  </g>
  <text x="152" y="200" fill="#3fb950" font-size="11" text-anchor="middle">low-uncertainty input</text>
  <text x="152" y="216" fill="#8b949e" font-size="10" text-anchor="middle">30 forward passes cluster tightly</text>

  <g fill="#f85149" opacity="0.6">
    <circle cx="450" cy="130" r="4"/><circle cx="470" cy="110" r="4"/><circle cx="430" cy="160" r="4"/>
    <circle cx="490" cy="150" r="4"/><circle cx="410" cy="140" r="4"/><circle cx="460" cy="180" r="4"/>
    <circle cx="500" cy="100" r="4"/><circle cx="420" cy="110" r="4"/><circle cx="480" cy="170" r="4"/>
    <circle cx="440" cy="90" r="4"/>
  </g>
  <text x="455" y="215" fill="#f85149" font-size="11" text-anchor="middle">high-uncertainty input</text>
  <text x="455" y="231" fill="#8b949e" font-size="10" text-anchor="middle">forward passes scatter widely -- size down or skip</text>
</svg>
