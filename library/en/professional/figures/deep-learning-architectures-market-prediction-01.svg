<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">LSTM Cell: Gated Memory at a Conceptual Level</text>
  <rect x="120" y="60" width="400" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="520" y2="90" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="80" fill="#a371f7" font-size="11" text-anchor="middle">cell state (long-term memory) flows across time steps</text>

  <circle cx="200" cy="150" r="24" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="200" y="154" fill="#f85149" font-size="11" text-anchor="middle">forget</text>
  <circle cx="280" cy="150" r="24" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="280" y="154" fill="#d29922" font-size="11" text-anchor="middle">input</text>
  <circle cx="440" cy="150" r="24" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="440" y="154" fill="#3fb950" font-size="11" text-anchor="middle">output</text>
  <rect x="330" y="128" width="70" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="365" y="154" fill="#58a6ff" font-size="10" text-anchor="middle">candidate</text>

  <g stroke="#8b949e" stroke-width="1.2" fill="none">
    <line x1="200" y1="174" x2="200" y2="230"/>
    <line x1="280" y1="174" x2="280" y2="230"/>
    <line x1="365" y1="172" x2="365" y2="230"/>
    <line x1="440" y1="174" x2="440" y2="230"/>
  </g>
  <rect x="150" y="230" width="340" height="30" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="320" y="250" fill="#c9d1d9" font-size="10" text-anchor="middle">forget x prev cell state, add input x candidate -&gt; new cell state</text>

  <text x="150" y="300" fill="#c9d1d9" font-size="11">x(t): input at this time step</text>
  <text x="150" y="316" fill="#c9d1d9" font-size="11">h(t): hidden state passed forward, gated by the output gate</text>
</svg>
