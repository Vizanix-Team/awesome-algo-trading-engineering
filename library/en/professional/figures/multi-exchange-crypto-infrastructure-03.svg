<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">WebSocket Reconnect: Resync Before Resuming Deltas</text>
  <defs>
    <marker id="wr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="60" width="130" height="45" rx="6" stroke="#3fb950"/>
    <rect x="200" y="60" width="130" height="45" rx="6" stroke="#f85149"/>
    <rect x="370" y="60" width="130" height="45" rx="6" stroke="#d29922"/>
    <rect x="200" y="150" width="130" height="45" rx="6" stroke="#a371f7"/>
    <rect x="370" y="150" width="130" height="45" rx="6" stroke="#58a6ff"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="95" y="86" fill="#3fb950">Connected</text>
    <text x="265" y="86" fill="#f85149">Disconnected</text>
    <text x="435" y="86" fill="#d29922">Reconnected</text>
    <text x="265" y="176" fill="#a371f7">Fetch snapshot</text>
    <text x="435" y="176" fill="#58a6ff">Resume delta</text>
    <text x="435" y="190" fill="#58a6ff" font-size="9">processing</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#wr)">
    <line x1="160" y1="82" x2="200" y2="82"/>
    <line x1="330" y1="82" x2="370" y2="82"/>
    <line x1="435" y1="105" x2="265" y2="150"/>
    <line x1="330" y1="172" x2="370" y2="172"/>
  </g>
  <text x="320" y="240" fill="#8b949e" font-size="11" text-anchor="middle">Skipping the resync step is the most common cause of silently corrupted local order-book state.</text>
</svg>
