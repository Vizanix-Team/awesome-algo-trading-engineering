<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Cross-Exchange Arbitrage: Leg Risk</text>
  <line x1="60" y1="90" x2="580" y2="90" stroke="#30363d"/>
  <line x1="60" y1="180" x2="580" y2="180" stroke="#30363d"/>
  <text x="20" y="94" fill="#c9d1d9" font-size="11">Leg A</text>
  <text x="20" y="184" fill="#c9d1d9" font-size="11">Leg B</text>
  <circle cx="100" cy="90" r="6" fill="#3fb950"/>
  <text x="100" y="75" fill="#3fb950" font-size="10" text-anchor="middle">sent &amp; filled</text>
  <circle cx="100" cy="180" r="6" fill="#d29922"/>
  <text x="100" y="200" fill="#d29922" font-size="10" text-anchor="middle">sent</text>
  <line x1="150" y1="180" x2="350" y2="180" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="250" y="165" fill="#8b949e" font-size="10" text-anchor="middle">waiting, within max_leg_delay_ms</text>
  <circle cx="350" cy="180" r="6" fill="#f85149"/>
  <text x="350" y="200" fill="#f85149" font-size="10" text-anchor="middle">deadline: still unfilled</text>
  <line x1="350" y1="90" x2="350" y2="180" stroke="#f85149" stroke-dasharray="2,4"/>
  <rect x="380" y="160" width="160" height="40" fill="#161b22" stroke="#f85149" rx="4"/>
  <text x="460" y="185" fill="#f85149" font-size="11" text-anchor="middle">unwind_position(urgency=high)</text>
  <text x="320" y="240" fill="#8b949e" font-size="11" text-anchor="middle">One leg filling without the other creates an unhedged position that automated unwind logic must close.</text>
</svg>
