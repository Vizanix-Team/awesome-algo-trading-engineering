<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Order Book Resilience: Fast vs Slow Recovery</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <line x1="60" y1="100" x2="580" y2="100" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="590" y="104" fill="#8b949e" font-size="10">pre-trade depth</text>
  <line x1="150" y1="60" x2="150" y2="240" stroke="#f85149" stroke-dasharray="2,4"/>
  <text x="150" y="255" fill="#f85149" font-size="10" text-anchor="middle">trade consumes depth</text>
  <polyline points="60,100 150,220 210,150 260,110 300,102 340,100" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="260" y="90" fill="#3fb950" font-size="11" text-anchor="middle">fast resilience</text>
  <polyline points="60,100 150,220 250,210 350,190 450,160 520,120 570,100" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="470" y="145" fill="#f85149" font-size="11" text-anchor="middle">slow resilience</text>
  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Fast-resilience books tolerate a more aggressive execution pace between child orders.</text>
</svg>
