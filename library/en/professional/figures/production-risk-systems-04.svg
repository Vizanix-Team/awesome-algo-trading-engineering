<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Fail-Closed vs Fail-Open on Uncertainty</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="240" y="50" width="160" height="50" rx="6"/>
  </g>
  <text x="320" y="72" fill="#c9d1d9" font-size="12" text-anchor="middle">Risk check cannot</text>
  <text x="320" y="88" fill="#c9d1d9" font-size="12" text-anchor="middle">confirm a safe answer</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="80" y="170" width="200" height="70" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="360" y="170" width="200" height="70" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="180" y="195" fill="#3fb950">Fail-closed: reject/hold</text>
    <text x="180" y="215" fill="#8b949e" font-size="10">bounded cost: missed</text>
    <text x="180" y="228" fill="#8b949e" font-size="10">trading opportunity</text>
    <text x="460" y="195" fill="#f85149">Fail-open: approve</text>
    <text x="460" y="215" fill="#8b949e" font-size="10">unbounded cost: uncontrolled</text>
    <text x="460" y="228" fill="#8b949e" font-size="10">trading during a real risk event</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="280" y1="100" x2="180" y2="170"/>
    <line x1="360" y1="100" x2="460" y2="170"/>
  </g>
</svg>
