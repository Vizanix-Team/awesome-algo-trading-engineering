<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">NUMA: Local vs Cross-Socket Memory Access</text>
  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="60" y="70" width="220" height="160" rx="8"/>
  </g>
  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="360" y="70" width="220" height="160" rx="8"/>
  </g>
  <text x="170" y="60" fill="#3fb950" font-size="12" text-anchor="middle">Socket 0</text>
  <text x="470" y="60" fill="#f85149" font-size="12" text-anchor="middle">Socket 1</text>
  <rect x="80" y="90" width="70" height="40" fill="#0d1117" stroke="#58a6ff"/>
  <text x="115" y="114" fill="#58a6ff" font-size="11" text-anchor="middle">Core (pinned)</text>
  <rect x="80" y="170" width="70" height="40" fill="#0d1117" stroke="#a371f7"/>
  <text x="115" y="194" fill="#a371f7" font-size="10" text-anchor="middle">Local DRAM</text>
  <line x1="115" y1="130" x2="115" y2="170" stroke="#3fb950" stroke-width="2"/>
  <text x="200" y="100" fill="#3fb950" font-size="9" text-anchor="middle">~80ns local access</text>

  <rect x="450" y="170" width="70" height="40" fill="#0d1117" stroke="#a371f7"/>
  <text x="485" y="194" fill="#a371f7" font-size="10" text-anchor="middle">Remote DRAM</text>
  <line x1="115" y1="110" x2="485" y2="190" stroke="#f85149" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="320" y="145" fill="#f85149" font-size="10" text-anchor="middle">~150-200ns cross-socket access</text>

  <text x="320" y="265" fill="#8b949e" font-size="11" text-anchor="middle">Pin threads to a core and allocate its working set on that core's local NUMA node.</text>
</svg>
