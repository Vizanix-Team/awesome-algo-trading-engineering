<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Cointegrated Pair: Diverging Prices, Reverting Spread</text>
  <line x1="50" y1="160" x2="600" y2="160" stroke="#30363d"/>
  <polyline points="50,120 100,110 150,95 200,105 250,80 300,90 350,70 400,85 450,65 500,75 550,55 600,60" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <polyline points="50,130 100,140 150,150 200,145 250,165 300,155 350,175 400,165 450,185 500,175 550,195 600,190" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="580" y="50" fill="#58a6ff" font-size="11" text-anchor="end">Asset A</text>
  <text x="580" y="205" fill="#3fb950" font-size="11" text-anchor="end">Asset B (hedge-ratio scaled)</text>

  <line x1="50" y1="270" x2="600" y2="270" stroke="#30363d"/>
  <line x1="50" y1="220" x2="600" y2="220" stroke="#8b949e" stroke-dasharray="3,3"/>
  <polyline points="50,225 100,215 150,222 200,235 250,215 300,228 350,212 400,230 450,214 500,232 550,216 600,224" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="60" y="215" fill="#8b949e" font-size="10">equilibrium</text>
  <text x="320" y="300" fill="#8b949e" font-size="11" text-anchor="middle">Spread = Price A − hedge ratio × Price B, oscillating around equilibrium</text>
</svg>
