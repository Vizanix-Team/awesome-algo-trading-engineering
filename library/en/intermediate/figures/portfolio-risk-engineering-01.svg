<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">VaR vs Expected Shortfall on a P&amp;L Distribution</text>
  <line x1="50" y1="240" x2="600" y2="240" stroke="#30363d"/>
  <path d="M50,240 C120,240 150,60 320,60 C490,60 520,240 590,240 Z" fill="#161b22" stroke="#30363d"/>
  <path d="M50,240 C90,240 105,190 130,180 L130,240 Z" fill="#da3633" opacity="0.6"/>
  <line x1="130" y1="60" x2="130" y2="240" stroke="#f85149" stroke-width="2"/>
  <text x="130" y="50" fill="#f85149" font-size="12" text-anchor="middle">95% VaR</text>
  <text x="130" y="255" fill="#f85149" font-size="10" text-anchor="middle">-$2.0M</text>
  <text x="90" y="200" fill="#da3633" font-size="10" text-anchor="middle">worst 5%</text>
  <line x1="95" y1="150" x2="95" y2="240" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="95" y="140" fill="#a371f7" font-size="11" text-anchor="middle">Expected</text>
  <text x="95" y="270" fill="#a371f7" font-size="10" text-anchor="middle">Shortfall: -$3.1M</text>
  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">VaR marks the threshold; Expected Shortfall averages the severity beyond it</text>
</svg>
