<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Tiered Pre-Trade Checks: Latency vs Thoroughness</text>
  <defs>
    <marker id="pt" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="40" y="60" width="160" height="50" rx="6"/>
    <rect x="260" y="60" width="180" height="50" rx="6" stroke="#3fb950"/>
    <rect x="260" y="180" width="180" height="50" rx="6" stroke="#f85149"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="120" y="90">Incoming order</text>
    <text x="350" y="82" fill="#3fb950">Small / established</text>
    <text x="350" y="98" fill="#8b949e" font-size="10">fast incremental check</text>
    <text x="350" y="202" fill="#f85149">Large / new strategy</text>
    <text x="350" y="218" fill="#8b949e" font-size="10">full portfolio recompute</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#pt)">
    <line x1="200" y1="85" x2="260" y2="85"/>
    <line x1="200" y1="85" x2="260" y2="205"/>
  </g>
  <text x="350" y="150" fill="#8b949e" font-size="11" text-anchor="middle">If risk data is stale or missing, fail closed: reject or hold, never silently approve.</text>
  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Both paths converge back into the order path with an Approval or Rejection.</text>
</svg>
