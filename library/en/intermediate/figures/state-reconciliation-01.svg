<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">The Reconciliation Triangle</text>
  <defs>
    <marker id="rc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="240" y="50" width="160" height="60" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="60" y="220" width="180" height="60" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="400" y="220" width="180" height="60" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="320" y="75" fill="#58a6ff">Internal State</text>
    <text x="320" y="92" fill="#8b949e" font-size="10">what the OMS believes</text>
    <text x="150" y="245" fill="#3fb950">Exchange State</text>
    <text x="150" y="262" fill="#8b949e" font-size="10">authoritative live records</text>
    <text x="490" y="245" fill="#a371f7">Clearing / Custodian</text>
    <text x="490" y="262" fill="#8b949e" font-size="10">independent, lagged, legal record</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <line x1="290" y1="110" x2="180" y2="220"/>
    <line x1="360" y1="110" x2="470" y2="220"/>
    <line x1="240" y1="250" x2="400" y2="250"/>
  </g>
  <text x="320" y="315" fill="#f85149" font-size="11" text-anchor="middle">Two agreeing sources can still both be wrong relative to the third; that gap is the entire point of a three-way check.</text>
</svg>
