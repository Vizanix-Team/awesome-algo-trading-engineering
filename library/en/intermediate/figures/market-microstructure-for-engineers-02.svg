<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Time Priority vs Pro-Rata: 200-Share Incoming Order</text>
  <text x="160" y="50" fill="#8b949e" font-size="12" text-anchor="middle">Time Priority</text>
  <text x="480" y="50" fill="#8b949e" font-size="12" text-anchor="middle">Pro-Rata</text>
  <g fill="#161b22" stroke="#30363d">
    <rect x="60" y="70" width="200" height="30"/>
    <rect x="60" y="110" width="200" height="30"/>
    <rect x="60" y="150" width="200" height="30"/>
  </g>
  <g fill="#58a6ff" opacity="0.8">
    <rect x="60" y="70" width="100" height="30"/>
    <rect x="60" y="110" width="100" height="30"/>
  </g>
  <g fill="#c9d1d9" font-size="11">
    <text x="270" y="90">100 sh (1st)</text>
    <text x="270" y="130">300 sh (2nd)</text>
    <text x="270" y="170">600 sh (3rd)</text>
    <text x="110" y="90" fill="#0d1117">100 filled</text>
    <text x="110" y="130" fill="#0d1117">100 filled</text>
  </g>
  <text x="160" y="200" fill="#58a6ff" font-size="11" text-anchor="middle">Fills strictly in arrival order:</text>
  <text x="160" y="216" fill="#58a6ff" font-size="11" text-anchor="middle">1st order fully, then part of 2nd</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="380" y="70" width="200" height="30"/>
    <rect x="380" y="110" width="200" height="30"/>
    <rect x="380" y="150" width="200" height="30"/>
  </g>
  <g fill="#a371f7" opacity="0.8">
    <rect x="380" y="70" width="20" height="30"/>
    <rect x="380" y="110" width="60" height="30"/>
    <rect x="380" y="150" width="120" height="30"/>
  </g>
  <g fill="#c9d1d9" font-size="11">
    <text x="590" y="90">100 sh (1st)</text>
    <text x="590" y="130">300 sh (2nd)</text>
    <text x="590" y="170">600 sh (3rd)</text>
  </g>
  <text x="480" y="200" fill="#a371f7" font-size="11" text-anchor="middle">Fills split proportionally by size:</text>
  <text x="480" y="216" fill="#a371f7" font-size="11" text-anchor="middle">~20 / ~60 / ~120 shares</text>
  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Pro-rata rewards posting large size; time priority rewards being first.</text>
</svg>
