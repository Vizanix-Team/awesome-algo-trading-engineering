<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Single-Writer Actor Model per Order</text>
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="20" y="50" width="150" height="42" rx="6"/>
    <rect x="20" y="110" width="150" height="42" rx="6"/>
    <rect x="20" y="170" width="150" height="42" rx="6"/>
    <rect x="250" y="105" width="150" height="50" rx="6" stroke="#a371f7"/>
    <rect x="470" y="105" width="150" height="50" rx="6" stroke="#3fb950"/>
    <rect x="360" y="220" width="180" height="50" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="95" y="75">Strategy thread</text>
    <text x="95" y="135">Market data / drop-copy</text>
    <text x="95" y="195">Reconciliation job</text>
    <text x="325" y="126" fill="#a371f7">Single-Consumer</text>
    <text x="325" y="140" fill="#a371f7">Event Queue</text>
    <text x="545" y="126" fill="#3fb950">Order State Machine</text>
    <text x="545" y="140" fill="#3fb950">(one writer)</text>
    <text x="450" y="242">Published Snapshot</text>
    <text x="450" y="256" fill="#8b949e" font-size="10">read-only, for dashboards</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#ax)">
    <line x1="170" y1="71" x2="250" y2="120"/>
    <line x1="170" y1="131" x2="250" y2="130"/>
    <line x1="170" y1="191" x2="250" y2="140"/>
    <line x1="400" y1="130" x2="470" y2="130"/>
    <line x1="545" y1="155" x2="470" y2="220"/>
  </g>
  <text x="320" y="305" fill="#8b949e" font-size="11" text-anchor="middle">All mutations serialize through one queue per order; readers never touch the writer's private state.</text>
</svg>
