<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="260" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">From Forecast to Trading Signal</text>
  <defs>
    <marker id="fs" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="20" y="90" width="110" height="60" rx="6" stroke="#a371f7"/>
    <rect x="180" y="90" width="110" height="60" rx="6"/>
    <rect x="340" y="90" width="110" height="60" rx="6"/>
    <rect x="500" y="90" width="110" height="60" rx="6"/>
    <rect x="640" y="0" width="0" height="0"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="11">
    <text x="75" y="115" fill="#a371f7">Raw Forecast</text>
    <text x="75" y="132" fill="#8b949e" font-size="9">return / probability</text>
    <text x="235" y="115">Thresholding</text>
    <text x="235" y="132" fill="#8b949e" font-size="9">worth cost to trade?</text>
    <text x="395" y="115">Sizing</text>
    <text x="395" y="132" fill="#8b949e" font-size="9">confidence-scaled</text>
    <text x="555" y="115">Risk Overlay</text>
    <text x="555" y="132" fill="#8b949e" font-size="9">limits &amp; exposure</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#fs)">
    <line x1="130" y1="120" x2="180" y2="120"/>
    <line x1="290" y1="120" x2="340" y2="120"/>
    <line x1="450" y1="120" x2="500" y2="120"/>
  </g>
  <text x="555" y="185" fill="#3fb950" font-size="12" text-anchor="middle">-&gt; Position sent to OMS</text>
  <text x="350" y="225" fill="#8b949e" font-size="11" text-anchor="middle">Each stage is a separately tested component; a naive final stage can erase an otherwise-real edge.</text>
</svg>
