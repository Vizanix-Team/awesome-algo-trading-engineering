<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="260" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Distributed Trace Across the Order Lifecycle</text>
  <line x1="50" y1="60" x2="50" y2="220" stroke="#30363d"/>
  <g font-size="11" fill="#c9d1d9">
    <text x="10" y="80">Strategy</text>
    <text x="10" y="115">Risk check</text>
    <text x="10" y="150">OMS submit</text>
    <text x="10" y="185">Exchange gw</text>
    <text x="10" y="220">Fill process</text>
  </g>
  <g stroke="#30363d">
    <line x1="50" y1="80" x2="650" y2="80"/>
    <line x1="50" y1="115" x2="650" y2="115"/>
    <line x1="50" y1="150" x2="650" y2="150"/>
    <line x1="50" y1="185" x2="650" y2="185"/>
    <line x1="50" y1="220" x2="650" y2="220"/>
  </g>
  <rect x="60" y="72" width="40" height="16" fill="#a371f7"/>
  <rect x="100" y="107" width="60" height="16" fill="#58a6ff"/>
  <rect x="160" y="142" width="50" height="16" fill="#3fb950"/>
  <rect x="210" y="177" width="180" height="16" fill="#f85149"/>
  <rect x="390" y="212" width="40" height="16" fill="#d29922"/>
  <text x="80" y="65" fill="#a371f7" font-size="9" text-anchor="middle">decision</text>
  <text x="130" y="100" fill="#58a6ff" font-size="9" text-anchor="middle">risk_check</text>
  <text x="185" y="135" fill="#3fb950" font-size="9" text-anchor="middle">oms_submit</text>
  <text x="300" y="170" fill="#f85149" font-size="9" text-anchor="middle">network + matching engine (slow hop)</text>
  <text x="410" y="205" fill="#d29922" font-size="9" text-anchor="middle">fill ack</text>
  <text x="350" y="245" fill="#8b949e" font-size="11" text-anchor="middle">All spans share one trace ID, so a slow hop is visible immediately instead of guessed at.</text>
</svg>
