<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Ledgers an OMS Must Reconcile</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="60" width="160" height="70" rx="6"/>
    <rect x="240" y="60" width="160" height="70" rx="6"/>
    <rect x="450" y="60" width="160" height="70" rx="6"/>
    <rect x="220" y="220" width="200" height="60" rx="6" stroke="#3fb950"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="110" y="88">Intent</text>
    <text x="110" y="105" fill="#8b949e" font-size="10">submit_order() calls</text>
    <text x="110" y="118" fill="#8b949e" font-size="10">from strategy code</text>
    <text x="320" y="88">Wire Protocol</text>
    <text x="320" y="105" fill="#8b949e" font-size="10">what was sent, what</text>
    <text x="320" y="118" fill="#8b949e" font-size="10">acks came back</text>
    <text x="530" y="88">Truth</text>
    <text x="530" y="105" fill="#8b949e" font-size="10">fills / cancels / rejects</text>
    <text x="530" y="118" fill="#8b949e" font-size="10">as the exchange sees them</text>
    <text x="320" y="250" fill="#3fb950">Reconciled Order State</text>
    <text x="320" y="266" fill="#8b949e" font-size="10">explicit diff, not assumed equality</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="110" y1="130" x2="280" y2="220"/>
    <line x1="320" y1="130" x2="320" y2="220"/>
    <line x1="530" y1="130" x2="360" y2="220"/>
  </g>
  <text x="320" y="305" fill="#f85149" font-size="11" text-anchor="middle">Conflating these into one mutable Order object is the root cause of most OMS bugs.</text>
</svg>
