<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Walk-Forward Validation with Purge Gap</text>
  <g font-size="11" fill="#c9d1d9">
    <text x="20" y="80">Split 1</text>
    <text x="20" y="130">Split 2</text>
    <text x="20" y="180">Split 3</text>
  </g>
  <g>
    <rect x="80" y="65" width="180" height="20" fill="#58a6ff" opacity="0.7"/>
    <rect x="260" y="65" width="15" height="20" fill="#f85149" opacity="0.7"/>
    <rect x="275" y="65" width="70" height="20" fill="#3fb950" opacity="0.7"/>

    <rect x="140" y="115" width="180" height="20" fill="#58a6ff" opacity="0.7"/>
    <rect x="320" y="115" width="15" height="20" fill="#f85149" opacity="0.7"/>
    <rect x="335" y="115" width="70" height="20" fill="#3fb950" opacity="0.7"/>

    <rect x="200" y="165" width="180" height="20" fill="#58a6ff" opacity="0.7"/>
    <rect x="380" y="165" width="15" height="20" fill="#f85149" opacity="0.7"/>
    <rect x="395" y="165" width="70" height="20" fill="#3fb950" opacity="0.7"/>
  </g>
  <text x="170" y="210" fill="#58a6ff" font-size="11" text-anchor="middle">Train (expanding/rolling)</text>
  <text x="340" y="230" fill="#f85149" font-size="11" text-anchor="middle">Purge gap (horizon length)</text>
  <text x="410" y="210" fill="#3fb950" font-size="11" text-anchor="middle">Test</text>
  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Each split trains only on the past and tests strictly on the following period, never shuffled like K-fold.</text>
</svg>
