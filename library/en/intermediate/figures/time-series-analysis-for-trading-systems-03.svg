<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Time Bars vs Volume Bars</text>
  <text x="160" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Time bars (fixed clock interval)</text>
  <g fill="#161b22" stroke="#58a6ff">
    <rect x="60" y="70" width="30" height="80"/>
    <rect x="95" y="70" width="30" height="80"/>
    <rect x="130" y="70" width="30" height="80"/>
    <rect x="165" y="70" width="30" height="80"/>
    <rect x="200" y="70" width="30" height="80"/>
    <rect x="235" y="70" width="30" height="80"/>
  </g>
  <g fill="#58a6ff" opacity="0.5">
    <rect x="63" y="140" width="24" height="8"/>
    <rect x="98" y="80" width="24" height="68"/>
    <rect x="133" y="130" width="24" height="18"/>
    <rect x="168" y="75" width="24" height="73"/>
    <rect x="203" y="135" width="24" height="13"/>
    <rect x="238" y="120" width="24" height="28"/>
  </g>
  <text x="160" y="168" fill="#8b949e" font-size="10" text-anchor="middle">uneven information content per bar</text>

  <text x="480" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Volume bars (fixed traded quantity)</text>
  <g fill="#161b22" stroke="#3fb950">
    <rect x="360" y="70" width="30" height="80"/>
    <rect x="405" y="70" width="45" height="80"/>
    <rect x="465" y="70" width="20" height="80"/>
    <rect x="500" y="70" width="55" height="80"/>
    <rect x="570" y="70" width="25" height="80"/>
  </g>
  <g fill="#3fb950" opacity="0.5">
    <rect x="363" y="90" width="24" height="58"/>
    <rect x="408" y="90" width="39" height="58"/>
    <rect x="468" y="90" width="14" height="58"/>
    <rect x="503" y="90" width="49" height="58"/>
    <rect x="573" y="90" width="19" height="58"/>
  </g>
  <text x="480" y="168" fill="#8b949e" font-size="10" text-anchor="middle">bar width varies with clock time, information density stays uniform</text>
  <text x="320" y="230" fill="#8b949e" font-size="11" text-anchor="middle">Each volume bar closes after the same amount of traded shares, not the same amount of clock time</text>
</svg>
