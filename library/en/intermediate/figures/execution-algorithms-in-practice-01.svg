<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">TWAP vs VWAP Schedule Shape</text>
  <line x1="50" y1="250" x2="600" y2="250" stroke="#30363d"/>
  <line x1="50" y1="70" x2="50" y2="250" stroke="#30363d"/>
  <!-- TWAP equal bars -->
  <g fill="#58a6ff" opacity="0.85">
    <rect x="60" y="200" width="20" height="50"/>
    <rect x="90" y="200" width="20" height="50"/>
    <rect x="120" y="200" width="20" height="50"/>
    <rect x="150" y="200" width="20" height="50"/>
    <rect x="180" y="200" width="20" height="50"/>
    <rect x="210" y="200" width="20" height="50"/>
    <rect x="240" y="200" width="20" height="50"/>
    <rect x="270" y="200" width="20" height="50"/>
  </g>
  <!-- VWAP volume-shaped bars (U shape) -->
  <g fill="#3fb950" opacity="0.85">
    <rect x="330" y="110" width="20" height="140"/>
    <rect x="360" y="150" width="20" height="100"/>
    <rect x="390" y="195" width="20" height="55"/>
    <rect x="420" y="215" width="20" height="35"/>
    <rect x="450" y="215" width="20" height="35"/>
    <rect x="480" y="195" width="20" height="55"/>
    <rect x="510" y="150" width="20" height="100"/>
    <rect x="540" y="105" width="20" height="145"/>
  </g>
  <text x="165" y="270" fill="#58a6ff" font-size="12" text-anchor="middle">TWAP: equal clips per interval</text>
  <text x="435" y="270" fill="#3fb950" font-size="12" text-anchor="middle">VWAP: clips follow historical volume curve</text>
  <text x="320" y="295" fill="#8b949e" font-size="11" text-anchor="middle">Time of day (open on left, close on right)</text>
</svg>
