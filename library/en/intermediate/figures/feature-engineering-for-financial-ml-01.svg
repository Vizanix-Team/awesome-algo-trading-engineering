<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Centered Window Leaks Future Information</text>
  <line x1="60" y1="140" x2="580" y2="140" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="320" cy="140" r="6" fill="#c9d1d9"/>
  <text x="320" y="125" fill="#c9d1d9" font-size="11" text-anchor="middle">t (current row)</text>
  <rect x="200" y="150" width="120" height="20" fill="#3fb950" opacity="0.5"/>
  <text x="260" y="190" fill="#3fb950" font-size="10" text-anchor="middle">past -- known at t</text>
  <rect x="320" y="150" width="120" height="20" fill="#f85149" opacity="0.6"/>
  <text x="380" y="190" fill="#f85149" font-size="10" text-anchor="middle">future -- NOT known at t</text>
  <text x="320" y="215" fill="#c9d1d9" font-size="12" text-anchor="middle">rolling(window=20, center=True) uses both halves</text>

  <rect x="140" y="240" width="180" height="20" fill="#3fb950" opacity="0.5"/>
  <text x="230" y="278" fill="#3fb950" font-size="11" text-anchor="middle">rolling(window=20) trailing only</text>
  <circle cx="320" cy="250" r="5" fill="#c9d1d9"/>
</svg>
