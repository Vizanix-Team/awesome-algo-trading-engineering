<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Pillars, Layered on Business Correctness</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="40" y="60" width="160" height="70" rx="6" stroke="#58a6ff"/>
    <rect x="240" y="60" width="160" height="70" rx="6" stroke="#a371f7"/>
    <rect x="440" y="60" width="160" height="70" rx="6" stroke="#3fb950"/>
    <rect x="140" y="200" width="360" height="60" rx="6" stroke="#f85149"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="120" y="88" fill="#58a6ff">Metrics</text>
    <text x="120" y="105" fill="#8b949e" font-size="10">orders/sec, fill rate,</text>
    <text x="120" y="118" fill="#8b949e" font-size="10">reject rate by reason</text>
    <text x="320" y="88" fill="#a371f7">Logs</text>
    <text x="320" y="105" fill="#8b949e" font-size="10">structured, correlation-ID</text>
    <text x="320" y="118" fill="#8b949e" font-size="10">tagged per order</text>
    <text x="520" y="88" fill="#3fb950">Traces</text>
    <text x="520" y="105" fill="#8b949e" font-size="10">strategy to exchange</text>
    <text x="520" y="118" fill="#8b949e" font-size="10">and back, per order</text>
    <text x="320" y="228" fill="#f85149">Business Correctness Checks</text>
    <text x="320" y="244" fill="#8b949e" font-size="10">position matches exchange? risk view current? every order acked/filled/rejected?</text>
  </g>
  <defs>
    <marker id="obs" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#obs)">
    <line x1="120" y1="130" x2="250" y2="200"/>
    <line x1="320" y1="130" x2="320" y2="200"/>
    <line x1="520" y1="130" x2="390" y2="200"/>
  </g>
  <text x="320" y="285" fill="#8b949e" font-size="11" text-anchor="middle">A healthy machine can still produce silently wrong trading outcomes without this layer.</text>
</svg>
