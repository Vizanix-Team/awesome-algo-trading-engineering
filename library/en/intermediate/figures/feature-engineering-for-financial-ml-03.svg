<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Feature Decay vs Regime-Dependence</text>
  <text x="160" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Decaying feature</text>
  <line x1="60" y1="150" x2="260" y2="150" stroke="#30363d" stroke-dasharray="2,4"/>
  <polyline points="60,80 100,90 140,105 180,120 220,135 260,146" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="160" y="185" fill="#8b949e" font-size="10" text-anchor="middle">IC trending steadily toward zero -- retire it</text>

  <text x="480" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Regime-dependent feature</text>
  <line x1="380" y1="150" x2="580" y2="150" stroke="#30363d" stroke-dasharray="2,4"/>
  <polyline points="380,90 410,85 440,140 470,210 500,215 530,150 560,95 580,90" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="480" y="185" fill="#8b949e" font-size="10" text-anchor="middle">IC swings with regime -- condition its use, don't discard</text>

  <text x="30" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90 30 150)">Information coefficient</text>
  <text x="320" y="250" fill="#8b949e" font-size="11" text-anchor="middle">Track rolling IC per feature; the shape of the decline tells you what to do about it</text>
</svg>
