<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Triple-Barrier Labeling</text>
  <line x1="60" y1="150" x2="580" y2="150" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="590" y="154" fill="#8b949e" font-size="10">entry</text>
  <line x1="60" y1="80" x2="580" y2="80" stroke="#3fb950" stroke-dasharray="4,3"/>
  <text x="595" y="84" fill="#3fb950" font-size="10">upper</text>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#f85149" stroke-dasharray="4,3"/>
  <text x="595" y="234" fill="#f85149" font-size="10">lower</text>
  <line x1="480" y1="60" x2="480" y2="250" stroke="#8b949e" stroke-dasharray="2,4"/>
  <text x="480" y="265" fill="#8b949e" font-size="10" text-anchor="middle">time barrier</text>

  <polyline points="60,150 100,145 140,130 180,110 220,95 250,82" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <circle cx="250" cy="82" r="6" fill="#3fb950"/>
  <text x="250" y="65" fill="#3fb950" font-size="11" text-anchor="middle">label = +1 (upper hit first)</text>

  <polyline points="60,150 100,155 140,175 180,200 210,225" fill="none" stroke="#a371f7" stroke-width="2.5" opacity="0.7"/>
  <circle cx="210" cy="225" r="6" fill="#f85149"/>
  <text x="210" y="248" fill="#f85149" font-size="11" text-anchor="middle">label = −1 (lower hit first)</text>

  <polyline points="60,150 120,148 200,152 280,149 360,151 440,150 480,150" fill="none" stroke="#d29922" stroke-width="2.5" opacity="0.8"/>
  <circle cx="480" cy="150" r="6" fill="#d29922"/>
  <text x="480" y="135" fill="#d29922" font-size="11" text-anchor="middle">label = 0 (time hit first)</text>
</svg>
