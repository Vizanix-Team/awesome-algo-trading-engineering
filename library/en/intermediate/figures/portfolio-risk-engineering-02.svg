<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Correlations "Going to One" Under Stress</text>
  <text x="160" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Normal regime</text>
  <text x="480" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Stress regime</text>
  <g stroke="#30363d" stroke-width="4">
    <line x1="60" y1="100" x2="260" y2="100"/>
    <line x1="60" y1="140" x2="260" y2="180"/>
    <line x1="60" y1="180" x2="260" y2="140"/>
    <line x1="60" y1="220" x2="260" y2="220"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="60" cy="100" r="8"/><circle cx="60" cy="140" r="8"/><circle cx="60" cy="180" r="8"/><circle cx="60" cy="220" r="8"/>
    <circle cx="260" cy="100" r="8"/><circle cx="260" cy="140" r="8"/><circle cx="260" cy="180" r="8"/><circle cx="260" cy="220" r="8"/>
  </g>
  <text x="160" y="255" fill="#3fb950" font-size="11" text-anchor="middle">low, mixed correlation -- diversification works</text>

  <g stroke="#da3633" stroke-width="4">
    <line x1="380" y1="100" x2="580" y2="100"/>
    <line x1="380" y1="100" x2="580" y2="140"/>
    <line x1="380" y1="100" x2="580" y2="180"/>
    <line x1="380" y1="100" x2="580" y2="220"/>
    <line x1="380" y1="140" x2="580" y2="180"/>
    <line x1="380" y1="180" x2="580" y2="220"/>
  </g>
  <g fill="#f85149">
    <circle cx="380" cy="100" r="8"/><circle cx="380" cy="140" r="8"/><circle cx="380" cy="180" r="8"/><circle cx="380" cy="220" r="8"/>
    <circle cx="580" cy="100" r="8"/><circle cx="580" cy="140" r="8"/><circle cx="580" cy="180" r="8"/><circle cx="580" cy="220" r="8"/>
  </g>
  <text x="480" y="255" fill="#f85149" font-size="11" text-anchor="middle">correlations spike toward one -- diversification evaporates</text>
</svg>
