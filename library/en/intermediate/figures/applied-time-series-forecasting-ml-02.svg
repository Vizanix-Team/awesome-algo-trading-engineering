<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Tree Models vs Sequence Models: When Each Wins</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <text x="320" y="265" fill="#8b949e" font-size="11" text-anchor="middle">Input richness (daily bars -> tick-level order book sequences)</text>
  <text x="25" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90 25 150)">Data volume available</text>
  <rect x="60" y="60" width="260" height="180" fill="#58a6ff" opacity="0.18"/>
  <rect x="320" y="60" width="260" height="180" fill="#a371f7" opacity="0.18"/>
  <text x="190" y="140" fill="#58a6ff" font-size="13" text-anchor="middle">Gradient-boosted trees</text>
  <text x="190" y="158" fill="#8b949e" font-size="10" text-anchor="middle">daily/hourly bars, engineered lags</text>
  <text x="190" y="172" fill="#8b949e" font-size="10" text-anchor="middle">lower infra cost, easy to debug</text>
  <text x="450" y="140" fill="#a371f7" font-size="13" text-anchor="middle">Sequence models</text>
  <text x="450" y="158" fill="#8b949e" font-size="10" text-anchor="middle">tick-level, order book windows</text>
  <text x="450" y="172" fill="#8b949e" font-size="10" text-anchor="middle">needs more data, more infra</text>
</svg>
