<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Slippage Decomposition: Drift vs Impact</text>
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#30363d"/>
  <!-- waterfall -->
  <g fill="#161b22" stroke="#30363d">
    <rect x="90" y="150" width="80" height="80"/>
  </g>
  <text x="130" y="145" fill="#c9d1d9" font-size="12" text-anchor="middle">Arrival Price</text>
  <text x="130" y="215" fill="#8b949e" font-size="11" text-anchor="middle">$100.00</text>

  <rect x="230" y="110" width="80" height="40" fill="#f85149" opacity="0.85"/>
  <line x1="170" y1="150" x2="230" y2="150" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="270" y="100" fill="#f85149" font-size="12" text-anchor="middle">Market Drift</text>
  <text x="270" y="240" fill="#8b949e" font-size="11" text-anchor="middle">benchmark − arrival</text>

  <rect x="370" y="70" width="80" height="40" fill="#da3633" opacity="0.85"/>
  <line x1="310" y1="110" x2="370" y2="110" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="410" y="60" fill="#da3633" font-size="12" text-anchor="middle">Your Impact</text>
  <text x="410" y="240" fill="#8b949e" font-size="11" text-anchor="middle">exec − benchmark</text>

  <rect x="500" y="70" width="80" height="160" fill="#161b22" stroke="#3fb950"/>
  <line x1="450" y1="70" x2="500" y2="70" stroke="#8b949e" stroke-dasharray="3,3"/>
  <text x="540" y="60" fill="#3fb950" font-size="12" text-anchor="middle">Avg Exec Price</text>
  <text x="540" y="255" fill="#8b949e" font-size="11" text-anchor="middle">$100.34</text>
  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Total shortfall = market drift + your impact</text>
</svg>
