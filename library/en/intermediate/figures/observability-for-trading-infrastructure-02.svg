<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Alert Tiers</text>
  <g fill="#161b22" stroke="#da3633" stroke-width="1.5">
    <rect x="60" y="55" width="520" height="55" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#d29922" stroke-width="1.5">
    <rect x="60" y="125" width="520" height="55" rx="6"/>
  </g>
  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="60" y="195" width="520" height="55" rx="6"/>
  </g>
  <g fill="#c9d1d9" font-size="12">
    <text x="80" y="78" fill="#f85149">Page-worthy</text>
    <text x="80" y="96" fill="#8b949e" font-size="10">reconciliation break, risk limit breach, feed outage during market hours -- wake someone up now</text>
    <text x="80" y="148" fill="#d29922">Urgent, not paging</text>
    <text x="80" y="166" fill="#8b949e" font-size="10">latency briefly crossing a soft threshold -- post to a monitored channel, act within the hour</text>
    <text x="80" y="218" fill="#3fb950">Informational</text>
    <text x="80" y="236" fill="#8b949e" font-size="10">a single failed retry on a healthy connection -- log it, review during business hours</text>
  </g>
</svg>
