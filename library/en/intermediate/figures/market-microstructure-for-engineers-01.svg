<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Limit Order Book: Two Sorted Structures</text>
  <text x="180" y="50" fill="#3fb950" font-size="12" text-anchor="middle">Bids (descending)</text>
  <text x="460" y="50" fill="#f85149" font-size="12" text-anchor="middle">Asks (ascending)</text>
  <g fill="#161b22" stroke="#3fb950">
    <rect x="60" y="60" width="240" height="30"/>
    <rect x="60" y="94" width="240" height="30"/>
    <rect x="60" y="128" width="240" height="30"/>
  </g>
  <g fill="#161b22" stroke="#f85149">
    <rect x="340" y="60" width="240" height="30"/>
    <rect x="340" y="94" width="240" height="30"/>
    <rect x="340" y="128" width="240" height="30"/>
  </g>
  <g fill="#c9d1d9" font-size="11">
    <text x="70" y="80">100.02</text>
    <text x="70" y="114">100.01</text>
    <text x="70" y="148">100.00</text>
    <text x="350" y="80">100.03</text>
    <text x="350" y="114">100.04</text>
    <text x="350" y="148">100.05</text>
    <text x="240" y="80" text-anchor="end" fill="#8b949e">FIFO: [200,150,400]</text>
    <text x="240" y="114" text-anchor="end" fill="#8b949e">FIFO: [300,300]</text>
    <text x="240" y="148" text-anchor="end" fill="#8b949e">FIFO: [500]</text>
    <text x="400" y="80" fill="#8b949e">FIFO: [250,250]</text>
    <text x="400" y="114" fill="#8b949e">FIFO: [600]</text>
    <text x="400" y="148" fill="#8b949e">FIFO: [400,200]</text>
  </g>
  <line x1="300" y1="75" x2="340" y2="75" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="180" fill="#58a6ff" font-size="12" text-anchor="middle">Spread = 100.03 − 100.02 = 0.01</text>
  <text x="320" y="200" fill="#8b949e" font-size="11" text-anchor="middle">Best bid and best ask together form the "top of book"</text>
  <text x="320" y="250" fill="#8b949e" font-size="11" text-anchor="middle">Within each price level, orders queue FIFO by arrival time</text>
  <text x="320" y="268" fill="#8b949e" font-size="11" text-anchor="middle">(or split pro-rata by size, depending on the venue)</text>
</svg>
