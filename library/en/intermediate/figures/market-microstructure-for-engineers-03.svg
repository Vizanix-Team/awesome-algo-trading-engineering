<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Depth-Adjusted Effective Cost vs Order Size</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <polyline points="60,235 130,228 200,215 270,195 340,168 410,135 480,100 550,60" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <g fill="#f85149">
    <circle cx="60" cy="235" r="3"/>
    <circle cx="200" cy="215" r="3"/>
    <circle cx="340" cy="168" r="3"/>
    <circle cx="480" cy="100" r="3"/>
  </g>
  <text x="320" y="265" fill="#8b949e" font-size="11" text-anchor="middle">Order size (shares, relative to top-of-book depth)</text>
  <text x="30" y="150" fill="#8b949e" font-size="11" text-anchor="middle" transform="rotate(-90 30 150)">Effective cost (bps vs mid)</text>
