<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Aggregate-Only Reconciliation Can Hide a Break</text>
  <g fill="#161b22" stroke="#30363d">
    <rect x="60" y="60" width="200" height="60" rx="6" stroke="#f85149"/>
    <rect x="380" y="60" width="200" height="60" rx="6" stroke="#f85149"/>
    <rect x="220" y="200" width="200" height="60" rx="6" stroke="#3fb950"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="160" y="88">Venue A</text>
    <text x="160" y="105" fill="#f85149" font-size="11">long +100 (wrong, should be 0)</text>
    <text x="480" y="88">Venue B</text>
    <text x="480" y="105" fill="#f85149" font-size="11">short −100 (wrong, should be 0)</text>
    <text x="320" y="228">Firm-Wide Net Position</text>
    <text x="320" y="245" fill="#3fb950" font-size="11">nets to 0 -- looks perfectly correct</text>
  </g>
  <defs>
    <marker id="sr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#sr)">
    <line x1="160" y1="120" x2="280" y2="200"/>
    <line x1="480" y1="120" x2="380" y2="200"/>
  </g>
  <text x="320" y="285" fill="#8b949e" font-size="11" text-anchor="middle">Reconcile at venue level first; two compensating errors are invisible from the aggregate view alone.</text>
</svg>
