<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Latency Simulation as Explicit Event Delay</text>
  <defs>
    <marker id="lg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <line x1="60" y1="120" x2="580" y2="120" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="100" cy="120" r="5" fill="#a371f7"/>
  <text x="100" y="100" fill="#a371f7" font-size="11" text-anchor="middle">Signal</text>
  <text x="100" y="140" fill="#8b949e" font-size="10" text-anchor="middle">t = 0</text>
  <line x1="107" y1="120" x2="280" y2="120" stroke="#58a6ff" stroke-width="2" marker-end="url(#lg)"/>
  <text x="190" y="105" fill="#58a6ff" font-size="11" text-anchor="middle">sampled network delay</text>
  <circle cx="290" cy="120" r="5" fill="#58a6ff"/>
  <text x="290" y="100" fill="#58a6ff" font-size="11" text-anchor="middle">Order arrives</text>
  <text x="290" y="140" fill="#8b949e" font-size="10" text-anchor="middle">t + 1.8ms</text>
  <line x1="297" y1="120" x2="480" y2="120" stroke="#3fb950" stroke-width="2" marker-end="url(#lg)"/>
  <text x="390" y="105" fill="#3fb950" font-size="11" text-anchor="middle">sampled ack delay</text>
  <circle cx="490" cy="120" r="5" fill="#3fb950"/>
  <text x="490" y="100" fill="#3fb950" font-size="11" text-anchor="middle">Fill known</text>
  <text x="490" y="140" fill="#8b949e" font-size="10" text-anchor="middle">t + 3.1ms</text>

  <text x="320" y="190" fill="#c9d1d9" font-size="12" text-anchor="middle">Delay sampled from an empirical latency distribution, not a fixed constant</text>
  <g fill="#a371f7" opacity="0.8">
    <rect x="260" y="240" width="10" height="20"/>
    <rect x="272" y="220" width="10" height="40"/>
    <rect x="284" y="200" width="10" height="60"/>
    <rect x="296" y="215" width="10" height="45"/>
    <rect x="308" y="235" width="10" height="25"/>
    <rect x="320" y="250" width="10" height="10"/>
    <rect x="332" y="255" width="10" height="5"/>
    <rect x="380" y="257" width="8" height="3" fill="#f85149"/>
  </g>
  <text x="300" y="275" fill="#8b949e" font-size="10" text-anchor="middle">typical</text>
  <text x="384" y="275" fill="#f85149" font-size="10" text-anchor="middle">heavy tail</text>
</svg>
