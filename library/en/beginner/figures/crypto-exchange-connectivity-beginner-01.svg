<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Custodial vs. Non-Custodial Exchanges</text>

  <rect x="60" y="70" width="220" height="180" rx="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="170" y="100" fill="#58a6ff" font-size="13" text-anchor="middle">Custodial</text>
  <text x="170" y="130" fill="#8b949e" font-size="11" text-anchor="middle">Exchange holds your</text>
  <text x="170" y="145" fill="#8b949e" font-size="11" text-anchor="middle">funds, like a bank</text>
  <text x="170" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Familiar API pattern,</text>
  <text x="170" y="190" fill="#8b949e" font-size="11" text-anchor="middle">easiest starting point</text>
  <text x="170" y="220" fill="#f0883e" font-size="11" text-anchor="middle">Risk: counterparty risk</text>

  <rect x="360" y="70" width="220" height="180" rx="8" fill="none" stroke="#a371f7" stroke-width="2"/>
  <text x="470" y="100" fill="#a371f7" font-size="13" text-anchor="middle">Non-Custodial</text>
  <text x="470" y="130" fill="#8b949e" font-size="11" text-anchor="middle">You keep control of funds</text>
  <text x="470" y="145" fill="#8b949e" font-size="11" text-anchor="middle">in your own wallet</text>
  <text x="470" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Trades run through</text>
  <text x="470" y="190" fill="#8b949e" font-size="11" text-anchor="middle">public blockchain code</text>
  <text x="470" y="220" fill="#f0883e" font-size="11" text-anchor="middle">Risk: your own key security</text>

  <text x="320" y="285" fill="#8b949e" font-size="12" text-anchor="middle">A custodial exchange is the more approachable starting point for a first automated project</text>
</svg>
