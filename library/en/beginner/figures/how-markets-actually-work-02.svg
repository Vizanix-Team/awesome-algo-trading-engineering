<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">Tight Spread vs. Wide Spread</text>

  <text x="160" y="60" fill="#8b949e" font-size="12" text-anchor="middle">Liquid market</text>
  <line x1="60" y1="150" x2="260" y2="150" stroke="#30363d" stroke-width="2"/>
  <circle cx="150" cy="150" r="5" fill="#3fb950"/>
  <text x="150" y="135" fill="#3fb950" font-size="11" text-anchor="middle">Bid $99.99</text>
  <circle cx="170" cy="150" r="5" fill="#f85149"/>
  <text x="170" y="175" fill="#f85149" font-size="11" text-anchor="middle">Ask $100.01</text>
  <text x="160" y="200" fill="#8b949e" font-size="11" text-anchor="middle">Spread: $0.02</text>

  <text x="480" y="60" fill="#8b949e" font-size="12" text-anchor="middle">Illiquid market</text>
  <line x1="380" y1="150" x2="580" y2="150" stroke="#30363d" stroke-width="2"/>
  <circle cx="410" cy="150" r="5" fill="#3fb950"/>
  <text x="410" y="135" fill="#3fb950" font-size="11" text-anchor="middle">Bid $98.50</text>
  <circle cx="550" cy="150" r="5" fill="#f85149"/>
  <text x="550" y="175" fill="#f85149" font-size="11" text-anchor="middle">Ask $101.50</text>
  <text x="480" y="200" fill="#8b949e" font-size="11" text-anchor="middle">Spread: $3.00</text>

  <text x="320" y="260" fill="#8b949e" font-size="12" text-anchor="middle">Every round trip pays the spread — it is a real, recurring cost</text>
  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">for active traders and steady income for market makers.</text>
</svg>
