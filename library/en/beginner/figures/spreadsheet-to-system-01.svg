<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="24" fill="#c9d1d9" font-size="16" text-anchor="middle">From Spreadsheet to Live System</text>
  <g font-size="10" fill="#0d1117" text-anchor="middle">
    <rect x="10" y="140" width="95" height="50" rx="6" fill="#8b949e"/>
    <text x="57" y="162">Spreadsheet</text>
    <text x="57" y="176">idea</text>

    <rect x="120" y="140" width="95" height="50" rx="6" fill="#58a6ff"/>
    <text x="167" y="162">Precise</text>
    <text x="167" y="176">written rules</text>

    <rect x="230" y="140" width="95" height="50" rx="6" fill="#a371f7"/>
    <text x="277" y="162">Python</text>
    <text x="277" y="176">decision function</text>

    <rect x="340" y="140" width="95" height="50" rx="6" fill="#f0883e"/>
    <text x="387" y="162">Real</text>
    <text x="387" y="176">backtest</text>

    <rect x="450" y="140" width="85" height="50" rx="6" fill="#3fb950"/>
    <text x="492" y="162">Live loop +</text>
    <text x="492" y="176">testnet</text>

    <rect x="550" y="140" width="80" height="50" rx="6" fill="#f85149"/>
    <text x="590" y="162">Small</text>
    <text x="590" y="176">real capital</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" marker-end="url(#a9)">
    <line x1="105" y1="165" x2="118" y2="165"/>
    <line x1="215" y1="165" x2="228" y2="165"/>
    <line x1="325" y1="165" x2="338" y2="165"/>
    <line x1="435" y1="165" x2="448" y2="165"/>
    <line x1="535" y1="165" x2="548" y2="165"/>
  </g>
  <defs><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="240" fill="#8b949e" font-size="12" text-anchor="middle">The same decision function is reused, unchanged, from backtest through to the live loop</text>
</svg>
