<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Ticks Compressed Into One Bar</text>

  <line x1="60" y1="220" x2="580" y2="220" stroke="#30363d" stroke-width="1"/>
  <g fill="#58a6ff">
    <circle cx="90" cy="190" r="4"/>
    <circle cx="130" cy="140" r="4"/>
    <circle cx="160" cy="170" r="4"/>
    <circle cx="190" cy="100" r="4"/>
    <circle cx="220" cy="150" r="4"/>
    <circle cx="250" cy="200" r="4"/>
    <circle cx="270" cy="160" r="4"/>
  </g>
  <text x="180" y="70" fill="#8b949e" font-size="12" text-anchor="middle">Irregular trade ticks over one minute</text>

  <line x1="320" y1="200" x2="420" y2="200" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a3)"/>
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>

  <g>
    <line x1="500" y1="100" x2="500" y2="210" stroke="#3fb950" stroke-width="2"/>
    <rect x="480" y="140" width="40" height="50" fill="#3fb950"/>
    <text x="500" y="90" fill="#8b949e" font-size="11" text-anchor="middle">High</text>
    <text x="500" y="225" fill="#8b949e" font-size="11" text-anchor="middle">Low</text>
    <text x="440" y="140" fill="#8b949e" font-size="10" text-anchor="middle">Open</text>
    <text x="560" y="188" fill="#8b949e" font-size="10" text-anchor="middle">Close</text>
  </g>
  <text x="500" y="260" fill="#8b949e" font-size="12" text-anchor="middle">One 1-minute OHLCV bar</text>
  <text x="320" y="295" fill="#8b949e" font-size="11" text-anchor="middle">Open = first tick, Close = last tick, High/Low = extremes, Volume = sum of quantities</text>
</svg>
