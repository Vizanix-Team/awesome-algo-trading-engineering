<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Normal Assumption vs. Real "Fat-Tailed" Returns</text>
  <line x1="60" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <path d="M60,250 C150,250 200,60 320,60 C440,60 490,250 580,250" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M60,250 C150,250 190,90 260,90 C300,90 300,240 320,244 C340,240 340,90 380,90 C450,90 490,250 580,250" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="0"/>
  <text x="480" y="80" fill="#58a6ff" font-size="11" text-anchor="middle">Normal assumption</text>
  <text x="480" y="100" fill="#f85149" font-size="11" text-anchor="middle">Real fat-tailed returns</text>
  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">Extreme moves in both directions happen more often than a bell curve predicts</text>
</svg>
