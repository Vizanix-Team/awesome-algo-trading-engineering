<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">A Single Neuron as a Weighted Vote</text>

  <circle cx="100" cy="80" r="10" fill="#58a6ff"/>
  <text x="60" y="84" fill="#8b949e" font-size="11" text-anchor="end">Cloudiness</text>
  <circle cx="100" cy="160" r="10" fill="#58a6ff"/>
  <text x="60" y="164" fill="#8b949e" font-size="11" text-anchor="end">Humidity</text>
  <circle cx="100" cy="240" r="10" fill="#58a6ff"/>
  <text x="60" y="244" fill="#8b949e" font-size="11" text-anchor="end">Forecast says rain</text>

  <circle cx="340" cy="160" r="35" fill="#a371f7"/>
  <text x="340" y="155" fill="#0d1117" font-size="11" text-anchor="middle">weighted</text>
  <text x="340" y="170" fill="#0d1117" font-size="11" text-anchor="middle">sum + bias</text>

  <line x1="110" y1="80" x2="308" y2="150" stroke="#8b949e" stroke-width="1"/>
  <text x="200" y="105" fill="#8b949e" font-size="9">weight 0.2</text>
  <line x1="110" y1="160" x2="305" y2="160" stroke="#8b949e" stroke-width="1"/>
  <text x="200" y="152" fill="#8b949e" font-size="9">weight 0.1</text>
  <line x1="110" y1="240" x2="308" y2="170" stroke="#8b949e" stroke-width="2.5"/>
  <text x="200" y="220" fill="#8b949e" font-size="9">weight 0.7</text>

  <line x1="375" y1="160" x2="470" y2="160" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a10)"/>
  <circle cx="520" cy="160" r="30" fill="#3fb950"/>
  <text x="520" y="155" fill="#0d1117" font-size="10" text-anchor="middle">squash</text>
  <text x="520" y="168" fill="#0d1117" font-size="10" text-anchor="middle">function</text>
  <defs><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>

  <text x="320" y="290" fill="#8b949e" font-size="12" text-anchor="middle">Bring an umbrella? — the weights decide how much each input matters, and are learned from data</text>
</svg>
