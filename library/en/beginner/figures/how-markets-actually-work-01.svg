<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Order Types on a Price Line</text>
  <line x1="60" y1="160" x2="580" y2="160" stroke="#30363d" stroke-width="2"/>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="120" y="180">$90</text>
    <text x="320" y="180">$100</text>
    <text x="480" y="180">$104</text>
  </g>
  <circle cx="120" cy="160" r="5" fill="#f85149"/>
  <circle cx="320" cy="160" r="5" fill="#58a6ff"/>
  <circle cx="480" cy="160" r="5" fill="#3fb950"/>

  <text x="120" y="120" fill="#f85149" font-size="11" text-anchor="middle">Stop order</text>
  <text x="120" y="134" fill="#8b949e" font-size="10" text-anchor="middle">triggers if price</text>
  <text x="120" y="147" fill="#8b949e" font-size="10" text-anchor="middle">falls to $90, then sells</text>

  <text x="320" y="120" fill="#58a6ff" font-size="11" text-anchor="middle">Market order</text>
  <text x="320" y="134" fill="#8b949e" font-size="10" text-anchor="middle">executes now at</text>
  <text x="320" y="147" fill="#8b949e" font-size="10" text-anchor="middle">the current $100</text>

  <text x="480" y="120" fill="#3fb950" font-size="11" text-anchor="middle">Limit order</text>
  <text x="480" y="134" fill="#8b949e" font-size="10" text-anchor="middle">waits to buy at</text>
  <text x="480" y="147" fill="#8b949e" font-size="10" text-anchor="middle">$104 or better</text>

  <text x="320" y="230" fill="#8b949e" font-size="12" text-anchor="middle">Current price: $100</text>
  <text x="320" y="260" fill="#8b949e" font-size="11" text-anchor="middle">Market: certainty of fill, no price control</text>
  <text x="320" y="278" fill="#8b949e" font-size="11" text-anchor="middle">Limit: price control, no certainty of fill</text>
</svg>
