<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Splitting History: In-Sample vs. Out-of-Sample</text>
  <rect x="60" y="120" width="340" height="60" fill="#58a6ff"/>
  <text x="230" y="155" fill="#0d1117" font-size="12" text-anchor="middle">In-sample: develop &amp; tune the strategy</text>
  <rect x="400" y="120" width="180" height="60" fill="#3fb950"/>
  <text x="490" y="155" fill="#0d1117" font-size="12" text-anchor="middle">Out-of-sample</text>
  <text x="490" y="169" fill="#0d1117" font-size="10" text-anchor="middle">checked once, at the end</text>
  <line x1="400" y1="100" x2="400" y2="200" stroke="#c9d1d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="230" y="105" fill="#8b949e" font-size="11" text-anchor="middle">Earlier period</text>
  <text x="490" y="105" fill="#8b949e" font-size="11" text-anchor="middle">Later period</text>
  <text x="320" y="230" fill="#8b949e" font-size="12" text-anchor="middle">If performance drops sharply on the untouched slice, that gap</text>
  <text x="320" y="248" fill="#8b949e" font-size="12" text-anchor="middle">is a strong warning sign of overfitting.</text>
</svg>
