<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">Anatomy of a Trading System</text>
  <g font-size="12" fill="#0d1117" text-anchor="middle">
    <rect x="20" y="120" width="100" height="60" rx="6" fill="#58a6ff"/>
    <text x="70" y="145" font-size="11">Market Data</text>
    <text x="70" y="160" font-size="11">Feed</text>

    <rect x="150" y="120" width="100" height="60" rx="6" fill="#a371f7"/>
    <text x="200" y="145" font-size="11">Strategy /</text>
    <text x="200" y="160" font-size="11">Signal Layer</text>

    <rect x="280" y="120" width="100" height="60" rx="6" fill="#f0883e"/>
    <text x="330" y="145" font-size="11">Risk</text>
    <text x="330" y="160" font-size="11">Management</text>

    <rect x="410" y="120" width="100" height="60" rx="6" fill="#3fb950"/>
    <text x="460" y="145" font-size="11">Order</text>
    <text x="460" y="160" font-size="11">Management</text>

    <rect x="540" y="120" width="80" height="60" rx="6" fill="#8b949e"/>
    <text x="580" y="145" font-size="10">Monitoring</text>
    <text x="580" y="160" font-size="10">&amp; Logging</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" marker-end="url(#arrow)">
    <line x1="120" y1="150" x2="148" y2="150"/>
    <line x1="250" y1="150" x2="278" y2="150"/>
    <line x1="380" y1="150" x2="408" y2="150"/>
    <line x1="510" y1="150" x2="538" y2="150"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <text x="320" y="220" fill="#8b949e" font-size="12" text-anchor="middle">Data flows in, a decision comes out, risk checks it, an order goes to market, and everything is logged.</text>
  <text x="70" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Prices, trades,</text>
  <text x="70" y="268" fill="#8b949e" font-size="11" text-anchor="middle">order book updates</text>
  <text x="330" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Can veto any order</text>
  <text x="330" y="268" fill="#8b949e" font-size="11" text-anchor="middle">regardless of the signal</text>
</svg>
