<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Drawdown: Peak, Trough, and Recovery</text>
  <line x1="60" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <polyline points="60,180 120,140 180,120 240,200 300,230 360,215 420,170 480,130 540,110" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="180" cy="120" r="4" fill="#3fb950"/>
  <text x="180" y="105" fill="#3fb950" font-size="11" text-anchor="middle">Peak</text>
  <circle cx="300" cy="230" r="4" fill="#f85149"/>
  <text x="300" y="248" fill="#f85149" font-size="11" text-anchor="middle">Trough</text>
  <circle cx="480" cy="130" r="4" fill="#3fb950"/>
  <text x="480" y="115" fill="#3fb950" font-size="11" text-anchor="middle">Recovered</text>
  <line x1="180" y1="120" x2="300" y2="120" stroke="#8b949e" stroke-dasharray="3,3"/>
  <line x1="300" y1="120" x2="300" y2="230" stroke="#f85149" stroke-dasharray="3,3"/>
  <text x="320" y="290" fill="#8b949e" font-size="12" text-anchor="middle">Decide, while calm, what drawdown depth would make you pause — before you are living through one</text>
</svg>
