<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Leverage Multiplies the Move Needed to Wipe You Out</text>
  <line x1="70" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Price Move to Zero Collateral</text>

  <rect x="110" y="150" width="70" height="100" fill="#3fb950"/>
  <text x="145" y="140" fill="#8b949e" font-size="11" text-anchor="middle">100%</text>
  <text x="145" y="270" fill="#8b949e" font-size="11" text-anchor="middle">1x (no leverage)</text>

  <rect x="230" y="220" width="70" height="30" fill="#58a6ff"/>
  <text x="265" y="210" fill="#8b949e" font-size="11" text-anchor="middle">20%</text>
  <text x="265" y="270" fill="#8b949e" font-size="11" text-anchor="middle">5x leverage</text>

  <rect x="350" y="235" width="70" height="15" fill="#f0883e"/>
  <text x="385" y="225" fill="#8b949e" font-size="11" text-anchor="middle">10%</text>
  <text x="385" y="270" fill="#8b949e" font-size="11" text-anchor="middle">10x leverage</text>

  <rect x="470" y="245" width="70" height="5" fill="#f85149"/>
  <text x="505" y="240" fill="#8b949e" font-size="11" text-anchor="middle">3%</text>
  <text x="505" y="270" fill="#8b949e" font-size="11" text-anchor="middle">33x leverage</text>

  <text x="320" y="300" fill="#8b949e" font-size="12" text-anchor="middle">At 10x leverage, an ordinary 10% adverse move wipes out all posted collateral</text>
</svg>
