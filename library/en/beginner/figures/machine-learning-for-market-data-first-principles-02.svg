<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Chronological Split, Not a Random Shuffle</text>

  <text x="320" y="60" fill="#3fb950" font-size="12" text-anchor="middle">Correct: split by time</text>
  <rect x="60" y="80" width="240" height="40" fill="#58a6ff"/>
  <text x="180" y="105" fill="#0d1117" font-size="11" text-anchor="middle">Train (earlier)</text>
  <rect x="300" y="80" width="120" height="40" fill="#a371f7"/>
  <text x="360" y="105" fill="#0d1117" font-size="10" text-anchor="middle">Validate</text>
  <rect x="420" y="80" width="160" height="40" fill="#3fb950"/>
  <text x="500" y="105" fill="#0d1117" font-size="11" text-anchor="middle">Test (later, once)</text>

  <text x="320" y="180" fill="#f85149" font-size="12" text-anchor="middle">Wrong: shuffled randomly across time</text>
  <g>
    <rect x="60" y="200" width="30" height="40" fill="#58a6ff"/>
    <rect x="95" y="200" width="30" height="40" fill="#3fb950"/>
    <rect x="130" y="200" width="30" height="40" fill="#a371f7"/>
    <rect x="165" y="200" width="30" height="40" fill="#58a6ff"/>
    <rect x="200" y="200" width="30" height="40" fill="#3fb950"/>
    <rect x="235" y="200" width="30" height="40" fill="#58a6ff"/>
    <rect x="270" y="200" width="30" height="40" fill="#a371f7"/>
    <rect x="305" y="200" width="30" height="40" fill="#3fb950"/>
    <rect x="340" y="200" width="30" height="40" fill="#58a6ff"/>
    <rect x="375" y="200" width="30" height="40" fill="#a371f7"/>
    <rect x="410" y="200" width="30" height="40" fill="#58a6ff"/>
    <rect x="445" y="200" width="30" height="40" fill="#3fb950"/>
    <rect x="480" y="200" width="30" height="40" fill="#a371f7"/>
    <rect x="515" y="200" width="30" height="40" fill="#3fb950"/>
    <rect x="550" y="200" width="30" height="40" fill="#58a6ff"/>
  </g>
  <text x="320" y="270" fill="#8b949e" font-size="12" text-anchor="middle">Shuffling lets correlated nearby time points leak from test into training,</text>
  <text x="320" y="288" fill="#8b949e" font-size="12" text-anchor="middle">producing an optimistic result that will not hold up live.</text>
</svg>
