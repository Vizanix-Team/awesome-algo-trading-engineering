<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Lifecycle of an Order</text>
  <g font-size="11" fill="#0d1117" text-anchor="middle">
    <rect x="20" y="140" width="110" height="50" rx="6" fill="#58a6ff"/>
    <text x="75" y="170">Submitted</text>
    <rect x="165" y="140" width="110" height="50" rx="6" fill="#a371f7"/>
    <text x="220" y="170">Open</text>
    <rect x="310" y="140" width="130" height="50" rx="6" fill="#f0883e"/>
    <text x="375" y="163">Partially</text>
    <text x="375" y="177">Filled</text>
    <rect x="470" y="90" width="130" height="50" rx="6" fill="#3fb950"/>
    <text x="535" y="120">Filled</text>
    <rect x="470" y="190" width="130" height="50" rx="6" fill="#f85149"/>
    <text x="535" y="215">Canceled /</text>
    <text x="535" y="228">Rejected</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#a7)">
    <line x1="130" y1="165" x2="163" y2="165"/>
    <line x1="275" y1="165" x2="308" y2="165"/>
    <path d="M440,165 C455,150 455,135 468,120"/>
    <path d="M440,165 C455,180 455,195 468,210"/>
    <path d="M220,190 C220,215 468,215 468,215"/>
  </g>
  <defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="270" fill="#8b949e" font-size="12" text-anchor="middle">Always check the actual resulting status after a cancel attempt —</text>
  <text x="320" y="288" fill="#8b949e" font-size="12" text-anchor="middle">a fill and a cancel can race each other at the exchange.</text>
</svg>
