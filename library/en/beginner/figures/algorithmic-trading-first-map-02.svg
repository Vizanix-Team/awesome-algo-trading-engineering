<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">Time Horizon vs. Infrastructure Demands</text>
  <line x1="70" y1="260" x2="600" y2="260" stroke="#30363d" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="260" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Infrastructure Complexity</text>
  <text x="320" y="295" fill="#8b949e" font-size="12" text-anchor="middle">Typical Holding Period</text>

  <g>
    <rect x="100" y="220" width="80" height="40" fill="#3fb950"/>
    <text x="140" y="245" fill="#0d1117" font-size="11" text-anchor="middle">Low</text>
    <text x="140" y="278" fill="#8b949e" font-size="11" text-anchor="middle">Months / Days</text>

    <rect x="230" y="170" width="80" height="90" fill="#58a6ff"/>
    <text x="270" y="220" fill="#0d1117" font-size="11" text-anchor="middle">Medium</text>
    <text x="270" y="278" fill="#8b949e" font-size="11" text-anchor="middle">Minutes / Hours</text>

    <rect x="360" y="90" width="80" height="170" fill="#f0883e"/>
    <text x="400" y="180" fill="#0d1117" font-size="11" text-anchor="middle">High</text>
    <text x="400" y="278" fill="#8b949e" font-size="11" text-anchor="middle">Seconds or Less</text>

    <rect x="490" y="70" width="80" height="190" fill="#f85149"/>
    <text x="530" y="170" fill="#0d1117" font-size="10" text-anchor="middle">Very High</text>
    <text x="530" y="184" fill="#0d1117" font-size="9" text-anchor="middle">(colocation)</text>
    <text x="530" y="278" fill="#8b949e" font-size="11" text-anchor="middle">High-Frequency</text>
  </g>
  <text x="320" y="45" fill="#8b949e" font-size="11" text-anchor="middle">A beginner should start on the left, not the right</text>
</svg>
