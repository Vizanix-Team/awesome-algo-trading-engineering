<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Training Accuracy vs. Unseen Data Accuracy</text>
  <line x1="70" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="70" y1="250" x2="70" y2="60" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Accuracy</text>
  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">Training Time / Model Complexity</text>

  <polyline points="90,220 220,160 350,100 480,70" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="480" y="55" fill="#58a6ff" font-size="11" text-anchor="middle">Training data</text>

  <polyline points="90,220 220,170 350,180 480,225" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="480" y="240" fill="#f85149" font-size="11" text-anchor="middle">New, unseen data</text>

  <text x="320" y="300" fill="#8b949e" font-size="12" text-anchor="middle">Past the crossover point, the network is memorizing noise, not learning a real pattern</text>
</svg>
