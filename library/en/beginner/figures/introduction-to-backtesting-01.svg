<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">The Backtest Engine's Step-by-Step Loop</text>
  <g font-size="11" fill="#0d1117" text-anchor="middle">
    <circle cx="150" cy="150" r="55" fill="#58a6ff"/>
    <text x="150" y="145">Look at data</text>
    <text x="150" y="160">up to time t</text>

    <circle cx="320" cy="150" r="55" fill="#a371f7"/>
    <text x="320" y="145">Ask strategy:</text>
    <text x="320" y="160">buy/sell/hold?</text>

    <circle cx="490" cy="150" r="55" fill="#3fb950"/>
    <text x="490" y="145">Simulate trade,</text>
    <text x="490" y="160">advance to t+1</text>
  </g>
  <path d="M200,150 L270,150" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a5)" fill="none"/>
  <path d="M370,150 L440,150" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a5)" fill="none"/>
  <path d="M490,205 C490,260 150,260 150,205" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a5)" fill="none"/>
  <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="290" fill="#8b949e" font-size="12" text-anchor="middle">The strategy never sees data from beyond its current simulated moment</text>
</svg>
