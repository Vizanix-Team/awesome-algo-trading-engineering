<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">A First Analysis Script, Step by Step</text>
  <g font-size="12" fill="#0d1117" text-anchor="middle">
    <rect x="30" y="140" width="110" height="60" rx="6" fill="#58a6ff"/>
    <text x="85" y="175">Load CSV</text>

    <rect x="165" y="140" width="110" height="60" rx="6" fill="#3fb950"/>
    <text x="220" y="175">Clean</text>

    <rect x="300" y="140" width="110" height="60" rx="6" fill="#a371f7"/>
    <text x="355" y="167">Transform</text>
    <text x="355" y="182">(returns)</text>

    <rect x="435" y="140" width="110" height="60" rx="6" fill="#f0883e"/>
    <text x="490" y="167">Visualize</text>
    <text x="490" y="182">(plot)</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" marker-end="url(#a4)">
    <line x1="140" y1="170" x2="163" y2="170"/>
    <line x1="275" y1="170" x2="298" y2="170"/>
    <line x1="410" y1="170" x2="433" y2="170"/>
  </g>
  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="250" fill="#8b949e" font-size="12" text-anchor="middle">Each step is simple, explainable in one sentence, and reusable</text>
  <text x="320" y="270" fill="#8b949e" font-size="12" text-anchor="middle">the same four stages reappear later in strategy and ML pipelines</text>
</svg>
