<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="24" fill="#c9d1d9" font-size="16" text-anchor="middle">The Disciplined ML Workflow</text>
  <g font-size="10" fill="#0d1117" text-anchor="middle">
    <rect x="10" y="140" width="95" height="50" rx="6" fill="#58a6ff"/>
    <text x="57" y="162">Frame the</text>
    <text x="57" y="176">problem</text>

    <rect x="120" y="140" width="95" height="50" rx="6" fill="#a371f7"/>
    <text x="167" y="162">Build</text>
    <text x="167" y="176">features</text>

    <rect x="230" y="140" width="95" height="50" rx="6" fill="#a371f7"/>
    <text x="277" y="162">Define</text>
    <text x="277" y="176">labels</text>

    <rect x="340" y="140" width="95" height="50" rx="6" fill="#f0883e"/>
    <text x="387" y="162">Split by</text>
    <text x="387" y="176">time</text>

    <rect x="450" y="140" width="85" height="50" rx="6" fill="#3fb950"/>
    <text x="492" y="162">Train</text>
    <text x="492" y="176">simple model</text>

    <rect x="550" y="140" width="80" height="50" rx="6" fill="#f85149"/>
    <text x="590" y="162">Evaluate</text>
    <text x="590" y="176">with costs</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" marker-end="url(#a11)">
    <line x1="105" y1="165" x2="118" y2="165"/>
    <line x1="215" y1="165" x2="228" y2="165"/>
    <line x1="325" y1="165" x2="338" y2="165"/>
    <line x1="435" y1="165" x2="448" y2="165"/>
    <line x1="535" y1="165" x2="548" y2="165"/>
  </g>
  <defs><marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="240" fill="#8b949e" font-size="12" text-anchor="middle">A pattern found in history is not automatically a genuine, repeatable edge</text>
</svg>
