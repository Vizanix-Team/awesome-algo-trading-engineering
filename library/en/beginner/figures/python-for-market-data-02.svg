<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Histogram of Daily Returns</text>
  <line x1="60" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="320" y1="60" x2="320" y2="250" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <g fill="#58a6ff">
    <rect x="90" y="240" width="30" height="10"/>
    <rect x="130" y="220" width="30" height="30"/>
    <rect x="170" y="180" width="30" height="70"/>
    <rect x="210" y="120" width="30" height="130"/>
    <rect x="250" y="80" width="30" height="170"/>
    <rect x="290" y="70" width="30" height="180"/>
    <rect x="330" y="75" width="30" height="175"/>
    <rect x="370" y="110" width="30" height="140"/>
    <rect x="410" y="170" width="30" height="80"/>
    <rect x="450" y="215" width="30" height="35"/>
    <rect x="490" y="235" width="30" height="15"/>
  </g>
  <text x="320" y="270" fill="#8b949e" font-size="12" text-anchor="middle">0% return</text>
  <text x="90" y="270" fill="#8b949e" font-size="11" text-anchor="middle">-3%</text>
  <text x="520" y="270" fill="#8b949e" font-size="11" text-anchor="middle">+3%</text>
  <text x="320" y="45" fill="#8b949e" font-size="12" text-anchor="middle">Most days cluster near zero, with a few larger moves in either direction</text>
</svg>
