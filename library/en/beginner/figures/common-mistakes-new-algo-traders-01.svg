<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">A Suspiciously Clean Backtest vs. a Realistic One</text>
  <line x1="60" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="250" x2="60" y2="60" stroke="#30363d" stroke-width="1"/>

  <polyline points="60,240 130,210 200,175 270,140 340,105 410,80 480,60 550,45" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="550" y="35" fill="#f85149" font-size="11" text-anchor="end">Too smooth — suspect a bug</text>

  <polyline points="60,240 130,230 200,238 270,210 340,220 410,190 480,200 550,175" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="165" fill="#3fb950" font-size="11" text-anchor="end">Realistic — messy but genuine</text>

  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">Real trading is messy; a suspiciously clean equity curve should trigger scrutiny, not excitement</text>
</svg>
