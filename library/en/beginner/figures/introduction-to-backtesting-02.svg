<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Equity Curve: Ignoring Costs vs. Including Costs</text>
  <line x1="60" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="250" x2="60" y2="60" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Portfolio Value</text>
  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">Time</text>

  <polyline points="60,230 130,205 200,170 270,140 340,110 410,90 480,75 550,60" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="560" y="55" fill="#3fb950" font-size="11" text-anchor="end">No costs (unrealistic)</text>

  <polyline points="60,230 130,220 200,210 270,215 340,195 410,205 480,190 550,180" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="560" y="175" fill="#f85149" font-size="11" text-anchor="end">With realistic slippage &amp; fees</text>

  <text x="320" y="300" fill="#8b949e" font-size="11" text-anchor="middle">The same strategy can look wonderful before costs and marginal once costs are included from the start</text>
</svg>
