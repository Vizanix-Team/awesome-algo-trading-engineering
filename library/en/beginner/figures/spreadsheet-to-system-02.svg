<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">A Complete Strategy Definition</text>
  <g font-size="12" fill="#0d1117" text-anchor="middle">
    <rect x="60" y="90" width="150" height="120" rx="8" fill="#3fb950"/>
    <text x="135" y="120" font-size="13">Entry Rule</text>
    <text x="135" y="150" font-size="10">20-period MA above</text>
    <text x="135" y="165" font-size="10">50-period MA, and</text>
    <text x="135" y="180" font-size="10">flat on this instrument</text>

    <rect x="245" y="90" width="150" height="120" rx="8" fill="#f85149"/>
    <text x="320" y="120" font-size="13">Exit Rule</text>
    <text x="320" y="150" font-size="10">Fixed stop loss and</text>
    <text x="320" y="165" font-size="10">profit target, or a</text>
    <text x="320" y="180" font-size="10">max holding time</text>

    <rect x="430" y="90" width="150" height="120" rx="8" fill="#58a6ff"/>
    <text x="505" y="120" font-size="13">Sizing Rule</text>
    <text x="505" y="150" font-size="10">Fixed % of capital</text>
    <text x="505" y="165" font-size="10">risked, scaled by</text>
    <text x="505" y="180" font-size="10">the stop distance</text>
  </g>
  <text x="320" y="255" fill="#8b949e" font-size="12" text-anchor="middle">Each rule must be precise enough that a computer could follow it</text>
  <text x="320" y="273" fill="#8b949e" font-size="12" text-anchor="middle">without ever needing to ask a clarifying question.</text>
</svg>
