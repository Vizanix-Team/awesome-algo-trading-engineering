<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Position Sizing From a 1% Risk Rule</text>
  <text x="320" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Account: $10,000 — risk 1% ($100) per trade</text>

  <g>
    <rect x="80" y="90" width="180" height="150" fill="none" stroke="#58a6ff" stroke-width="2" rx="6"/>
    <text x="170" y="115" fill="#58a6ff" font-size="12" text-anchor="middle">Tight stop: 2%</text>
    <text x="170" y="160" fill="#c9d1d9" font-size="14" text-anchor="middle">Position size</text>
    <text x="170" y="180" fill="#3fb950" font-size="16" text-anchor="middle">$5,000</text>
    <text x="170" y="210" fill="#8b949e" font-size="10" text-anchor="middle">2% x $5,000 = $100</text>
  </g>

  <g>
    <rect x="380" y="90" width="180" height="150" fill="none" stroke="#f0883e" stroke-width="2" rx="6"/>
    <text x="470" y="115" fill="#f0883e" font-size="12" text-anchor="middle">Wide stop: 5%</text>
    <text x="470" y="160" fill="#c9d1d9" font-size="14" text-anchor="middle">Position size</text>
    <text x="470" y="180" fill="#3fb950" font-size="16" text-anchor="middle">$2,000</text>
    <text x="470" y="210" fill="#8b949e" font-size="10" text-anchor="middle">5% x $2,000 = $100</text>
  </g>

  <text x="320" y="280" fill="#8b949e" font-size="12" text-anchor="middle">Same dollar risk per trade — the position shrinks as the stop gets wider</text>
</svg>
