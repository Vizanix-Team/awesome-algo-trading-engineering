<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Price Move on High Volume vs. Low Volume</text>

  <text x="160" y="55" fill="#8b949e" font-size="12" text-anchor="middle">High volume rise</text>
  <polyline points="70,150 130,140 190,110 250,70" fill="none" stroke="#3fb950" stroke-width="2"/>
  <rect x="60" y="220" width="20" height="30" fill="#58a6ff"/>
  <rect x="120" y="205" width="20" height="45" fill="#58a6ff"/>
  <rect x="180" y="180" width="20" height="70" fill="#58a6ff"/>
  <rect x="240" y="160" width="20" height="90" fill="#58a6ff"/>
  <text x="160" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Broad participation — the move is more likely to persist</text>

  <text x="480" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Low volume rise</text>
  <polyline points="390,150 450,140 510,110 570,70" fill="none" stroke="#3fb950" stroke-width="2"/>
  <rect x="380" y="242" width="20" height="8" fill="#58a6ff"/>
  <rect x="440" y="240" width="20" height="10" fill="#58a6ff"/>
  <rect x="500" y="238" width="20" height="12" fill="#58a6ff"/>
  <rect x="560" y="235" width="20" height="15" fill="#58a6ff"/>
  <text x="480" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Thin participation — the move can reverse more easily</text>
</svg>
