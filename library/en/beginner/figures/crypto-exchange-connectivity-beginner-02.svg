<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="24" fill="#c9d1d9" font-size="16" text-anchor="middle">A Safe Path to a Live Connection</text>
  <g font-size="10" fill="#0d1117" text-anchor="middle">
    <rect x="10" y="140" width="110" height="50" rx="6" fill="#58a6ff"/>
    <text x="65" y="162">1. Read-only</text>
    <text x="65" y="176">key, fetch prices</text>

    <rect x="135" y="140" width="110" height="50" rx="6" fill="#3fb950"/>
    <text x="190" y="162">2. Subscribe to</text>
    <text x="190" y="176">WebSocket feed</text>

    <rect x="260" y="140" width="110" height="50" rx="6" fill="#a371f7"/>
    <text x="315" y="162">3. Testnet</text>
    <text x="315" y="176">order practice</text>

    <rect x="385" y="140" width="110" height="50" rx="6" fill="#f0883e"/>
    <text x="440" y="162">4. Small</text>
    <text x="440" y="176">real funds</text>

    <rect x="510" y="140" width="120" height="50" rx="6" fill="#f85149"/>
    <text x="570" y="162">5. Gradually</text>
    <text x="570" y="176">scale capital</text>
  </g>
  <g stroke="#c9d1d9" stroke-width="2" marker-end="url(#a8)">
    <line x1="120" y1="165" x2="133" y2="165"/>
    <line x1="245" y1="165" x2="258" y2="165"/>
    <line x1="370" y1="165" x2="383" y2="165"/>
    <line x1="495" y1="165" x2="508" y2="165"/>
  </g>
  <defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="240" fill="#8b949e" font-size="12" text-anchor="middle">Each step exists because a specific, real failure mode is common at that stage.</text>
  <text x="320" y="258" fill="#8b949e" font-size="12" text-anchor="middle">Never grant withdrawal permission to the API key your trading code uses.</text>
</svg>
