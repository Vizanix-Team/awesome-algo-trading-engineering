<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Confidence Shrinks as Trade Count Grows</text>
  <line x1="70" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Uncertainty Around Result</text>

  <rect x="100" y="100" width="60" height="150" fill="#f85149"/>
  <text x="130" y="270" fill="#8b949e" font-size="11" text-anchor="middle">10 trades</text>

  <rect x="250" y="150" width="60" height="100" fill="#f0883e"/>
  <text x="280" y="270" fill="#8b949e" font-size="11" text-anchor="middle">50 trades</text>

  <rect x="400" y="195" width="60" height="55" fill="#58a6ff"/>
  <text x="430" y="270" fill="#8b949e" font-size="11" text-anchor="middle">200 trades</text>

  <rect x="530" y="220" width="50" height="30" fill="#3fb950"/>
  <text x="555" y="270" fill="#8b949e" font-size="10" text-anchor="middle">500 trades</text>

  <text x="320" y="300" fill="#8b949e" font-size="12" text-anchor="middle">Ten winning trades in a row proves far less than five hundred trades across varied conditions</text>
</svg>
