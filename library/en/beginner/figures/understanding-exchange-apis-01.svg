<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">REST Request-Response vs. WebSocket Stream</text>

  <text x="160" y="55" fill="#58a6ff" font-size="13" text-anchor="middle">REST API</text>
  <rect x="70" y="80" width="60" height="34" rx="4" fill="#58a6ff"/>
  <text x="100" y="101" fill="#0d1117" font-size="10" text-anchor="middle">Your app</text>
  <rect x="220" y="80" width="70" height="34" rx="4" fill="#8b949e"/>
  <text x="255" y="101" fill="#0d1117" font-size="10" text-anchor="middle">Exchange</text>
  <line x1="130" y1="90" x2="218" y2="90" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a6)"/>
  <text x="175" y="82" fill="#8b949e" font-size="9" text-anchor="middle">request</text>
  <line x1="218" y1="105" x2="130" y2="105" stroke="#c9d1d9" stroke-width="2" marker-end="url(#a6)"/>
  <text x="175" y="120" fill="#8b949e" font-size="9" text-anchor="middle">response</text>
  <text x="160" y="150" fill="#8b949e" font-size="10" text-anchor="middle">One-off: prices on demand,</text>
  <text x="160" y="163" fill="#8b949e" font-size="10" text-anchor="middle">placing or canceling orders</text>

  <text x="480" y="55" fill="#3fb950" font-size="13" text-anchor="middle">WebSocket API</text>
  <rect x="390" y="80" width="60" height="34" rx="4" fill="#3fb950"/>
  <text x="420" y="101" fill="#0d1117" font-size="10" text-anchor="middle">Your app</text>
  <rect x="540" y="80" width="70" height="34" rx="4" fill="#8b949e"/>
  <text x="575" y="101" fill="#0d1117" font-size="10" text-anchor="middle">Exchange</text>
  <line x1="450" y1="97" x2="538" y2="97" stroke="#3fb950" stroke-width="2"/>
  <line x1="470" y1="90" x2="470" y2="104" stroke="#3fb950" stroke-width="1"/>
  <line x1="500" y1="90" x2="500" y2="104" stroke="#3fb950" stroke-width="1"/>
  <line x1="530" y1="90" x2="530" y2="104" stroke="#3fb950" stroke-width="1"/>
  <text x="480" y="150" fill="#8b949e" font-size="10" text-anchor="middle">Open connection: continuous</text>
  <text x="480" y="163" fill="#8b949e" font-size="10" text-anchor="middle">trade &amp; order book updates pushed to you</text>

  <defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker></defs>
  <text x="320" y="220" fill="#8b949e" font-size="12" text-anchor="middle">A typical system uses WebSocket for live market data</text>
  <text x="320" y="238" fill="#8b949e" font-size="12" text-anchor="middle">and REST for placing orders and checking balances.</text>
</svg>
