<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Anatomy of a Candlestick</text>

  <line x1="150" y1="60" x2="150" y2="120" stroke="#3fb950" stroke-width="2"/>
  <rect x="120" y="120" width="60" height="80" fill="#3fb950"/>
  <line x1="150" y1="200" x2="150" y2="240" stroke="#3fb950" stroke-width="2"/>
  <text x="150" y="255" fill="#3fb950" font-size="12" text-anchor="middle">Bullish (close &gt; open)</text>

  <text x="230" y="70" fill="#8b949e" font-size="10">High</text>
  <text x="230" y="123" fill="#8b949e" font-size="10">Close</text>
  <text x="230" y="197" fill="#8b949e" font-size="10">Open</text>
  <text x="230" y="235" fill="#8b949e" font-size="10">Low</text>

  <line x1="450" y1="70" x2="450" y2="130" stroke="#f85149" stroke-width="2"/>
  <rect x="420" y="130" width="60" height="60" fill="#f85149"/>
  <line x1="450" y1="190" x2="450" y2="230" stroke="#f85149" stroke-width="2"/>
  <text x="450" y="255" fill="#f85149" font-size="12" text-anchor="middle">Bearish (close &lt; open)</text>

  <text x="530" y="133" fill="#8b949e" font-size="10">Open</text>
  <text x="530" y="187" fill="#8b949e" font-size="10">Close</text>

  <text x="320" y="285" fill="#8b949e" font-size="12" text-anchor="middle">Body = open-to-close range; wicks mark the high and low reached in the period</text>
</svg>
