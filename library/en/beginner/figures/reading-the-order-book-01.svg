<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Sample Order Book Snapshot (Asset near $100)</text>
  <text x="220" y="50" fill="#f85149" font-size="12" text-anchor="middle">Asks (sell orders)</text>
  <text x="420" y="50" fill="#3fb950" font-size="12" text-anchor="middle">Bids (buy orders)</text>

  <g font-size="12" fill="#c9d1d9">
    <text x="120" y="80">Price</text>
    <text x="280" y="80" text-anchor="end">Size</text>
    <text x="360" y="80">Price</text>
    <text x="520" y="80" text-anchor="end">Size</text>
  </g>
  <line x1="60" y1="90" x2="580" y2="90" stroke="#30363d" stroke-width="1"/>

  <g font-size="12">
    <text x="120" y="115" fill="#f85149">$100.15</text>
    <rect x="200" y="103" width="60" height="14" fill="#da3633" opacity="0.5"/>
    <text x="280" y="115" fill="#c9d1d9" text-anchor="end">120</text>

    <text x="120" y="145" fill="#f85149">$100.10</text>
    <rect x="200" y="133" width="38" height="14" fill="#da3633" opacity="0.6"/>
    <text x="280" y="145" fill="#c9d1d9" text-anchor="end">75</text>

    <text x="120" y="175" fill="#f85149">$100.05</text>
    <rect x="200" y="163" width="20" height="14" fill="#da3633" opacity="0.7"/>
    <text x="280" y="175" fill="#c9d1d9" text-anchor="end">40</text>
  </g>

  <line x1="320" y1="90" x2="320" y2="200" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="195" fill="#8b949e" font-size="11" text-anchor="middle">spread = $0.05</text>

  <g font-size="12">
    <text x="360" y="175" fill="#3fb950">$100.00</text>
    <rect x="440" y="163" width="30" height="14" fill="#238636" opacity="0.7"/>
    <text x="520" y="175" fill="#c9d1d9" text-anchor="end">60</text>

    <text x="360" y="145" fill="#3fb950">$99.95</text>
    <rect x="440" y="133" width="45" height="14" fill="#238636" opacity="0.6"/>
    <text x="520" y="145" fill="#c9d1d9" text-anchor="end">90</text>

    <text x="360" y="115" fill="#3fb950">$99.90</text>
    <rect x="440" y="103" width="75" height="14" fill="#238636" opacity="0.5"/>
    <text x="520" y="115" fill="#c9d1d9" text-anchor="end">150</text>
  </g>

  <text x="320" y="240" fill="#8b949e" font-size="11" text-anchor="middle">Best bid $100.00, best ask $100.05 — top of book.</text>
  <text x="320" y="258" fill="#8b949e" font-size="11" text-anchor="middle">Thicker bars mean thicker, harder-to-clear price levels.</text>
</svg>
