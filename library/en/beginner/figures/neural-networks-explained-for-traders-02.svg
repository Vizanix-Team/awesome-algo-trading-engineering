<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="24" fill="#c9d1d9" font-size="16" text-anchor="middle">A Small Network for a Trading Question</text>
  <text x="90" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Input features</text>
  <g fill="#58a6ff">
    <circle cx="90" cy="90" r="10"/>
    <circle cx="90" cy="150" r="10"/>
    <circle cx="90" cy="210" r="10"/>
    <circle cx="90" cy="270" r="10"/>
  </g>
  <text x="10" y="94" fill="#8b949e" font-size="9">returns</text>
  <text x="10" y="154" fill="#8b949e" font-size="9">volatility</text>
  <text x="10" y="214" fill="#8b949e" font-size="9">imbalance</text>
  <text x="10" y="274" fill="#8b949e" font-size="9">volume</text>

  <text x="270" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Hidden layer</text>
  <g fill="#a371f7">
    <circle cx="270" cy="110" r="10"/>
    <circle cx="270" cy="170" r="10"/>
    <circle cx="270" cy="230" r="10"/>
  </g>

  <text x="450" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Hidden layer</text>
  <g fill="#a371f7">
    <circle cx="450" cy="130" r="10"/>
    <circle cx="450" cy="190" r="10"/>
  </g>

  <text x="580" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Output</text>
  <circle cx="580" cy="160" r="12" fill="#3fb950"/>
  <text x="580" y="195" fill="#8b949e" font-size="9" text-anchor="middle">P(price up)</text>

  <g stroke="#30363d" stroke-width="1">
    <line x1="100" y1="90" x2="260" y2="110"/><line x1="100" y1="90" x2="260" y2="170"/><line x1="100" y1="90" x2="260" y2="230"/>
    <line x1="100" y1="150" x2="260" y2="110"/><line x1="100" y1="150" x2="260" y2="170"/><line x1="100" y1="150" x2="260" y2="230"/>
    <line x1="100" y1="210" x2="260" y2="110"/><line x1="100" y1="210" x2="260" y2="170"/><line x1="100" y1="210" x2="260" y2="230"/>
    <line x1="100" y1="270" x2="260" y2="110"/><line x1="100" y1="270" x2="260" y2="170"/><line x1="100" y1="270" x2="260" y2="230"/>
    <line x1="280" y1="110" x2="440" y2="130"/><line x1="280" y1="110" x2="440" y2="190"/>
    <line x1="280" y1="170" x2="440" y2="130"/><line x1="280" y1="170" x2="440" y2="190"/>
    <line x1="280" y1="230" x2="440" y2="130"/><line x1="280" y1="230" x2="440" y2="190"/>
    <line x1="460" y1="130" x2="568" y2="160"/><line x1="460" y1="190" x2="568" y2="160"/>
  </g>
  <text x="320" y="300" fill="#8b949e" font-size="12" text-anchor="middle">Hidden layers are not manually designed — they emerge from training on historical data</text>
</svg>
