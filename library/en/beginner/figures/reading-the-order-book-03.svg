<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Order Book Imbalance Within 10 Cents of Mid</text>

  <line x1="80" y1="250" x2="560" y2="250" stroke="#30363d" stroke-width="1"/>

  <rect x="150" y="90" width="90" height="160" fill="#3fb950"/>
  <text x="195" y="80" fill="#3fb950" font-size="12" text-anchor="middle">Bid Qty</text>
  <text x="195" y="270" fill="#8b949e" font-size="12" text-anchor="middle">500 units</text>

  <rect x="380" y="202" width="90" height="48" fill="#f85149"/>
  <text x="425" y="80" fill="#f85149" font-size="12" text-anchor="middle">Ask Qty</text>
  <text x="425" y="270" fill="#8b949e" font-size="12" text-anchor="middle">150 units</text>

  <text x="320" y="45" fill="#8b949e" font-size="11" text-anchor="middle">Imbalance = bid / (bid + ask) = 500 / 650 = 0.77</text>
  <text x="320" y="295" fill="#8b949e" font-size="12" text-anchor="middle">A value above 0.5 suggests more nearby buying interest — one signal among several, not a certainty.</text>
</svg>
