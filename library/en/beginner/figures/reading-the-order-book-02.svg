<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Walking the Book: A 100-Unit Market Buy</text>

  <text x="320" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Order: buy 100 units, best ask starts at $100.05</text>

  <g font-size="12">
    <rect x="140" y="100" width="120" height="50" fill="#da3633" opacity="0.85"/>
    <text x="200" y="90" fill="#c9d1d9" text-anchor="middle">$100.05 level</text>
    <text x="200" y="130" fill="#0d1117" text-anchor="middle">40 units filled</text>
    <text x="200" y="145" fill="#0d1117" text-anchor="middle">(level cleared)</text>

    <rect x="380" y="100" width="120" height="50" fill="#f85149" opacity="0.85"/>
    <text x="440" y="90" fill="#c9d1d9" text-anchor="middle">$100.10 level</text>
    <text x="440" y="130" fill="#0d1117" text-anchor="middle">60 units filled</text>
    <text x="440" y="145" fill="#0d1117" text-anchor="middle">(15 remain)</text>
  </g>

  <line x1="260" y1="125" x2="380" y2="125" stroke="#c9d1d9" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>

  <text x="320" y="200" fill="#8b949e" font-size="12" text-anchor="middle">Average fill price: (40 x $100.05 + 60 x $100.10) / 100 = $100.08</text>
  <text x="320" y="225" fill="#8b949e" font-size="12" text-anchor="middle">That $0.03 above the first quoted price is slippage from</text>
  <text x="320" y="243" fill="#8b949e" font-size="12" text-anchor="middle">walking the book through two price levels.</text>
</svg>
