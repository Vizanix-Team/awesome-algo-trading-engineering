<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Four Layers of AI Institutional Design</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Each layer needs distinct expertise and moves on a distinct timescale</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="120" y="70" width="400" height="50" rx="5"/>
    <rect x="120" y="130" width="400" height="50" rx="5"/>
    <rect x="120" y="190" width="400" height="50" rx="5"/>
    <rect x="120" y="250" width="400" height="50" rx="5"/>
  </g>
  <g fill="#58a6ff"><rect x="120" y="70" width="8" height="50"/></g>
  <g fill="#3fb950"><rect x="120" y="130" width="8" height="50"/></g>
  <g fill="#a371f7"><rect x="120" y="190" width="8" height="50"/></g>
  <g fill="#f85149"><rect x="120" y="250" width="8" height="50"/></g>
  <g fill="#c9d1d9" font-size="12" text-anchor="middle">
    <text x="320" y="99">Technical safety layer</text>
    <text x="320" y="159">Domestic regulatory layer</text>
    <text x="320" y="219">International coordination layer</text>
    <text x="320" y="279">Civil society &amp; public legitimacy layer</text>
  </g>
  <text x="320" y="314" fill="#8b949e" font-size="10" text-anchor="middle">Public legitimacy is the least mature layer relative to the others.</text>
</svg>
