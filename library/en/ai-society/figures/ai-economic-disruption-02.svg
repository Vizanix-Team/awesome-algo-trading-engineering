<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">The Speed Mismatch (illustrative, not measured data)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Deployment speed vs. institutional adaptation speed</text>

  <line x1="90" y1="270" x2="580" y2="270" stroke="#30363d" stroke-width="1"/>
  <line x1="90" y1="270" x2="90" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="298" fill="#8b949e" font-size="12" text-anchor="middle">time</text>

  <path d="M90,260 C 250,220 400,110 580,80" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="585" y="76" fill="#f85149" font-size="10" text-anchor="start">AI deployment</text>

  <path d="M90,265 C 250,255 400,225 580,190" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="585" y="194" fill="#58a6ff" font-size="10" text-anchor="start">institutional</text>
  <text x="585" y="207" fill="#58a6ff" font-size="10" text-anchor="start">adaptation</text>

  <polygon points="400,110 580,80 580,190 400,225" fill="#f85149" opacity="0.08"/>
  <text x="420" y="165" fill="#f85149" font-size="10">widening gap</text>
