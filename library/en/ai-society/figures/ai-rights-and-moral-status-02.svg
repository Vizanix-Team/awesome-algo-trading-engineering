<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Moral Status and Legal Personhood Are Separate Axes</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Illustrative placement of familiar examples</text>

  <line x1="110" y1="290" x2="110" y2="80" stroke="#30363d" stroke-width="1"/>
  <line x1="110" y1="290" x2="570" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="318" fill="#8b949e" font-size="12" text-anchor="middle">Legal personhood: none → full</text>
  <text x="50" y="185" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 50 185)">Confidence in moral status: low → high</text>

  <circle cx="450" cy="260" r="9" fill="#58a6ff"/>
  <text x="450" y="245" fill="#c9d1d9" font-size="11" text-anchor="middle">Corporations</text>

  <circle cx="220" cy="130" r="9" fill="#3fb950"/>
  <text x="220" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">Non-human animals</text>
  <text x="220" y="150" fill="#8b949e" font-size="10" text-anchor="middle">(limited welfare protection)</text>

  <circle cx="160" cy="250" r="9" fill="#a371f7"/>
  <text x="160" y="235" fill="#c9d1d9" font-size="11" text-anchor="middle">Current AI systems</text>
  <text x="160" y="270" fill="#8b949e" font-size="10" text-anchor="middle">(both low, contested)</text>
</svg>
