<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Spread of Expert Opinion on Timelines (illustrative)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Qualitative spread, not a poll result or forecast</text>

  <line x1="80" y1="270" x2="580" y2="270" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="292" fill="#8b949e" font-size="10" text-anchor="middle">this decade</text>
  <text x="280" y="292" fill="#8b949e" font-size="10" text-anchor="middle">+10-25 yrs</text>
  <text x="420" y="292" fill="#8b949e" font-size="10" text-anchor="middle">+25-50 yrs</text>
  <text x="550" y="292" fill="#8b949e" font-size="10" text-anchor="middle">50+ yrs / uncertain</text>

  <rect x="90" y="150" width="150" height="24" rx="4" fill="#58a6ff" opacity="0.5"/>
  <text x="165" y="140" fill="#58a6ff" font-size="10" text-anchor="middle">nearer-term view</text>

  <rect x="180" y="190" width="220" height="24" rx="4" fill="#a371f7" opacity="0.5"/>
  <text x="290" y="230" fill="#a371f7" font-size="10" text-anchor="middle">middle view</text>

  <rect x="330" y="150" width="240" height="24" rx="4" fill="#3fb950" opacity="0.5"/>
  <text x="450" y="140" fill="#3fb950" font-size="10" text-anchor="middle">longer-timeline / paradigm-shift view</text>

  <text x="320" y="80" fill="#c9d1d9" font-size="12" text-anchor="middle">Overlapping bands reflect genuine, documented disagreement —</text>
  <text x="320" y="96" fill="#c9d1d9" font-size="12" text-anchor="middle">not a hidden consensus obscured by public noise.</text>
</svg>
