<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="400" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Exposure to Near-Term Task Displacement (illustrative)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Qualitative placement by sector, not a measured index</text>

  <line x1="100" y1="340" x2="560" y2="340" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="340" x2="100" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="372" fill="#8b949e" font-size="12" text-anchor="middle">Task structure: judgment / novel → routine / well-defined</text>
  <text x="45" y="205" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 45 205)">Physical-world → digital / cognitive</text>

  <g fill="#58a6ff">
    <circle cx="480" cy="120" r="8"/>
    <circle cx="440" cy="150" r="8"/>
    <circle cx="510" cy="180" r="8"/>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="480" y="108" text-anchor="middle">Customer support</text>
    <text x="440" y="138" text-anchor="middle">Legal doc review</text>
    <text x="510" y="200" text-anchor="middle">Boilerplate code</text>
  </g>

  <g fill="#3fb950">
    <circle cx="220" cy="150" r="8"/>
    <circle cx="180" cy="180" r="8"/>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="220" y="138" text-anchor="middle">Courtroom advocacy</text>
    <text x="180" y="200" text-anchor="middle">Complex negotiation</text>
  </g>

  <g fill="#a371f7">
    <circle cx="250" cy="290" r="8"/>
    <circle cx="330" cy="310" r="8"/>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="250" y="278" text-anchor="middle">Construction</text>
    <text x="330" y="330" text-anchor="middle">Manufacturing</text>
  </g>

  <text x="320" y="392" fill="#8b949e" font-size="10" text-anchor="middle">Upper-right region: routine, digital tasks show the most near-term pressure.</text>
</svg>
