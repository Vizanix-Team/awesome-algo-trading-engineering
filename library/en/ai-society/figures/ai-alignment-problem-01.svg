<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Senses of "Alignment"</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Nested scope, from most practical to most speculative</text>

  <circle cx="320" cy="220" r="150" fill="none" stroke="#f85149" stroke-width="2"/>
  <circle cx="320" cy="220" r="100" fill="none" stroke="#a371f7" stroke-width="2"/>
  <circle cx="320" cy="220" r="50" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>

  <text x="320" y="216" fill="#c9d1d9" font-size="12" text-anchor="middle">Behavioral</text>
  <text x="320" y="230" fill="#c9d1d9" font-size="12" text-anchor="middle">alignment</text>

  <text x="320" y="130" fill="#c9d1d9" font-size="12" text-anchor="middle">Value alignment</text>
  <text x="320" y="80" fill="#c9d1d9" font-size="12" text-anchor="middle">Control problem</text>

  <text x="320" y="340" fill="#8b949e" font-size="10" text-anchor="middle">narrowest: does it do what users want, today</text>
  <text x="320" y="356" fill="#8b949e" font-size="10" text-anchor="middle">broadest: can humans correct or stop it, if it becomes highly capable</text>
</svg>
