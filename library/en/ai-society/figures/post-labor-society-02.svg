<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Scenarios for a Lower-Labor Future</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Positioned by degree of cultural change required, not likelihood</text>

  <line x1="80" y1="150" x2="580" y2="150" stroke="#30363d" stroke-width="2"/>
  <text x="80" y="180" fill="#8b949e" font-size="11" text-anchor="start">modest change</text>
  <text x="580" y="180" fill="#8b949e" font-size="11" text-anchor="end">major cultural shift</text>

  <circle cx="150" cy="150" r="10" fill="#58a6ff"/>
  <text x="150" y="120" fill="#c9d1d9" font-size="12" text-anchor="middle">Gradual hour</text>
  <text x="150" y="135" fill="#c9d1d9" font-size="12" text-anchor="middle">reduction</text>

  <circle cx="330" cy="150" r="10" fill="#a371f7"/>
  <text x="330" y="120" fill="#c9d1d9" font-size="12" text-anchor="middle">Bifurcated</text>
  <text x="330" y="135" fill="#c9d1d9" font-size="12" text-anchor="middle">labor market</text>

  <circle cx="510" cy="150" r="10" fill="#f85149"/>
  <text x="510" y="120" fill="#c9d1d9" font-size="12" text-anchor="middle">Cultural revaluation</text>
  <text x="510" y="135" fill="#c9d1d9" font-size="12" text-anchor="middle">of non-market work</text>

  <text x="330" y="220" fill="#8b949e" font-size="10" text-anchor="middle">sharpest status and inequality concerns</text>
  <text x="510" y="220" fill="#8b949e" font-size="10" text-anchor="middle">least historical precedent</text>
</svg>
