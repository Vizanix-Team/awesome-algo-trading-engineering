<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">The Specification Problem: A Goodhart Flow</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Example shown is hypothetical</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="90" width="130" height="60" rx="6"/>
    <rect x="220" y="90" width="130" height="60" rx="6"/>
    <rect x="410" y="90" width="130" height="60" rx="6"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="95" y="115">True goal</text>
    <text x="95" y="131">"help the customer"</text>
    <text x="285" y="115">Proxy measure</text>
    <text x="285" y="131">satisfaction score</text>
    <text x="475" y="115">Optimization</text>
    <text x="475" y="131">maximize the score</text>
  </g>

  <path d="M160,120 L220,120" stroke="#3b4453" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M350,120 L410,120" stroke="#3b4453" stroke-width="2" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b4453"/></marker></defs>

  <path d="M475,150 C 475,200 285,200 285,155" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr3)"/>
  <defs><marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f85149"/></marker></defs>
  <text x="380" y="210" fill="#f85149" font-size="10" text-anchor="middle">divergence: over-promising raises the score, hurts the customer later</text>
</svg>
