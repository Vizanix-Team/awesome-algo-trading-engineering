<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Candidate Criteria for Moral Status</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Each remains contested when applied to current AI systems</text>

  <circle cx="320" cy="200" r="50" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="196" fill="#c9d1d9" font-size="11" text-anchor="middle">Moral</text>
  <text x="320" y="210" fill="#c9d1d9" font-size="11" text-anchor="middle">status?</text>

  <g stroke="#3b4453" stroke-width="1.5">
    <line x1="290" y1="165" x2="170" y2="90"/>
    <line x1="290" y1="235" x2="170" y2="310"/>
    <line x1="350" y1="165" x2="470" y2="90"/>
    <line x1="350" y1="235" x2="470" y2="310"/>
  </g>
  <g fill="#161b22" stroke="#58a6ff">
    <rect x="90" y="60" width="160" height="46" rx="5"/>
    <rect x="90" y="280" width="160" height="46" rx="5"/>
    <rect x="390" y="60" width="160" height="46" rx="5"/>
    <rect x="390" y="280" width="160" height="46" rx="5"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="170" y="80">Sentience</text>
    <text x="170" y="95">(unresolvable today)</text>
    <text x="170" y="300">Functional / behavioral</text>
    <text x="170" y="315">(poor guide, trained fluency)</text>
    <text x="470" y="80">Autonomous</text>
