<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Technology Diffusion Lag (illustrative, not measured data)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Gap between invention and measurable productivity impact</text>

  <line x1="90" y1="270" x2="580" y2="270" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="300" fill="#8b949e" font-size="12" text-anchor="middle">time since core technology introduced (qualitative)</text>

  <!-- Steam -->
  <text x="70" y="100" fill="#8b949e" font-size="11" text-anchor="end">Steam engine</text>
  <rect x="90" y="90" width="90" height="16" fill="#161b22" stroke="#58a6ff"/>
  <text x="135" y="102" fill="#c9d1d9" font-size="10" text-anchor="middle">long lag</text>

  <!-- Electrification -->
  <text x="70" y="150" fill="#8b949e" font-size="11" text-anchor="end">Electrification</text>
  <rect x="90" y="140" width="150" height="16" fill="#161b22" stroke="#3fb950"/>
  <text x="165" y="152" fill="#c9d1d9" font-size="10" text-anchor="middle">~decades, per economic history</text>

  <!-- Computers -->
  <text x="70" y="200" fill="#8b949e" font-size="11" text-anchor="end">Computers</text>
  <rect x="90" y="190" width="110" height="16" fill="#161b22" stroke="#a371f7"/>
  <text x="145" y="202" fill="#c9d1d9" font-size="10" text-anchor="middle">shorter, still gradual</text>

  <!-- AI -->
  <text x="70" y="250" fill="#8b949e" font-size="11" text-anchor="end">AI (hypothetical range)</text>
  <rect x="90" y="240" width="60" height="16" fill="#161b22" stroke="#f85149" stroke-dasharray="3 2"/>
  <rect x="150" y="240" width="120" height="16" fill="#161b22" stroke="#f85149" stroke-dasharray="3 2" opacity="0.5"/>
  <text x="210" y="230" fill="#f85149" font-size="10" text-anchor="middle">uncertain — faster software diffusion vs. institutional bottlenecks</text>
</svg>
