<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Hypothetical Growth Shapes</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Illustrative scenarios only — not a prediction of which will occur</text>

  <line x1="80" y1="280" x2="580" y2="280" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="280" x2="80" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="308" fill="#8b949e" font-size="12" text-anchor="middle">time</text>
  <text x="40" y="175" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 40 175)">capability (illustrative)</text>

  <!-- bounded S-curve -->
  <path d="M80,270 C 200,260 260,120 400,105 C 480,100 540,98 580,97" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="580" y="88" fill="#3fb950" font-size="10" text-anchor="end">bounded S-curve</text>

  <!-- gradual accelerating -->
  <path d="M80,272 C 250,265 400,220 580,140" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="580" y="130" fill="#58a6ff" font-size="10" text-anchor="end">gradual, still-bounded acceleration</text>

  <!-- hyperbolic -->
  <path d="M80,275 C 350,272 500,240 560,150 C 570,120 575,90 578,72" fill="none" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="578" y="64" fill="#a371f7" font-size="10" text-anchor="end">hypothetical hyperbolic case</text>

  <text x="320" y="330" fill="#8b949e" font-size="10" text-anchor="middle">Every historical technology feedback loop observed so far has settled into the bounded shape.</text>
</svg>
