<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Stakeholders and Bottleneck Flows</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Simplified relationship map, not exhaustive</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="150" width="130" height="50" rx="6"/>
    <rect x="255" y="90" width="130" height="50" rx="6"/>
    <rect x="255" y="210" width="130" height="50" rx="6"/>
    <rect x="480" y="150" width="130" height="50" rx="6"/>
    <rect x="255" y="300" width="130" height="50" rx="6"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="95" y="180">Compute &amp; data</text>
    <text x="320" y="120">Frontier AI labs</text>
    <text x="320" y="240">States</text>
    <text x="545" y="180">Deployed products</text>
    <text x="320" y="330">Public / citizens</text>
