  <path d="M160,175 L255,130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M160,180 L255,225" stroke="#58a6ff" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M385,120 L480,165" stroke="#3fb950" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M385,230 L480,185" stroke="#3fb950" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M545,200 L320,300" stroke="#a371f7" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M320,300 L320,260" stroke="#8b949e" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#a4)"/>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="200" y="345" fill="#8b949e" font-size="10">dashed: accountability pressure back onto states, currently the weakest link</text>
