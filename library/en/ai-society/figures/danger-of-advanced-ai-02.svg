<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Reasoning Under Deep Uncertainty (illustrative frame)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Qualitative decision frame, not a probability estimate</text>

  <line x1="100" y1="320" x2="560" y2="320" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="320" x2="100" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="350" fill="#8b949e" font-size="12" text-anchor="middle">Probability of occurrence (low → high)</text>
  <text x="45" y="195" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 45 195)">Severity of consequence (low → high)</text>

  <!-- diagonal priority band -->
  <polygon points="100,320 560,320 560,220 100,120" fill="#a371f7" opacity="0.08"/>
  <text x="470" y="180" fill="#a371f7" font-size="10" text-anchor="middle">higher priority for mitigation</text>
  <text x="470" y="193" fill="#a371f7" font-size="10" text-anchor="middle">(illustrative)</text>

  <!-- points -->
  <circle cx="420" cy="270" r="10" fill="#58a6ff"/>
  <text x="420" y="255" fill="#c9d1d9" font-size="11" text-anchor="middle">Misuse</text>
  <text x="420" y="295" fill="#8b949e" font-size="10" text-anchor="middle">frequent, contained</text>

  <circle cx="330" cy="200" r="10" fill="#3fb950"/>
  <text x="330" y="185" fill="#c9d1d9" font-size="11" text-anchor="middle">Accident at scale</text>

  <circle cx="220" cy="150" r="10" fill="#a371f7"/>
  <text x="220" y="135" fill="#c9d1d9" font-size="11" text-anchor="middle">Structural erosion</text>
  <text x="220" y="165" fill="#8b949e" font-size="10" text-anchor="middle">slow, hard to attribute</text>

  <circle cx="180" cy="95" r="12" fill="#f85149"/>
  <text x="180" y="80" fill="#c9d1d9" font-size="11" text-anchor="middle">Loss of control</text>
  <text x="180" y="108" fill="#8b949e" font-size="10" text-anchor="middle">low agreed probability, high stakes</text>
</svg>
