<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Three Forecasting Methods, Each With Real Limits</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="70" width="180" height="190" rx="6"/>
    <rect x="230" y="70" width="180" height="190" rx="6"/>
    <rect x="430" y="70" width="180" height="190" rx="6"/>
  </g>
  <g fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="120" y="95">Trend</text>
    <text x="120" y="110">extrapolation</text>
    <text x="320" y="95">Expert</text>
    <text x="320" y="110">elicitation</text>
    <text x="520" y="95">Bottleneck</text>
    <text x="520" y="110">analysis</text>
  </g>
  <g fill="#8b949e" font-size="10">
    <text x="45" y="140">+ grounded in</text>
    <text x="45" y="153">  measured data</text>
    <text x="45" y="175">- assumes trend</text>
    <text x="45" y="188">  holds at new scale</text>

    <text x="245" y="140">+ captures tacit</text>
    <text x="245" y="153">  domain knowledge</text>
    <text x="245" y="175">- anchoring &amp;</text>
    <text x="245" y="188">  motivated reasoning</text>

    <text x="445" y="140">+ grounds forecast</text>
    <text x="445" y="153">  in physical limits</text>
    <text x="445" y="175">- own uncertain</text>
    <text x="445" y="188">  assumptions</text>
  </g>
  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">The most honest forecasts combine all three and report wide ranges, not single dates.</text>
</svg>
