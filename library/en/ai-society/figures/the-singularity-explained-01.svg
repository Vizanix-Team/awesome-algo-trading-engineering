<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="400" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">The Recursive Improvement Loop, With Its Constraints</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Mechanistic sketch, not a claim about current pace</text>

  <circle cx="200" cy="150" r="60" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="200" y="146" fill="#c9d1d9" font-size="12" text-anchor="middle">AI</text>
  <text x="200" y="162" fill="#c9d1d9" font-size="12" text-anchor="middle">capability</text>

  <circle cx="440" cy="150" r="60" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="440" y="146" fill="#c9d1d9" font-size="12" text-anchor="middle">AI research</text>
  <text x="440" y="162" fill="#c9d1d9" font-size="12" text-anchor="middle">productivity</text>

  <path d="M260,130 C 320,100 380,100 400,120" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400,180 C 380,210 320,210 260,180" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="95" fill="#8b949e" font-size="10" text-anchor="middle">contributes to</text>
  <text x="320" y="228" fill="#8b949e" font-size="10" text-anchor="middle">produces better systems</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b4453"/>
    </marker>
  </defs>

  <text x="320" y="270" fill="#c9d1d9" font-size="13" text-anchor="middle">Constraints that could bind first (illustrative):</text>
  <g fill="#161b22" stroke="#30363d">
    <rect x="70" y="290" width="120" height="40"/>
    <rect x="210" y="290" width="120" height="40"/>
    <rect x="350" y="290" width="120" height="40"/>
    <rect x="490" y="290" width="90" height="40"/>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="130" y="314">Compute</text>
    <text x="270" y="314">Energy</text>
    <text x="410" y="314">Data</text>
    <text x="535" y="314">New science</text>
  </g>
  <text x="320" y="360" fill="#8b949e" font-size="11" text-anchor="middle">Which constraint binds first, and how tightly, remains an open empirical question.</text>
</svg>
