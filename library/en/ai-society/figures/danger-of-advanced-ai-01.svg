<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="400" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Four Categories of AI Risk (illustrative placement)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Positions are qualitative, not measured data</text>

  <!-- axes -->
  <line x1="100" y1="340" x2="560" y2="340" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="340" x2="100" y2="70" stroke="#30363d" stroke-width="1"/>

  <text x="330" y="372" fill="#8b949e" font-size="12" text-anchor="middle">Capability required: demonstrated today → speculative / future</text>
  <text x="40" y="205" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 40 205)">Consequence: localized / recoverable → systemic / hard to reverse</text>

  <!-- quadrant guides -->
  <line x1="330" y1="70" x2="330" y2="340" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="205" x2="560" y2="205" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Misuse: low x, low-mid y -->
  <circle cx="190" cy="290" r="34" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="190" y="286" fill="#c9d1d9" font-size="12" text-anchor="middle">Misuse</text>
  <text x="190" y="300" fill="#8b949e" font-size="10" text-anchor="middle">existing tools</text>

  <!-- Accident: low-mid x, high y -->
  <circle cx="230" cy="140" r="34" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="230" y="136" fill="#c9d1d9" font-size="12" text-anchor="middle">Accident /</text>
  <text x="230" y="150" fill="#c9d1d9" font-size="12" text-anchor="middle">Malfunction</text>

  <!-- Structural: low x, high y -->
  <circle cx="130" cy="120" r="34" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="130" y="116" fill="#c9d1d9" font-size="12" text-anchor="middle">Structural</text>
  <text x="130" y="130" fill="#c9d1d9" font-size="12" text-anchor="middle">/ Systemic</text>

  <!-- Loss of control: high x, high y -->
  <circle cx="470" cy="110" r="38" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="470" y="105" fill="#c9d1d9" font-size="12" text-anchor="middle">Loss of</text>
  <text x="470" y="120" fill="#c9d1d9" font-size="12" text-anchor="middle">Control</text>
  <text x="470" y="150" fill="#8b949e" font-size="10" text-anchor="middle">most speculative,</text>
  <text x="470" y="162" fill="#8b949e" font-size="10" text-anchor="middle">most contested</text>

  <text x="560" y="358" fill="#8b949e" font-size="11" text-anchor="end">speculative</text>
  <text x="110" y="358" fill="#8b949e" font-size="11" text-anchor="start">demonstrated</text>
</svg>
