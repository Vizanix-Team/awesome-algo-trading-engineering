<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Race condition в pre-trade проверке лимита</text>

  <text x="150" y="60" fill="#f85149" font-size="12" text-anchor="middle">Поток 1</text>
  <text x="490" y="60" fill="#58a6ff" font-size="12" text-anchor="middle">Поток 2</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="70" y="80" width="160" height="30" rx="4"/>
    <rect x="70" y="150" width="160" height="30" rx="4"/>
  </g>
  <text x="150" y="100" fill="#c9d1d9" font-size="10" text-anchor="middle">load(exposure) = 100</text>
  <text x="150" y="170" fill="#c9d1d9" font-size="10" text-anchor="middle">exposure += qty → ACCEPT</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="410" y="115" width="160" height="30" rx="4"/>
  </g>
  <text x="490" y="135" fill="#c9d1d9" font-size="10" text-anchor="middle">load(exposure) = 100 (устарело!)</text>

  <line x1="230" y1="95" x2="410" y2="130" stroke="#30363d" stroke-dasharray="3 2"/>

  <rect x="140" y="200" width="360" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="320" y="225" fill="#3fb950" font-size="12" text-anchor="middle">Решение: CAS-цикл или сериализация критической секции</text>

  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Оба потока прошли проверку по устаревшему значению — совокупный объём превышает лимит</text>
</svg>
