<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Консолидированный взгляд на капитал</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="40" y="70" width="160" height="50" rx="6"/>
  </g>
  <text x="120" y="100" fill="#c9d1d9" font-size="12" text-anchor="middle">CEX-балансы (офчейн)</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="270" y="70" width="160" height="50" rx="6"/>
  </g>
  <text x="350" y="94" fill="#c9d1d9" font-size="12" text-anchor="middle">Ончейн-кошельки</text>
  <text x="350" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle">(N подтверждений)</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="500" y="70" width="160" height="50" rx="6"/>
  </g>
  <text x="580" y="100" fill="#c9d1d9" font-size="12" text-anchor="middle">DeFi-позиции</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="270" y="150" width="160" height="40" rx="6"/>
  </g>
  <text x="350" y="174" fill="#f85149" font-size="11" text-anchor="middle">in-flight transfers</text>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowG)">
    <path d="M120,120 L320,220" fill="none"/>
  </g>
  <g stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowG)">
    <path d="M350,120 L350,220" fill="none"/>
  </g>
  <g stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrowG)">
    <path d="M580,120 L380,220" fill="none"/>
  </g>
  <g stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowG)">
    <path d="M350,190 L350,220" fill="none"/>
  </g>

  <g fill="#161b22" stroke="#c9d1d9" stroke-width="2">
    <rect x="270" y="230" width="160" height="50" rx="6"/>
  </g>
  <text x="350" y="260" fill="#c9d1d9" font-size="12" text-anchor="middle">UnifiedBalanceView</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
