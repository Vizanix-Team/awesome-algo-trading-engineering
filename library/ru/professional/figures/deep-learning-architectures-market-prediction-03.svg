<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Мониторинг дрейфа модели после развёртывания</text>

  <line x1="60" y1="230" x2="580" y2="230" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="230" stroke="#30363d"/>
  <text x="320" y="260" fill="#8b949e" font-size="12" text-anchor="middle">время в production</text>
  <text x="30" y="150" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 30 150)">out-of-sample точность</text>

  <line x1="60" y1="120" x2="580" y2="120" stroke="#3fb950" stroke-dasharray="4 3"/>
  <text x="580" y="112" fill="#3fb950" font-size="10" text-anchor="end">baseline при валидации</text>

  <path d="M60,120 C150,118 250,130 320,150 C400,175 470,195 580,215" stroke="#f85149" stroke-width="2.5" fill="none"/>

  <line x1="440" y1="60" x2="440" y2="230" stroke="#a371f7" stroke-dasharray="3 2"/>
  <text x="440" y="50" fill="#a371f7" font-size="11" text-anchor="middle">порог тревоги: снизить вес модели</text>

  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Concept drift: связь между признаками и таргетом меняется без явного технического сбоя</text>
</svg>
