<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="340" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Декомпозиция end-to-end латентности</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="80" width="80" height="50" rx="4"/>
    <rect x="120" y="80" width="80" height="50" rx="4"/>
    <rect x="210" y="80" width="80" height="50" rx="4"/>
    <rect x="300" y="80" width="90" height="50" rx="4"/>
    <rect x="400" y="80" width="90" height="50" rx="4"/>
    <rect x="500" y="80" width="80" height="50" rx="4"/>
    <rect x="590" y="80" width="80" height="50" rx="4"/>
  </g>
  <g fill="#c9d1d9" font-size="9.5" text-anchor="middle">
    <text x="70" y="100">wire in</text>
    <text x="70" y="115">200нс</text>
    <text x="160" y="100">NIC→kernel</text>
    <text x="160" y="115">300нс</text>
    <text x="250" y="100">десериализ.</text>
    <text x="250" y="115">150нс</text>
    <text x="345" y="100">strategy</text>
    <text x="345" y="115">compute</text>
    <text x="345" y="128">800нс</text>
    <text x="445" y="100">сериализ.</text>
    <text x="445" y="115">120нс</text>
    <text x="540" y="100">kernel→NIC</text>
    <text x="540" y="115">280нс</text>
    <text x="630" y="100">wire out</text>
    <text x="630" y="115">200нс</text>
  </g>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowA)">
    <line x1="110" y1="105" x2="120" y2="105"/>
    <line x1="200" y1="105" x2="210" y2="105"/>
    <line x1="290" y1="105" x2="300" y2="105"/>
    <line x1="390" y1="105" x2="400" y2="105"/>
    <line x1="490" y1="105" x2="500" y2="105"/>
    <line x1="580" y1="105" x2="590" y2="105"/>
  </g>

  <text x="345" y="160" fill="#f85149" font-size="12" text-anchor="middle">▲ доминирующий вклад в бюджет латентности</text>

  <rect x="30" y="200" width="640" height="34" rx="6" fill="#161b22" stroke="#a371f7"/>
  <text x="350" y="222" fill="#c9d1d9" font-size="12" text-anchor="middle">Аппаратный таймстампинг NIC измеряет каждую границу отдельно</text>

  <text x="350" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Оптимизация вслепую без измерения каждого этапа тратит инженерные усилия впустую</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
