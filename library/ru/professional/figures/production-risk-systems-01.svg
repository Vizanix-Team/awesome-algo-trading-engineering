<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Иерархия защитных механизмов (defense in depth)</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="60" y="60" width="520" height="50" rx="6"/>
  </g>
  <text x="80" y="90" fill="#c9d1d9" font-size="12">Уровень 1: soft-лимит — отклоняет отдельный ордер</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="60" y="120" width="520" height="50" rx="6"/>
  </g>
  <text x="80" y="150" fill="#c9d1d9" font-size="12">Уровень 2: hard-лимит — останавливает стратегию/инструмент</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="60" y="180" width="520" height="50" rx="6"/>
  </g>
  <text x="80" y="210" fill="#c9d1d9" font-size="12">Уровень 3: circuit breaker — останавливает несколько стратегий</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="2.5">
    <rect x="60" y="240" width="520" height="50" rx="6"/>
  </g>
  <text x="80" y="270" fill="#f85149" font-size="12">Уровень 4: kill switch — останавливает всё немедленно</text>

  <text x="320" y="310" fill="#8b949e" font-size="11" text-anchor="middle">Каждый следующий уровень имеет меньше зависимостей от остальной системы, а не больше</text>
</svg>
