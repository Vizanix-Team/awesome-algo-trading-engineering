<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Разложение impact: временный, транзитный, постоянный</text>

  <line x1="60" y1="240" x2="650" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <text x="355" y="270" fill="#8b949e" font-size="12" text-anchor="middle">время после сделки</text>

  <path d="M60,240 L150,110 L650,110" stroke="#3fb950" stroke-width="2" fill="none"/>
  <text x="620" y="100" fill="#3fb950" font-size="11" text-anchor="middle">постоянный</text>

  <path d="M150,110 C250,150 350,175 650,180" stroke="#a371f7" stroke-width="2" fill="none" stroke-dasharray="0"/>
  <text x="500" y="165" fill="#a371f7" font-size="11" text-anchor="middle">транзитный (затухает с τ)</text>

  <path d="M150,60 L150,110" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="50" fill="#f85149" font-size="11" text-anchor="middle">мгновенный компонент</text>

  <line x1="150" y1="240" x2="150" y2="60" stroke="#30363d" stroke-dasharray="3 2"/>
  <text x="150" y="255" fill="#8b949e" font-size="10" text-anchor="middle">t_trade</text>

  <text x="355" y="300" fill="#8b949e" font-size="11" text-anchor="middle">Только постоянный компонент сохраняется после полного рассасывания транзитного impact</text>
</svg>
