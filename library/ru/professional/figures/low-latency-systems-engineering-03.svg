<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Lock-free SPSC кольцевой буфer</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="60" y="70" width="60" height="46"/>
    <rect x="120" y="70" width="60" height="46"/>
    <rect x="180" y="70" width="60" height="46"/>
    <rect x="240" y="70" width="60" height="46"/>
    <rect x="300" y="70" width="60" height="46"/>
    <rect x="360" y="70" width="60" height="46"/>
    <rect x="420" y="70" width="60" height="46"/>
    <rect x="480" y="70" width="60" height="46"/>
  </g>
  <g fill="#3fb950" fill-opacity="0.4">
    <rect x="180" y="70" width="60" height="46"/>
    <rect x="240" y="70" width="60" height="46"/>
    <rect x="300" y="70" width="60" height="46"/>
  </g>

  <path d="M180,60 L180,45" stroke="#f85149" marker-end="url(#arrowB)"/>
  <text x="180" y="35" fill="#f85149" font-size="11" text-anchor="middle">read_index</text>
  <text x="180" y="20" fill="#8b949e" font-size="9" text-anchor="middle">(консьюмер)</text>

  <path d="M300,60 L300,45" stroke="#58a6ff" marker-end="url(#arrowB)"/>
  <text x="300" y="35" fill="#58a6ff" font-size="11" text-anchor="middle">write_index</text>
  <text x="300" y="20" fill="#8b949e" font-size="9" text-anchor="middle">(продюсер)</text>

  <text x="270" y="145" fill="#8b949e" font-size="11" text-anchor="middle">заполненный, но ещё не прочитанный сегмент</text>

  <text x="150" y="200" fill="#58a6ff" font-size="12">Продюсер: пишет buffer[write % SIZE],</text>
  <text x="150" y="218" fill="#58a6ff" font-size="12">инкрементирует write_index (release)</text>

  <text x="150" y="250" fill="#f85149" font-size="12">Консьюмер: читает write_index (acquire),</text>
  <text x="150" y="268" fill="#f85149" font-size="12">обрабатывает доступные события до read_index</text>

  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
