<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Circuit breaker на уровне площадки</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="2">
    <rect x="60" y="70" width="150" height="50" rx="6"/>
  </g>
  <text x="135" y="100" fill="#3fb950" font-size="12" text-anchor="middle">Venue: здоров</text>

  <path d="M210,95 L260,95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowE)"/>
  <text x="235" y="85" fill="#8b949e" font-size="10" text-anchor="middle">error_rate ↑</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="2">
    <rect x="260" y="70" width="150" height="50" rx="6"/>
  </g>
  <text x="335" y="94" fill="#f85149" font-size="12" text-anchor="middle">Circuit trip:</text>
  <text x="335" y="110" fill="#f85149" font-size="12" text-anchor="middle">исключить из SOR</text>

  <path d="M410,95 L460,95" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowE)"/>
  <text x="435" y="85" fill="#8b949e" font-size="10" text-anchor="middle">cooldown</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="2">
    <rect x="460" y="70" width="150" height="50" rx="6"/>
  </g>
  <text x="535" y="94" fill="#a371f7" font-size="12" text-anchor="middle">Пробный</text>
  <text x="535" y="110" fill="#a371f7" font-size="12" text-anchor="middle">возврат объёма</text>

  <text x="320" y="180" fill="#8b949e" font-size="12" text-anchor="middle">SOR трактует каждую площадку как ненадёжный компонент,</text>
  <text x="320" y="200" fill="#8b949e" font-size="12" text-anchor="middle">способный отказать независимо от остальных</text>

  <defs>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
