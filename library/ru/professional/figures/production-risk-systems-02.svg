<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Kill switch: путь активации в обход основного приложения</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="40" y="70" width="180" height="50" rx="6"/>
  </g>
  <text x="130" y="100" fill="#8b949e" font-size="12" text-anchor="middle">Основное приложение (зависло)</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="2">
    <rect x="280" y="70" width="180" height="50" rx="6"/>
  </g>
  <text x="370" y="94" fill="#f85149" font-size="12" text-anchor="middle">Watchdog-процесс</text>
  <text x="370" y="110" fill="#f85149" font-size="11" text-anchor="middle">минимум зависимостей</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="520" y="70" width="150" height="50" rx="6"/>
  </g>
  <text x="595" y="100" fill="#c9d1d9" font-size="12" text-anchor="middle">Биржевой шлюз</text>

  <path d="M370,120 L370,180 L595,180 L595,120" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#arrowF)"/>
  <text x="480" y="200" fill="#f85149" font-size="11" text-anchor="middle">блокирует исходящий трафик напрямую</text>

  <path d="M220,95 L280,95" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="85" fill="#8b949e" font-size="9" text-anchor="middle">(обычный путь не используется)</text>

  <text x="180" y="270" fill="#8b949e" font-size="12" text-anchor="middle">Ручной триггер</text>
  <text x="180" y="288" fill="#8b949e" font-size="12" text-anchor="middle">выделенный интерфейс</text>
  <path d="M180,255 L280,120" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrowF)"/>

  <defs>
    <marker id="arrowF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>
</svg>
