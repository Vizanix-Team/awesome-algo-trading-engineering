<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">False sharing на линии кэша процессора</text>

  <text x="160" y="60" fill="#f85149" font-size="12" text-anchor="middle">Уязвимо: одна cache line на двоих</text>
  <g fill="#161b22" stroke="#f85149" stroke-width="2">
    <rect x="60" y="80" width="200" height="50" rx="4"/>
  </g>
  <line x1="160" y1="80" x2="160" y2="130" stroke="#f85149" stroke-dasharray="3 2"/>
  <text x="110" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle">counter_a</text>
  <text x="210" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle">counter_b</text>
  <text x="160" y="150" fill="#8b949e" font-size="10" text-anchor="middle">поток A и поток B инвалидируют друг друга</text>

  <text x="480" y="60" fill="#3fb950" font-size="12" text-anchor="middle">Исправлено: явный padding</text>
  <g fill="#161b22" stroke="#3fb950" stroke-width="2">
    <rect x="380" y="80" width="90" height="50" rx="4"/>
    <rect x="480" y="80" width="90" height="50" rx="4"/>
  </g>
  <text x="425" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle">counter_a</text>
  <text x="425" y="122" fill="#8b949e" font-size="9" text-anchor="middle">+ padding 56B</text>
  <text x="525" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle">counter_b</text>
  <text x="525" y="122" fill="#8b949e" font-size="9" text-anchor="middle">+ padding 56B</text>
  <text x="480" y="150" fill="#8b949e" font-size="10" text-anchor="middle">каждая на своей линии кэша (64 байта)</text>

  <text x="320" y="220" fill="#8b949e" font-size="12" text-anchor="middle">Протокол когерентности кэша инвалидирует всю линию</text>
  <text x="320" y="240" fill="#8b949e" font-size="12" text-anchor="middle">при модификации любой её части любым ядром</text>
</svg>
