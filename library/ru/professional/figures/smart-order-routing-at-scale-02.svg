<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Консолидация рынка с поправкой на задержку фида</text>

  <text x="150" y="60" fill="#3fb950" font-size="12" text-anchor="middle">Venue A (co-location, 200мкс)</text>
  <circle cx="150" cy="120" r="40" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="150" y="125" fill="#3fb950" font-size="12" text-anchor="middle">высокая</text>
  <text x="150" y="140" fill="#3fb950" font-size="11" text-anchor="middle">confidence</text>

  <text x="550" y="60" fill="#f85149" font-size="12" text-anchor="middle">Venue B (удалённый регион, 15мс)</text>
  <circle cx="550" cy="120" r="40" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="550" y="125" fill="#f85149" font-size="12" text-anchor="middle">низкая</text>
  <text x="550" y="140" fill="#f85149" font-size="11" text-anchor="middle">confidence</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="2">
    <rect x="270" y="180" width="160" height="50" rx="6"/>
  </g>
  <text x="350" y="210" fill="#c9d1d9" font-size="12" text-anchor="middle">Consolidated Book</text>

  <path d="M150,160 L280,190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <path d="M550,160 L420,190" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <text x="350" y="260" fill="#8b949e" font-size="12" text-anchor="middle">confidence = max(0, 1 − staleness / max_reasonable_staleness)</text>

  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
