<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="340" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Распределение родительского ордера между площадками</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="2">
    <rect x="290" y="55" width="120" height="46" rx="6"/>
  </g>
  <text x="350" y="83" fill="#c9d1d9" font-size="12" text-anchor="middle">Parent order 10 000</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="40" y="170" width="120" height="55" rx="6"/>
    <rect x="200" y="170" width="120" height="55" rx="6"/>
    <rect x="360" y="170" width="120" height="55" rx="6"/>
    <rect x="520" y="170" width="120" height="55" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="100" y="195">Venue A</text>
    <text x="100" y="212">4 200 шт</text>
    <text x="260" y="195">Venue B</text>
    <text x="260" y="212">3 000 шт</text>
    <text x="420" y="195">Dark pool</text>
    <text x="420" y="212">2 000 шт</text>
    <text x="580" y="195">Venue C</text>
    <text x="580" y="212">800 шт</text>
  </g>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowC)">
    <path d="M320,101 L100,170" fill="none"/>
    <path d="M340,101 L260,170" fill="none"/>
    <path d="M360,101 L420,170" fill="none"/>
    <path d="M380,101 L580,170" fill="none"/>
  </g>

  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="100" y="245">fill_probability 0.92</text>
    <text x="260" y="245">fill_probability 0.85</text>
    <text x="420" y="245">fill_probability 0.60</text>
    <text x="580" y="245">fill_probability 0.40</text>
  </g>

  <text x="350" y="290" fill="#8b949e" font-size="12" text-anchor="middle">Распределение учитывает не только глубину, но и издержки, задержку доступа</text>
  <text x="350" y="308" fill="#8b949e" font-size="12" text-anchor="middle">и эмпирическую вероятность реального исполнения на каждой площадке</text>

  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
