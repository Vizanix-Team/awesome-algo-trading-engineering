<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Оценка здоровья площадок на масштабе</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="40" y="70" width="90" height="40" rx="4"/>
  </g>
  <text x="85" y="94" fill="#3fb950" font-size="10" text-anchor="middle">Venue 1: 98</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="150" y="70" width="90" height="40" rx="4"/>
  </g>
  <text x="195" y="94" fill="#3fb950" font-size="10" text-anchor="middle">Venue 2: 95</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="260" y="70" width="90" height="40" rx="4"/>
  </g>
  <text x="305" y="94" fill="#a371f7" font-size="10" text-anchor="middle">Venue 3: 80</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="2">
    <rect x="370" y="70" width="90" height="40" rx="4"/>
  </g>
  <text x="415" y="94" fill="#f85149" font-size="10" text-anchor="middle">Venue 4: 42</text>

  <text x="530" y="90" fill="#8b949e" font-size="11">… ещё 60+ площадок</text>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowI)">
    <path d="M85,110 L300,190" fill="none"/>
    <path d="M195,110 L300,190" fill="none"/>
    <path d="M305,110 L300,190" fill="none"/>
    <path d="M415,110 L330,190" fill="none"/>
  </g>

  <g fill="#161b22" stroke="#c9d1d9" stroke-width="2">
    <rect x="230" y="200" width="160" height="50" rx="6"/>
  </g>
  <text x="310" y="222" fill="#c9d1d9" font-size="12" text-anchor="middle">Venue health score</text>
  <text x="310" y="238" fill="#c9d1d9" font-size="11" text-anchor="middle">→ вход в SOR</text>

  <text x="415" y="130" fill="#f85149" font-size="10" text-anchor="middle">поднято вниманию оператора</text>

  <defs>
    <marker id="arrowI" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
