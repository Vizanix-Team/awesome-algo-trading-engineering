<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Жизненный цикл заявки через API</text>

  <g font-size="10" text-anchor="middle">
    <rect x="30" y="90" width="100" height="46" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="80" y="118" fill="#c9d1d9">Принята (new)</text>

    <rect x="170" y="90" width="120" height="46" rx="6" fill="#161b22" stroke="#a371f7"/>
    <text x="230" y="112" fill="#c9d1d9">Частично</text>
    <text x="230" y="126" fill="#c9d1d9">исполнена</text>

    <rect x="330" y="50" width="120" height="46" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="390" y="78" fill="#c9d1d9">Полностью</text>
    <text x="390" y="92" fill="#c9d1d9">исполнена</text>

    <rect x="330" y="130" width="120" height="46" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="390" y="158" fill="#c9d1d9">Отменена</text>

    <rect x="30" y="170" width="100" height="46" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="80" y="198" fill="#c9d1d9">Отклонена</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.3" marker-end="url(#a7)">
    <line x1="130" y1="105" x2="168" y2="105"/>
    <line x1="290" y1="105" x2="328" y2="80"/>
    <line x1="290" y1="122" x2="328" y2="148"/>
    <line x1="80" y1="136" x2="80" y2="168"/>
  </g>
  <defs><marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#8b949e"/></marker></defs>

  <text x="320" y="235" fill="#8b949e" font-size="11" text-anchor="middle">Заявка не считается отменённой, пока не пришло явное подтверждение от биржи</text>
</svg>
