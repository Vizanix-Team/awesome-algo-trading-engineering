<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Нормальное распределение против тяжёлых хвостов</text>
  <line x1="60" y1="220" x2="580" y2="220" stroke="#30363d"/>
  <text x="320" y="245" fill="#8b949e" font-size="11" text-anchor="middle">Доходность</text>

  <path d="M60,220 C 150,220 190,60 320,60 C 450,60 490,220 580,220" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M60,215 C 120,210 170,180 220,140 C 260,110 290,80 320,75 C 350,80 380,110 420,140 C 470,180 520,210 580,215" fill="none" stroke="#f85149" stroke-width="2.5"/>

  <text x="150" y="90" fill="#58a6ff" font-size="10">Нормальное распределение</text>
  <text x="440" y="100" fill="#f85149" font-size="10" text-anchor="end">Реальные доходности</text>
  <text x="440" y="112" fill="#f85149" font-size="10" text-anchor="end">(тяжёлые хвосты)</text>

  <ellipse cx="95" cy="210" rx="20" ry="6" fill="#f85149" opacity="0.5"/>
  <ellipse cx="545" cy="210" rx="20" ry="6" fill="#f85149" opacity="0.5"/>
  <text x="95" y="270" fill="#8b949e" font-size="9" text-anchor="middle">экстремальные события</text>
  <text x="545" y="270" fill="#8b949e" font-size="9" text-anchor="middle">случаются чаще, чем</text>

  <text x="320" y="200" fill="#8b949e" font-size="10" text-anchor="middle">Модели риска, построенные на нормальности, недооценивают редкие крупные убытки</text>
</svg>
