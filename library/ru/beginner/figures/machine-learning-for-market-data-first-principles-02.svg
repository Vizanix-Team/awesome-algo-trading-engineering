<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="240" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">От признаков к торговому решению</text>

  <g font-size="10" text-anchor="middle" fill="#c9d1d9">
    <rect x="20" y="70" width="110" height="55" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="75" y="92">Признаки</text>
    <text x="75" y="107" fill="#8b949e" font-size="8">объём/среднее, доходность</text>

    <rect x="150" y="70" width="110" height="55" rx="6" fill="#161b22" stroke="#a371f7"/>
    <text x="205" y="92">Модель</text>
    <text x="205" y="107" fill="#8b949e" font-size="8">логистическая регрессия</text>

    <rect x="280" y="70" width="110" height="55" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="335" y="92">Целевая</text>
    <text x="335" y="105" fill="#8b949e" font-size="8">переменная:</text>
    <text x="335" y="117" fill="#8b949e" font-size="8">вырастет ли цена</text>

    <rect x="410" y="70" width="110" height="55" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="465" y="92">Размер позиции</text>
    <text x="465" y="107" fill="#8b949e" font-size="8">+ риск-контроль</text>

    <rect x="540" y="70" width="80" height="55" rx="6" fill="#161b22" stroke="#8b949e"/>
    <text x="580" y="92">Заявка</text>
    <text x="580" y="107" fill="#8b949e" font-size="8">на биржу</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" marker-end="url(#a12)">
    <line x1="130" y1="97" x2="148" y2="97"/>
    <line x1="260" y1="97" x2="278" y2="97"/>
    <line x1="390" y1="97" x2="408" y2="97"/>
    <line x1="520" y1="97" x2="538" y2="97"/>
  </g>
  <defs><marker id="a12" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#8b949e"/></marker></defs>

  <text x="320" y="170" fill="#8b949e" font-size="11" text-anchor="middle">Модель — лишь один компонент, а не готовая торговая стратегия</text>
  <text x="320" y="190" fill="#8b949e" font-size="11" text-anchor="middle">Итоговая оценка требует полного бэктеста с реальными издержками</text>
</svg>
