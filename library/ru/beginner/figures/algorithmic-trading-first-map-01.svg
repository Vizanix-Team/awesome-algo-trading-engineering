<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Шесть блоков торговой системы</text>
  <!-- blocks -->
  <g font-size="11" fill="#c9d1d9" text-anchor="middle">
    <rect x="15" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="60" y="82">Данные</text>
    <text x="60" y="97" fill="#8b949e" font-size="9">сбор с биржи</text>

    <rect x="120" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="165" y="82">Обработка</text>
    <text x="165" y="97" fill="#8b949e" font-size="9">бары, признаки</text>

    <rect x="225" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="270" y="82">Стратегия</text>
    <text x="270" y="97" fill="#8b949e" font-size="9">сигнал</text>

    <rect x="330" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="375" y="82">Риск</text>
    <text x="375" y="97" fill="#8b949e" font-size="9">проверка лимитов</text>

    <rect x="435" y="60" width="90" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="480" y="82">Исполнение</text>
    <text x="480" y="97" fill="#8b949e" font-size="9">заявка на биржу</text>

    <rect x="540" y="60" width="85" height="50" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <text x="582" y="82">Мониторинг</text>
    <text x="582" y="97" fill="#8b949e" font-size="9">логи, отчёты</text>
  </g>
  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="105" y1="85" x2="118" y2="85"/>
    <line x1="210" y1="85" x2="223" y2="85"/>
    <line x1="315" y1="85" x2="328" y2="85"/>
    <line x1="420" y1="85" x2="433" y2="85"/>
    <line x1="525" y1="85" x2="538" y2="85"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <text x="320" y="145" fill="#8b949e" font-size="11" text-anchor="middle">Каждый блок можно реализовать в 300 строках кода или в десятках сервисов — суть та же</text>

  <!-- three questions -->
  <text x="320" y="185" fill="#c9d1d9" font-size="13" text-anchor="middle">Три разных вопроса</text>
  <rect x="60" y="205" width="150" height="60" rx="6" fill="#161b22" stroke="#a371f7"/>
  <text x="135" y="228" fill="#c9d1d9" font-size="11" text-anchor="middle">Стратегия</text>
  <text x="135" y="245" fill="#8b949e" font-size="9" text-anchor="middle">что покупать</text>
  <text x="135" y="257" fill="#8b949e" font-size="9" text-anchor="middle">и когда</text>

  <rect x="245" y="205" width="150" height="60" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="320" y="228" fill="#c9d1d9" font-size="11" text-anchor="middle">Исполнение</text>
  <text x="320" y="245" fill="#8b949e" font-size="9" text-anchor="middle">как купить,</text>
  <text x="320" y="257" fill="#8b949e" font-size="9" text-anchor="middle">не сдвинув цену</text>

  <rect x="430" y="205" width="150" height="60" rx="6" fill="#161b22" stroke="#f85149"/>
  <text x="505" y="228" fill="#c9d1d9" font-size="11" text-anchor="middle">Риск-менеджмент</text>
  <text x="505" y="245" fill="#8b949e" font-size="9" text-anchor="middle">сколько потерять,</text>
  <text x="505" y="257" fill="#8b949e" font-size="9" text-anchor="middle">прежде чем стоп</text>

  <text x="320" y="295" fill="#8b949e" font-size="10" text-anchor="middle">Хорошая архитектура держит эти три слоя раздельно и тестируемыми независимо</text>
</svg>
