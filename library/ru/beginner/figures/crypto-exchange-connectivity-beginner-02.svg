<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Комиссия maker против taker</text>

  <line x1="80" y1="200" x2="560" y2="200" stroke="#30363d"/>
  <text x="25" y="130" fill="#8b949e" font-size="11" transform="rotate(-90 25 130)">Комиссия, %</text>

  <rect x="150" y="180" width="80" height="18" fill="#3fb950" opacity="0.7"/>
  <text x="190" y="215" fill="#c9d1d9" font-size="11" text-anchor="middle">Maker</text>
  <text x="190" y="172" fill="#8b949e" font-size="10" text-anchor="middle">0.02%</text>

  <rect x="380" y="120" width="80" height="78" fill="#f85149" opacity="0.7"/>
  <text x="420" y="215" fill="#c9d1d9" font-size="11" text-anchor="middle">Taker</text>
  <text x="420" y="112" fill="#8b949e" font-size="10" text-anchor="middle">0.07%</text>

  <text x="320" y="235" fill="#8b949e" font-size="11" text-anchor="middle">Maker добавляет ликвидность (лимитная заявка ждёт в стакане),</text>
  <text x="320" y="252" fill="#8b949e" font-size="11" text-anchor="middle">taker её потребляет — разница накапливается при частых сделках</text>
</svg>
