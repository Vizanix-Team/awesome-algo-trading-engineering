<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">DataFrame pandas с индексом по времени</text>

  <g font-size="11">
    <rect x="90" y="50" width="460" height="30" fill="#161b22" stroke="#30363d"/>
    <text x="150" y="70" fill="#58a6ff" text-anchor="middle">время (индекс)</text>
    <text x="255" y="70" fill="#58a6ff" text-anchor="middle">open</text>
    <text x="330" y="70" fill="#58a6ff" text-anchor="middle">high</text>
    <text x="400" y="70" fill="#58a6ff" text-anchor="middle">low</text>
    <text x="465" y="70" fill="#58a6ff" text-anchor="middle">close</text>
    <text x="520" y="70" fill="#58a6ff" text-anchor="middle">volume</text>

    <rect x="90" y="80" width="460" height="26" fill="#0d1117" stroke="#30363d"/>
    <text x="150" y="98" fill="#c9d1d9" text-anchor="middle">10:00</text>
    <text x="255" y="98" fill="#c9d1d9" text-anchor="middle">50.00</text>
    <text x="330" y="98" fill="#c9d1d9" text-anchor="middle">50.15</text>
    <text x="400" y="98" fill="#c9d1d9" text-anchor="middle">49.95</text>
    <text x="465" y="98" fill="#c9d1d9" text-anchor="middle">50.08</text>
    <text x="520" y="98" fill="#c9d1d9" text-anchor="middle">12000</text>

    <rect x="90" y="106" width="460" height="26" fill="#161b22" stroke="#30363d"/>
    <text x="150" y="124" fill="#c9d1d9" text-anchor="middle">10:05</text>
    <text x="255" y="124" fill="#c9d1d9" text-anchor="middle">50.08</text>
    <text x="330" y="124" fill="#c9d1d9" text-anchor="middle">50.20</text>
    <text x="400" y="124" fill="#c9d1d9" text-anchor="middle">50.02</text>
    <text x="465" y="124" fill="#c9d1d9" text-anchor="middle">50.18</text>
    <text x="520" y="124" fill="#c9d1d9" text-anchor="middle">9400</text>
  </g>

  <text x="150" y="160" fill="#a371f7" font-size="10" text-anchor="middle">DatetimeIndex</text>
  <path d="M150,140 L150,150" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0L8,0L4,6Z" fill="#a371f7"/></marker></defs>

  <text x="320" y="200" fill="#8b949e" font-size="11" text-anchor="middle">Индекс по времени даёт выборку диапазона дат, ресемплирование на другой</text>
  <text x="320" y="220" fill="#8b949e" font-size="11" text-anchor="middle">таймфрейм и автоматическое выравнивание рядов одной командой</text>
</svg>
