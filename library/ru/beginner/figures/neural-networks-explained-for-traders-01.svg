<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Один нейрон: от входов к предсказанию</text>

  <g fill="#161b22" stroke="#a371f7">
    <circle cx="100" cy="70" r="16"/>
    <circle cx="100" cy="130" r="16"/>
    <circle cx="100" cy="190" r="16"/>
  </g>
  <text x="100" y="55" fill="#8b949e" font-size="9" text-anchor="middle">цена</text>
  <text x="100" y="115" fill="#8b949e" font-size="9" text-anchor="middle">объём</text>
  <text x="100" y="175" fill="#8b949e" font-size="9" text-anchor="middle">волатильность</text>

  <circle cx="330" cy="130" r="30" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="330" y="126" fill="#c9d1d9" font-size="9" text-anchor="middle">Σ w·x + b</text>
  <text x="330" y="140" fill="#8b949e" font-size="8" text-anchor="middle">активация</text>

  <g stroke="#8b949e" stroke-width="1.3">
    <line x1="116" y1="70" x2="302" y2="118"/>
    <line x1="116" y1="130" x2="300" y2="130"/>
    <line x1="116" y1="190" x2="302" y2="142"/>
  </g>
  <text x="200" y="90" fill="#58a6ff" font-size="9">w1</text>
  <text x="200" y="122" fill="#58a6ff" font-size="9">w2</text>
  <text x="200" y="170" fill="#58a6ff" font-size="9">w3</text>

  <circle cx="500" cy="130" r="16" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <line x1="360" y1="130" x2="484" y2="130" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a11)"/>
  <text x="500" y="160" fill="#3fb950" font-size="10" text-anchor="middle">выход</text>
  <text x="500" y="174" fill="#8b949e" font-size="8" text-anchor="middle">напр. вероятность роста</text>
  <defs><marker id="a11" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#3fb950"/></marker></defs>

  <text x="320" y="235" fill="#8b949e" font-size="11" text-anchor="middle">Веса w настраиваются автоматически на исторических примерах "вход-выход"</text>
