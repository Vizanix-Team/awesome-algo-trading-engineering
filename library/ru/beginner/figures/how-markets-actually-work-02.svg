<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Лимитная заявка против рыночной</text>

  <rect x="50" y="60" width="230" height="160" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="165" y="88" fill="#58a6ff" font-size="13" text-anchor="middle">Лимитная заявка</text>
  <text x="165" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">"куплю не дороже 50.10"</text>
  <circle cx="165" cy="150" r="10" fill="#3fb950"/>
  <text x="200" y="154" fill="#8b949e" font-size="10">гарантирует цену</text>
  <circle cx="165" cy="180" r="10" fill="#f85149"/>
  <text x="200" y="184" fill="#8b949e" font-size="10">не гарантирует исполнение</text>

  <rect x="360" y="60" width="230" height="160" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="475" y="88" fill="#a371f7" font-size="13" text-anchor="middle">Рыночная заявка</text>
  <text x="475" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">"куплю прямо сейчас"</text>
  <circle cx="475" cy="150" r="10" fill="#3fb950"/>
  <text x="510" y="154" fill="#8b949e" font-size="10">гарантирует исполнение</text>
  <circle cx="475" cy="180" r="10" fill="#f85149"/>
  <text x="510" y="184" fill="#8b949e" font-size="10">не гарантирует цену</text>

  <text x="320" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Любая заявка балансирует между гарантией цены и гарантией исполнения —</text>
  <text x="320" y="273" fill="#8b949e" font-size="11" text-anchor="middle">обе гарантии одновременно получить нельзя</text>
</svg>
