<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Фиксированный процент капитала на сделку (2%)</text>
  <line x1="60" y1="220" x2="580" y2="220" stroke="#30363d"/>
  <text x="25" y="140" fill="#8b949e" font-size="11" transform="rotate(-90 25 140)">Капитал, $</text>

  <g font-size="10" text-anchor="middle">
    <rect x="90" y="80" width="70" height="140" fill="#3fb950" opacity="0.6"/>
    <text x="125" y="235" fill="#8b949e">Старт</text>
    <text x="125" y="73" fill="#c9d1d9">10 000</text>
    <text x="125" y="200" fill="#e6edf3" font-size="9">риск 200</text>

    <rect x="230" y="120" width="70" height="100" fill="#f85149" opacity="0.6"/>
    <text x="265" y="235" fill="#8b949e">После убытка</text>
    <text x="265" y="113" fill="#c9d1d9">7 000</text>
    <text x="265" y="200" fill="#e6edf3" font-size="9">риск 140</text>

    <rect x="370" y="140" width="70" height="80" fill="#f85149" opacity="0.4"/>
    <text x="405" y="235" fill="#8b949e">После серии</text>
    <text x="405" y="255" fill="#8b949e">убытков</text>
    <text x="405" y="133" fill="#c9d1d9">5 000</text>
    <text x="405" y="200" fill="#e6edf3" font-size="9">риск 100</text>

    <rect x="510" y="60" width="70" height="160" fill="#3fb950" opacity="0.8"/>
    <text x="545" y="235" fill="#8b949e">После роста</text>
    <text x="545" y="53" fill="#c9d1d9">14 000</text>
    <text x="545" y="200" fill="#e6edf3" font-size="9">риск 280</text>
  </g>

  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Размер риска на сделку автоматически сокращается после убытков и растёт после прибыли</text>
</svg>
