<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Спот, маржа и бессрочные фьючерсы</text>

  <rect x="30" y="55" width="180" height="150" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="120" y="82" fill="#3fb950" font-size="12" text-anchor="middle">Спот</text>
  <text x="120" y="108" fill="#c9d1d9" font-size="10" text-anchor="middle">реальный актив</text>
  <text x="120" y="126" fill="#c9d1d9" font-size="10" text-anchor="middle">на вашем счету</text>
  <text x="120" y="150" fill="#8b949e" font-size="9" text-anchor="middle">риск ограничен</text>
  <text x="120" y="164" fill="#8b949e" font-size="9" text-anchor="middle">вложенной суммой</text>

  <rect x="230" y="55" width="180" height="150" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="320" y="82" fill="#a371f7" font-size="12" text-anchor="middle">Маржа</text>
  <text x="320" y="108" fill="#c9d1d9" font-size="10" text-anchor="middle">заём под залог</text>
  <text x="320" y="126" fill="#c9d1d9" font-size="10" text-anchor="middle">увеличенный объём</text>
  <text x="320" y="150" fill="#8b949e" font-size="9" text-anchor="middle">риск ликвидации</text>
  <text x="320" y="164" fill="#8b949e" font-size="9" text-anchor="middle">при просадке залога</text>

  <rect x="430" y="55" width="180" height="150" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="520" y="82" fill="#f85149" font-size="12" text-anchor="middle">Бессрочный фьючерс</text>
  <text x="520" y="108" fill="#c9d1d9" font-size="10" text-anchor="middle">без владения активом</text>
  <text x="520" y="126" fill="#c9d1d9" font-size="10" text-anchor="middle">funding rate</text>
  <text x="520" y="150" fill="#8b949e" font-size="9" text-anchor="middle">сложная механика,</text>
  <text x="520" y="164" fill="#8b949e" font-size="9" text-anchor="middle">риск ликвидации</text>

  <text x="320" y="230" fill="#8b949e" font-size="11" text-anchor="middle">Риск растёт слева направо — начинающему разумно стартовать со спота</text>
</svg>
