<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Одинаковая средняя доходность, разная волатильность</text>

  <line x1="60" y1="140" x2="580" y2="140" stroke="#30363d" stroke-dasharray="3 3"/>
  <text x="590" y="144" fill="#8b949e" font-size="9">среднее</text>

  <polyline points="60,140 100,138 140,142 180,139 220,141 260,138 300,142 340,139 380,141 420,138 460,142 500,139 540,141 580,140" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="320" y="105" fill="#3fb950" font-size="11" text-anchor="middle">Низкая волатильность</text>

  <polyline points="60,140 100,90 140,180 180,60 220,190 260,80 300,170 340,70 380,185 420,65 460,175 500,85 540,180 580,140" fill="none" stroke="#f85149" stroke-width="2" opacity="0.85"/>
  <text x="320" y="225" fill="#f85149" font-size="11" text-anchor="middle">Высокая волатильность (тот же средний результат)</text>

  <text x="320" y="245" fill="#8b949e" font-size="10" text-anchor="middle">Высокая волатильность может привести к серии крупных убытков раньше, чем проявится среднее</text>
</svg>
