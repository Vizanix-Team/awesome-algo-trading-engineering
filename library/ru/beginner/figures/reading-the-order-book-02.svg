<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Рыночное воздействие растёт быстрее размера сделки</text>
  <line x1="60" y1="240" x2="580" y2="240" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#30363d"/>
  <text x="320" y="265" fill="#8b949e" font-size="11" text-anchor="middle">Размер сделки относительно глубины стакана</text>
  <text x="25" y="150" fill="#8b949e" font-size="11" transform="rotate(-90 25 150)">Отклонение цены, %</text>

  <path d="M60,230 C 200,225 320,190 420,140 C 480,110 540,75 580,65" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <circle cx="130" cy="228" r="4" fill="#3fb950"/>
  <text x="130" y="210" fill="#8b949e" font-size="9" text-anchor="middle">малая сделка:</text>
  <text x="130" y="222" fill="#8b949e" font-size="9" text-anchor="middle">почти без влияния</text>

  <circle cx="420" cy="140" r="4" fill="#f85149"/>
  <text x="470" y="130" fill="#8b949e" font-size="9" text-anchor="middle">сделка ≈ глубина</text>
  <text x="470" y="142" fill="#8b949e" font-size="9" text-anchor="middle">видимого стакана:</text>
  <text x="470" y="154" fill="#8b949e" font-size="9" text-anchor="middle">существенный сдвиг</text>

  <text x="320" y="290" fill="#8b949e" font-size="10" text-anchor="middle">Поэтому крупные участники разбивают объём на части и растягивают во времени</text>
</svg>
