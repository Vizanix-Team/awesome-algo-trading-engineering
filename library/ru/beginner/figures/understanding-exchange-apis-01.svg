<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Две части биржевого API</text>

  <rect x="60" y="55" width="230" height="150" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="175" y="82" fill="#58a6ff" font-size="13" text-anchor="middle">REST API</text>
  <text x="175" y="108" fill="#c9d1d9" font-size="10" text-anchor="middle">баланс счёта</text>
  <text x="175" y="128" fill="#c9d1d9" font-size="10" text-anchor="middle">отправка заявки</text>
  <text x="175" y="148" fill="#c9d1d9" font-size="10" text-anchor="middle">отмена заявки</text>
  <text x="175" y="168" fill="#c9d1d9" font-size="10" text-anchor="middle">исторические данные</text>
  <text x="175" y="190" fill="#8b949e" font-size="9" text-anchor="middle">разовые команды</text>

  <rect x="350" y="55" width="230" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="465" y="82" fill="#3fb950" font-size="13" text-anchor="middle">WebSocket</text>
  <text x="465" y="108" fill="#c9d1d9" font-size="10" text-anchor="middle">изменения цены</text>
  <text x="465" y="128" fill="#c9d1d9" font-size="10" text-anchor="middle">обновления стакана</text>
  <text x="465" y="148" fill="#c9d1d9" font-size="10" text-anchor="middle">статус своих заявок</text>
  <text x="465" y="190" fill="#8b949e" font-size="9" text-anchor="middle">непрерывный поток</text>

  <text x="320" y="235" fill="#8b949e" font-size="11" text-anchor="middle">Постоянный опрос REST вместо подписки на WebSocket работает, но создаёт задержку</text>
</svg>
