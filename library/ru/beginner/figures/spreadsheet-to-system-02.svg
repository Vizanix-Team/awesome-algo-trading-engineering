<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Этап 4: человек в контуре (human in the loop)</text>

  <rect x="40" y="70" width="110" height="50" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="95" y="99" fill="#c9d1d9" font-size="10" text-anchor="middle">Скрипт находит сигнал</text>

  <rect x="205" y="70" width="130" height="50" rx="6" fill="#161b22" stroke="#a371f7"/>
  <text x="270" y="90" fill="#c9d1d9" font-size="10" text-anchor="middle">Готовит заявку</text>
  <text x="270" y="105" fill="#8b949e" font-size="8" text-anchor="middle">актив, объём, цена</text>

  <rect x="390" y="70" width="110" height="50" rx="6" fill="#161b22" stroke="#f85149"/>
  <text x="445" y="90" fill="#c9d1d9" font-size="10" text-anchor="middle">Человек</text>
  <text x="445" y="105" fill="#c9d1d9" font-size="10" text-anchor="middle">подтверждает?</text>

  <rect x="555" y="45" width="70" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="590" y="70" fill="#3fb950" font-size="10" text-anchor="middle">Да → биржа</text>

  <rect x="555" y="105" width="70" height="40" rx="6" fill="#161b22" stroke="#8b949e"/>
  <text x="590" y="130" fill="#8b949e" font-size="10" text-anchor="middle">Нет → отмена</text>

  <g stroke="#8b949e" stroke-width="1.5" marker-end="url(#a10)">
    <line x1="150" y1="95" x2="203" y2="95"/>
    <line x1="335" y1="95" x2="388" y2="95"/>
    <line x1="500" y1="85" x2="553" y2="65"/>
    <line x1="500" y1="105" x2="553" y2="125"/>
  </g>
  <defs><marker id="a10" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#8b949e"/></marker></defs>

  <text x="320" y="180" fill="#8b949e" font-size="11" text-anchor="middle">Последний рубеж защиты — здравый смысл человека, способного заметить</text>
  <text x="320" y="200" fill="#8b949e" font-size="11" text-anchor="middle">явную аномалию до того, как она станет реальной сделкой</text>
</svg>
