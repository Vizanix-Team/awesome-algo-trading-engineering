<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Пример стакана заявок акции ABC</text>
  <text x="320" y="46" fill="#8b949e" font-size="11" text-anchor="middle">Спред = 50.12 − 50.10 = 0.02</text>

  <!-- bid column -->
  <text x="160" y="70" fill="#3fb950" font-size="12" text-anchor="middle">Покупка (bid)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="90" y="80" width="140" height="26" fill="#238636" opacity="0.55"/>
    <text x="160" y="98" fill="#e6edf3">50.10 → 200</text>

    <rect x="90" y="110" width="140" height="26" fill="#238636" opacity="0.35"/>
    <text x="160" y="128" fill="#c9d1d9">50.09 → 500</text>

    <rect x="90" y="140" width="140" height="26" fill="#238636" opacity="0.2"/>
    <text x="160" y="158" fill="#c9d1d9">50.08 → 1000</text>
  </g>

  <!-- ask column -->
  <text x="480" y="70" fill="#f85149" font-size="12" text-anchor="middle">Продажа (ask)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="410" y="80" width="140" height="26" fill="#da3633" opacity="0.55"/>
    <text x="480" y="98" fill="#e6edf3">50.12 → 250</text>

    <rect x="410" y="110" width="140" height="26" fill="#da3633" opacity="0.35"/>
    <text x="480" y="128" fill="#c9d1d9">50.14 → 400</text>

    <rect x="410" y="140" width="140" height="26" fill="#da3633" opacity="0.2"/>
    <text x="480" y="158" fill="#c9d1d9">50.16 → 900</text>
  </g>

  <line x1="320" y1="70" x2="320" y2="170" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="190" fill="#8b949e" font-size="10" text-anchor="middle">Сделка происходит только когда новый участник соглашается на цену встречной стороны</text>

  <!-- gap illustration -->
  <text x="320" y="225" fill="#c9d1d9" font-size="12" text-anchor="middle">Если промежуточные заявки раскуплены</text>
  <line x1="120" y1="255" x2="520" y2="255" stroke="#30363d" stroke-width="1"/>
  <circle cx="160" cy="255" r="5" fill="#f85149"/>
  <text x="160" y="275" fill="#8b949e" font-size="10" text-anchor="middle">сделка по 50.12</text>
  <circle cx="480" cy="255" r="5" fill="#f85149"/>
  <text x="480" y="275" fill="#8b949e" font-size="10" text-anchor="middle">следующая заявка 50.30</text>
  <line x1="165" y1="255" x2="475" y2="255" stroke="#f85149" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="295" fill="#8b949e" font-size="10" text-anchor="middle">крупная рыночная заявка "проедает" разрыв и сдвигает цену сразу к 50.30</text>
</svg>
