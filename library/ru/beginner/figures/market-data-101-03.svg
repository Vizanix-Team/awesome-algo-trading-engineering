<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Один и тот же актив на разных таймфреймах</text>

  <text x="160" y="50" fill="#58a6ff" font-size="12" text-anchor="middle">Минутные бары: много шума</text>
  <polyline points="60,120 80,100 100,130 120,90 140,140 160,95 180,135 200,105 220,145 240,100 260,120" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="55" y1="150" x2="270" y2="150" stroke="#30363d"/>

  <text x="480" y="50" fill="#3fb950" font-size="12" text-anchor="middle">Дневные бары: плавный тренд</text>
  <polyline points="380,140 410,130 440,120 470,115 500,100 530,95 560,80 590,70" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="375" y1="150" x2="595" y2="150" stroke="#30363d"/>

  <text x="320" y="200" fill="#8b949e" font-size="11" text-anchor="middle">Ни один масштаб не "правильнее" другого — таймфрейм должен соответствовать</text>
  <text x="320" y="220" fill="#8b949e" font-size="11" text-anchor="middle">горизонту вашей стратегии: внутридневной торговле нужны минутные бары,</text>
  <text x="320" y="240" fill="#8b949e" font-size="11" text-anchor="middle">многодневной позиции — дневные или часовые</text>
</svg>
