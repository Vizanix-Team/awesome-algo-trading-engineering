<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Прохождение стакана: продажа 700 акций ABC</text>

  <text x="160" y="55" fill="#3fb950" font-size="12" text-anchor="middle">Заявки на покупку (bid)</text>
  <g font-size="11">
    <rect x="60" y="65" width="200" height="28" fill="#238636" opacity="0.6"/>
    <text x="70" y="83" fill="#e6edf3">50.10 → 200 акций</text>
    <text x="240" y="83" fill="#c9d1d9" text-anchor="end">взято: 200</text>

    <rect x="60" y="97" width="200" height="28" fill="#238636" opacity="0.4"/>
    <text x="70" y="115" fill="#e6edf3">50.09 → 500 акций</text>
    <text x="240" y="115" fill="#c9d1d9" text-anchor="end">взято: 500</text>

    <rect x="60" y="129" width="200" height="28" fill="#161b22" stroke="#238636"/>
    <text x="70" y="147" fill="#8b949e">50.08 → 1000 акций</text>
    <text x="240" y="147" fill="#8b949e" text-anchor="end">не тронуто</text>

    <rect x="60" y="161" width="200" height="28" fill="#161b22" stroke="#238636"/>
    <text x="70" y="179" fill="#8b949e">50.07 → 300 акций</text>
    <text x="240" y="179" fill="#8b949e" text-anchor="end">не тронуто</text>
  </g>

  <text x="450" y="55" fill="#c9d1d9" font-size="12" text-anchor="middle">Результат сделки</text>
  <rect x="330" y="70" width="240" height="110" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="450" y="95" fill="#c9d1d9" font-size="11" text-anchor="middle">200 акций по 50.10</text>
  <text x="450" y="115" fill="#c9d1d9" font-size="11" text-anchor="middle">500 акций по 50.09</text>
  <line x1="345" y1="128" x2="555" y2="128" stroke="#30363d"/>
  <text x="450" y="150" fill="#f85149" font-size="12" text-anchor="middle" font-weight="bold">средняя цена ≈ 50.093</text>
  <text x="450" y="168" fill="#8b949e" font-size="9" text-anchor="middle">ниже "видимой" лучшей цены 50.10</text>

  <text x="320" y="220" fill="#8b949e" font-size="11" text-anchor="middle">Объёма на лучшем уровне (200) не хватило для сделки в 700 акций —</text>
  <text x="320" y="238" fill="#8b949e" font-size="11" text-anchor="middle">пришлось "пройти" вглубь стакана до следующего уровня</text>
</svg>
