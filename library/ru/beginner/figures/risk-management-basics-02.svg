<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Слои защиты: от позиции до аварийного выключателя</text>

  <g font-size="11" text-anchor="middle">
    <rect x="220" y="50" width="200" height="40" rx="6" fill="#161b22" stroke="#58a6ff"/>
    <text x="320" y="75" fill="#c9d1d9">Лимит на позицию</text>

    <rect x="190" y="105" width="260" height="40" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="320" y="130" fill="#c9d1d9">Лимит на портфель (дневной убыток)</text>

    <rect x="160" y="160" width="320" height="40" rx="6" fill="#161b22" stroke="#a371f7"/>
    <text x="320" y="185" fill="#c9d1d9">Лимит на систему (частота заявок, размер)</text>

    <rect x="120" y="215" width="400" height="45" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="320" y="240" fill="#f85149" font-weight="bold">Kill switch — аварийная остановка</text>
    <text x="320" y="255" fill="#8b949e" font-size="9">архитектурно независим от логики стратегии</text>
  </g>
  <g stroke="#8b949e" stroke-width="1" marker-end="url(#a8)">
    <line x1="320" y1="90" x2="320" y2="103"/>
    <line x1="320" y1="145" x2="320" y2="158"/>
    <line x1="320" y1="200" x2="320" y2="213"/>
  </g>
  <defs><marker id="a8" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#8b949e"/></marker></defs>

  <text x="320" y="285" fill="#8b949e" font-size="10" text-anchor="middle">Каждый следующий уровень — последняя линия обороны, если предыдущий не сработал</text>
</svg>
