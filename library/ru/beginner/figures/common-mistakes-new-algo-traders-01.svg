<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Наивный бэктест против реалистичного</text>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="230" stroke="#30363d"/>
  <text x="320" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Время</text>
  <text x="25" y="145" fill="#8b949e" font-size="11" transform="rotate(-90 25 145)">Капитал</text>

  <polyline points="60,180 100,160 140,130 180,140 220,105 260,115 300,80 340,90 380,60 420,70 460,50 500,60 540,45 580,55" fill="none" stroke="#3fb950" stroke-width="2.5"/>
