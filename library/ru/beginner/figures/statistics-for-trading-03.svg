<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Корреляция не значит причинность</text>

  <line x1="80" y1="220" x2="80" y2="60" stroke="#30363d"/>
  <line x1="80" y1="220" x2="560" y2="220" stroke="#30363d"/>
  <text x="320" y="250" fill="#8b949e" font-size="11" text-anchor="middle">Продажи мороженого</text>
  <text x="25" y="140" fill="#8b949e" font-size="11" transform="rotate(-90 25 140)">Случаи утопления</text>

  <g fill="#58a6ff">
    <circle cx="130" cy="190" r="5"/>
    <circle cx="180" cy="170" r="5"/>
    <circle cx="230" cy="160" r="5"/>
    <circle cx="280" cy="140" r="5"/>
    <circle cx="330" cy="120" r="5"/>
    <circle cx="380" cy="110" r="5"/>
    <circle cx="430" cy="90" r="5"/>
    <circle cx="480" cy="80" r="5"/>
  </g>
  <line x1="120" y1="200" x2="500" y2="75" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="320" y="90" fill="#a371f7" font-size="10" text-anchor="middle">общая скрытая причина: жара</text>

  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Обе величины растут летом — мороженое утопления не вызывает</text>
</svg>
