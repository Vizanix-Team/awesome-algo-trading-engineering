<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">REST против WebSocket для получения данных</text>

  <text x="150" y="55" fill="#58a6ff" font-size="12" text-anchor="middle">REST: запрос-ответ</text>
  <rect x="70" y="70" width="70" height="34" rx="4" fill="#161b22" stroke="#58a6ff"/>
  <text x="105" y="91" fill="#c9d1d9" font-size="10" text-anchor="middle">клиент</text>
  <rect x="230" y="70" width="70" height="34" rx="4" fill="#161b22" stroke="#58a6ff"/>
  <text x="265" y="91" fill="#c9d1d9" font-size="10" text-anchor="middle">биржа</text>
  <path d="M140,80 L228,80" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="185" y="75" fill="#8b949e" font-size="8" text-anchor="middle">"есть новое?"</text>
  <path d="M228,96 L140,96" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="185" y="112" fill="#8b949e" font-size="8" text-anchor="middle">ответ</text>
  <text x="185" y="130" fill="#8b949e" font-size="9" text-anchor="middle">повторять снова и снова</text>
  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#8b949e"/></marker></defs>

  <text x="480" y="55" fill="#3fb950" font-size="12" text-anchor="middle">WebSocket: подписка на поток</text>
  <rect x="400" y="70" width="70" height="34" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="435" y="91" fill="#c9d1d9" font-size="10" text-anchor="middle">клиент</text>
  <rect x="560" y="70" width="70" height="34" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="595" y="91" fill="#c9d1d9" font-size="10" text-anchor="middle">биржа</text>
  <path d="M470,80 L558,80" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="515" y="75" fill="#8b949e" font-size="8" text-anchor="middle">подписка (1 раз)</text>
  <path d="M558,92 L470,92" stroke="#3fb950" stroke-width="1.2"/>
  <path d="M558,100 L470,100" stroke="#3fb950" stroke-width="1.2" marker-end="url(#a5)"/>
  <text x="515" y="115" fill="#8b949e" font-size="8" text-anchor="middle">сервер сам шлёт события</text>
  <defs><marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#3fb950"/></marker></defs>

  <text x="320" y="170" fill="#8b949e" font-size="11" text-anchor="middle">REST удобен для разовых команд (баланс, история), WebSocket эффективнее</text>
  <text x="320" y="190" fill="#8b949e" font-size="11" text-anchor="middle">для часто меняющихся данных, требующих минимальной задержки</text>
</svg>
