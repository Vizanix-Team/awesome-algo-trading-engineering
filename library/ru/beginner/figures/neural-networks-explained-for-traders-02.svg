<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Переобучение: ошибка на обучении и на тесте</text>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="230" stroke="#30363d"/>
  <text x="320" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Число эпох обучения</text>
  <text x="25" y="145" fill="#8b949e" font-size="11" transform="rotate(-90 25 145)">Ошибка</text>

  <polyline points="60,200 120,160 180,130 240,105 300,90 360,78 420,68 480,62 540,58 580,55" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="480" y="45" fill="#3fb950" font-size="10" text-anchor="middle">Ошибка на обучающих данных</text>

  <polyline points="60,205 120,170 180,140 240,120 300,110 360,112 420,125 480,145 540,170 580,190" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="480" y="205" fill="#f85149" font-size="10" text-anchor="middle">Ошибка на тестовых данных</text>

  <line x1="300" y1="60" x2="300" y2="230" stroke="#8b949e" stroke-dasharray="3 3"/>
  <text x="300" y="245" fill="#8b949e" font-size="9" text-anchor="middle">точка переобучения</text>
</svg>
