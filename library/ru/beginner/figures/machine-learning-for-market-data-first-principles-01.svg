<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Случайное разбиение против хронологического</text>

  <text x="160" y="55" fill="#f85149" font-size="12" text-anchor="middle">Неверно: случайное перемешивание</text>
  <g>
    <rect x="60" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="88" y="70" width="24" height="24" fill="#f85149"/>
    <rect x="116" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="144" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="172" y="70" width="24" height="24" fill="#f85149"/>
    <rect x="200" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="228" y="70" width="24" height="24" fill="#f85149"/>
    <rect x="256" y="70" width="24" height="24" fill="#3fb950"/>
  </g>
  <text x="160" y="115" fill="#8b949e" font-size="9" text-anchor="middle">будущее просачивается в обучение</text>

  <text x="480" y="55" fill="#3fb950" font-size="12" text-anchor="middle">Верно: хронологический порядок</text>
  <g>
    <rect x="380" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="408" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="436" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="464" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="492" y="70" width="24" height="24" fill="#3fb950"/>
    <rect x="520" y="70" width="24" height="24" fill="#f85149"/>
    <rect x="548" y="70" width="24" height="24" fill="#f85149"/>
    <rect x="576" y="70" width="24" height="24" fill="#f85149"/>
  </g>
  <text x="480" y="115" fill="#8b949e" font-size="9" text-anchor="middle">обучение строго раньше теста</text>

  <rect x="30" y="150" width="16" height="14" fill="#3fb950"/>
  <text x="55" y="162" fill="#8b949e" font-size="9">обучающая выборка</text>
  <rect x="180" y="150" width="16" height="14" fill="#f85149"/>
  <text x="205" y="162" fill="#8b949e" font-size="9">тестовая выборка</text>

  <text x="320" y="210" fill="#8b949e" font-size="11" text-anchor="middle">Соседние по времени наблюдения статистически зависимы —</text>
  <text x="320" y="230" fill="#8b949e" font-size="11" text-anchor="middle">случайное разбиение создаёт незаметное заглядывание в будущее</text>
</svg>
