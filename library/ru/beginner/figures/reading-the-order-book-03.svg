<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Дисбаланс стакана: пример XYZ</text>

  <text x="160" y="55" fill="#3fb950" font-size="12" text-anchor="middle">Покупка (сумма 2600 → 3000)</text>
  <rect x="70" y="65" width="180" height="22" fill="#238636" opacity="0.5"/>
  <text x="160" y="80" fill="#e6edf3" font-size="10" text-anchor="middle">100.05 → 300</text>
  <rect x="70" y="90" width="180" height="22" fill="#238636" opacity="0.5"/>
  <text x="160" y="105" fill="#e6edf3" font-size="10" text-anchor="middle">100.04 → 800</text>
  <rect x="70" y="115" width="180" height="22" fill="#238636" opacity="0.7"/>
  <text x="160" y="130" fill="#e6edf3" font-size="10" text-anchor="middle">100.03 → 1500 → 3000</text>

  <text x="480" y="55" fill="#f85149" font-size="12" text-anchor="middle">Продажа (сумма 2650)</text>
  <rect x="390" y="65" width="180" height="22" fill="#da3633" opacity="0.5"/>
  <text x="480" y="80" fill="#e6edf3" font-size="10" text-anchor="middle">100.06 → 250</text>
  <rect x="390" y="90" width="180" height="22" fill="#da3633" opacity="0.5"/>
  <text x="480" y="105" fill="#e6edf3" font-size="10" text-anchor="middle">100.07 → 400</text>
  <rect x="390" y="115" width="180" height="22" fill="#da3633" opacity="0.5"/>
  <text x="480" y="130" fill="#e6edf3" font-size="10" text-anchor="middle">100.08 → 2000</text>

  <!-- imbalance gauge -->
  <text x="320" y="175" fill="#c9d1d9" font-size="12" text-anchor="middle">Индикатор дисбаланса</text>
  <rect x="120" y="190" width="400" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="120" y="190" width="200" height="18" rx="9" fill="#da3633" opacity="0.5"/>
  <rect x="320" y="190" width="215" height="18" rx="9" fill="#3fb950" opacity="0.6"/>
  <line x1="320" y1="185" x2="320" y2="213" stroke="#8b949e" stroke-width="1"/>
  <circle cx="345" cy="199" r="6" fill="#e6edf3"/>
  <text x="120" y="225" fill="#8b949e" font-size="9">−1 (продавцы)</text>
  <text x="535" y="225" fill="#8b949e" font-size="9" text-anchor="end">+1 (покупатели)</text>

  <text x="320" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Рост объёма на 100.03 без изменений на продаже сместил дисбаланс к покупателям</text>
  <text x="320" y="273" fill="#8b949e" font-size="11" text-anchor="middle">Это гипотеза для проверки, а не гарантированный сигнал</text>
</svg>
