<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Обучающая и тестовая выборка: признак переподгонки</text>

  <line x1="60" y1="230" x2="580" y2="230" stroke="#30363d"/>
  <line x1="60" y1="50" x2="60" y2="230" stroke="#30363d"/>
  <text x="320" y="255" fill="#8b949e" font-size="11" text-anchor="middle">Время</text>
  <text x="25" y="140" fill="#8b949e" font-size="11" transform="rotate(-90 25 140)">Доходность стратегии</text>

  <line x1="320" y1="50" x2="320" y2="230" stroke="#30363d" stroke-dasharray="3 3"/>
  <text x="190" y="65" fill="#8b949e" font-size="10" text-anchor="middle">обучающая выборка</text>
  <text x="450" y="65" fill="#8b949e" font-size="10" text-anchor="middle">тестовая выборка</text>

  <polyline points="60,200 100,180 140,150 180,120 220,95 260,80 300,65 320,60" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <polyline points="320,60 360,90 400,110 440,105 480,130 520,150 560,170" fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="5 3"/>

  <text x="190" y="100" fill="#3fb950" font-size="10" text-anchor="middle">отличный результат</text>
  <text x="470" y="195" fill="#f85149" font-size="10" text-anchor="middle">заметно хуже на новых данных</text>

  <text x="320" y="285" fill="#8b949e" font-size="11" text-anchor="middle">Резкое падение качества на тестовой выборке — явный сигнал подгонки под данные</text>
</svg>
