<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Анатомия свечи (candlestick)</text>

  <!-- bullish candle -->
  <line x1="220" y1="60" x2="220" y2="90" stroke="#3fb950" stroke-width="2"/>
  <rect x="200" y="90" width="40" height="70" fill="#3fb950" opacity="0.7" stroke="#3fb950"/>
  <line x1="220" y1="160" x2="220" y2="190" stroke="#3fb950" stroke-width="2"/>
  <text x="220" y="50" fill="#8b949e" font-size="10" text-anchor="middle">High 50.15</text>
  <text x="220" y="205" fill="#8b949e" font-size="10" text-anchor="middle">Low 49.95</text>
  <text x="130" y="95" fill="#8b949e" font-size="10" text-anchor="end">Close 50.08 →</text>
  <text x="130" y="155" fill="#8b949e" font-size="10" text-anchor="end">Open 50.00 →</text>
  <text x="220" y="230" fill="#3fb950" font-size="11" text-anchor="middle">Растущая (close &gt; open)</text>

  <!-- bearish candle -->
  <line x1="420" y1="60" x2="420" y2="85" stroke="#f85149" stroke-width="2"/>
  <rect x="400" y="85" width="40" height="65" fill="#f85149" opacity="0.7" stroke="#f85149"/>
  <line x1="420" y1="150" x2="420" y2="185" stroke="#f85149" stroke-width="2"/>
  <text x="420" y="50" fill="#8b949e" font-size="10" text-anchor="middle">High</text>
  <text x="420" y="200" fill="#8b949e" font-size="10" text-anchor="middle">Low</text>
  <text x="510" y="90" fill="#8b949e" font-size="10">← Open</text>
  <text x="510" y="146" fill="#8b949e" font-size="10">← Close</text>
  <text x="420" y="230" fill="#f85149" font-size="11" text-anchor="middle">Падающая (close &lt; open)</text>
</svg>
