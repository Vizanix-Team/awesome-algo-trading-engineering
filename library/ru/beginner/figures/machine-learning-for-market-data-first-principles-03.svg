<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Walk-forward validation: скользящее окно</text>

  <g font-size="9" fill="#c9d1d9">
    <rect x="60" y="60" width="120" height="20" fill="#3fb950" opacity="0.7"/>
    <rect x="185" y="60" width="60" height="20" fill="#f85149" opacity="0.7"/>
    <text x="330" y="75" fill="#8b949e">окно 1</text>

    <rect x="60" y="95" width="180" height="20" fill="#3fb950" opacity="0.7"/>
    <rect x="245" y="95" width="60" height="20" fill="#f85149" opacity="0.7"/>
    <text x="330" y="110" fill="#8b949e">окно 2</text>

    <rect x="60" y="130" width="240" height="20" fill="#3fb950" opacity="0.7"/>
    <rect x="305" y="130" width="60" height="20" fill="#f85149" opacity="0.7"/>
    <text x="330" y="145" fill="#8b949e">окно 3</text>

    <rect x="60" y="165" width="300" height="20" fill="#3fb950" opacity="0.7"/>
    <rect x="365" y="165" width="60" height="20" fill="#f85149" opacity="0.7"/>
    <text x="330" y="180" fill="#8b949e">окно 4</text>
  </g>

  <rect x="60" y="215" width="16" height="14" fill="#3fb950"/>
  <text x="85" y="227" fill="#8b949e" font-size="9">обучение (расширяется)</text>
  <rect x="230" y="215" width="16" height="14" fill="#f85149"/>
  <text x="255" y="227" fill="#8b949e" font-size="9">проверка (следующий отрезок)</text>

  <text x="320" y="248" fill="#8b949e" font-size="10" text-anchor="middle">Модель многократно переобучается и проверяется на каждом следующем отрезке</text>
</svg>
