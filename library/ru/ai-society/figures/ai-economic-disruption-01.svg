<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Парадокс Моравека: интуиция часто обманчива</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Качественное размещение, не измеренный индекс</text>

  <line x1="100" y1="340" x2="560" y2="340" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="340" x2="100" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="372" fill="#8b949e" font-size="12" text-anchor="middle">Воспринимаемая квалификация: низкая → высокая</text>
  <text x="45" y="205" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 45 205)">Устойчивость к автоматизации: низкая → высокая</text>

  <g fill="#f85149">
    <circle cx="460" cy="290" r="8"/>
    <circle cx="420" cy="310" r="8"/>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="460" y="278" text-anchor="middle">Юридический анализ</text>
    <text x="420" y="328" text-anchor="middle">Радиология</text>
  </g>

  <g fill="#3fb950">
    <circle cx="200" cy="120" r="8"/>
    <circle cx="240" cy="150" r="8"/>
  </g>
  <g fill="#c9d1d9" font-size="10">
    <text x="200" y="108" text-anchor="middle">Уборка помещений</text>
    <text x="240" y="168" text-anchor="middle">Уход за пожилыми</text>
  </g>

  <text x="320" y="392" fill="#8b949e" font-size="10" text-anchor="middle">Высококвалифицированные, но структурированные задачи автоматизируются легче, чем неструктурированный физический труд.</text>
</svg>
