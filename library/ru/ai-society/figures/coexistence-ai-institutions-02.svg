<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Принцип соразмерности риска</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Иллюстративное размещение применений ИИ по риску</text>

  <line x1="100" y1="290" x2="560" y2="290" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="290" x2="100" y2="80" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="318" fill="#8b949e" font-size="12" text-anchor="middle">Автономия и масштаб решения: низкие → высокие</text>
  <text x="45" y="185" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 45 185)">Обратимость вреда: обратимо → необратимо</text>

  <circle cx="180" cy="250" r="9" fill="#58a6ff"/>
  <text x="180" y="235" fill="#c9d1d9" font-size="11" text-anchor="middle">Рекомендация фильма</text>

  <circle cx="320" cy="180" r="9" fill="#a371f7"/>
  <text x="320" y="165" fill="#c9d1d9" font-size="11" text-anchor="middle">Кредитный скоринг</text>

  <circle cx="470" cy="110" r="11" fill="#f85149"/>
  <text x="470" y="95" fill="#c9d1d9" font-size="11" text-anchor="middle">Критическая инфраструктура</text>

  <text x="320" y="345" fill="#8b949e" font-size="10" text-anchor="middle">Уровень надзора должен расти вместе с автономией, масштабом и необратимостью — не быть единым для всех.</text>
</svg>
