<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три вида власти, которые часто смешивают</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Каждый требует отдельного набора противовесов</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="70" width="180" height="170" rx="6"/>
    <rect x="230" y="70" width="180" height="170" rx="6"/>
    <rect x="430" y="70" width="180" height="170" rx="6"/>
  </g>
  <g fill="#58a6ff"><rect x="30" y="70" width="180" height="8"/></g>
  <g fill="#a371f7"><rect x="230" y="70" width="180" height="8"/></g>
  <g fill="#3fb950"><rect x="430" y="70" width="180" height="8"/></g>

  <g fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="120" y="100">Инфраструктурная</text>
    <text x="320" y="100">Информационная</text>
    <text x="520" y="100">Институциональная</text>
  </g>
  <g fill="#8b949e" font-size="10">
    <text x="45" y="130">Компьютеры, энергия,</text>
    <text x="45" y="143">капитал, кадры</text>
    <text x="45" y="165">Аналог: железные</text>
    <text x="45" y="178">дороги, сети</text>

    <text x="245" y="130">Синтез единого</text>
    <text x="245" y="143">ответа вместо ссылок</text>
    <text x="245" y="165">Незаметное</text>
    <text x="245" y="178">накопление влияния</text>

    <text x="445" y="130">Регулирование и</text>
    <text x="445" y="143">лоббирование правил</text>
    <text x="445" y="165">Государство как</text>
    <text x="445" y="178">регулятор и игрок</text>
  </g>
</svg>
