<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Разброс экспертных оценок сроков (иллюстративно)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Качественная схема, а не результат опроса</text>

  <line x1="80" y1="270" x2="580" y2="270" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="292" fill="#8b949e" font-size="10" text-anchor="middle">несколько лет</text>
  <text x="280" y="292" fill="#8b949e" font-size="10" text-anchor="middle">10-25 лет</text>
  <text x="420" y="292" fill="#8b949e" font-size="10" text-anchor="middle">25-50 лет</text>
  <text x="550" y="292" fill="#8b949e" font-size="10" text-anchor="middle">50+ лет / недостижимо</text>

  <rect x="90" y="150" width="150" height="24" rx="4" fill="#58a6ff" opacity="0.5"/>
  <text x="165" y="140" fill="#58a6ff" font-size="10" text-anchor="middle">короткий срок</text>

  <rect x="180" y="190" width="220" height="24" rx="4" fill="#a371f7" opacity="0.5"/>
  <text x="290" y="230" fill="#a371f7" font-size="10" text-anchor="middle">неравномерный прогресс по доменам</text>

  <rect x="330" y="150" width="240" height="24" rx="4" fill="#3fb950" opacity="0.5"/>
  <text x="450" y="140" fill="#3fb950" font-size="10" text-anchor="middle">длинный срок / нужна новая парадигма</text>

  <text x="320" y="80" fill="#c9d1d9" font-size="12" text-anchor="middle">Разброс отражает устойчивое методологическое разногласие,</text>
  <text x="320" y="96" fill="#c9d1d9" font-size="12" text-anchor="middle">а не временный шум вокруг скрытого консенсуса.</text>
</svg>
