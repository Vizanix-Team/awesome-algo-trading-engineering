<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три горизонта риска и убывающая эмпирическая опора</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Качественная схема, не количественная оценка</text>

  <line x1="80" y1="230" x2="580" y2="230" stroke="#30363d" stroke-width="2"/>
  <text x="330" y="260" fill="#8b949e" font-size="12" text-anchor="middle">эмпирическая обоснованность: высокая → низкая</text>

  <rect x="90" y="120" width="150" height="90" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="6"/>
  <text x="165" y="150" fill="#c9d1d9" font-size="12" text-anchor="middle">Риски</text>
  <text x="165" y="166" fill="#c9d1d9" font-size="12" text-anchor="middle">настоящего</text>
  <text x="165" y="190" fill="#8b949e" font-size="10" text-anchor="middle">предвзятость,</text>
  <text x="165" y="202" fill="#8b949e" font-size="10" text-anchor="middle">непрозрачность</text>

  <rect x="245" y="140" width="150" height="70" fill="#161b22" stroke="#3fb950" stroke-width="2" rx="6"/>
  <text x="320" y="165" fill="#c9d1d9" font-size="12" text-anchor="middle">Средний</text>
  <text x="320" y="181" fill="#c9d1d9" font-size="12" text-anchor="middle">горизонт</text>
  <text x="320" y="200" fill="#8b949e" font-size="10" text-anchor="middle">системные эффекты</text>

  <rect x="400" y="150" width="150" height="60" fill="#161b22" stroke="#f85149" stroke-width="2" rx="6"/>
  <text x="475" y="175" fill="#c9d1d9" font-size="12" text-anchor="middle">Дальний</text>
  <text x="475" y="191" fill="#c9d1d9" font-size="12" text-anchor="middle">горизонт: контроль</text>

  <text x="80" y="85" fill="#8b949e" font-size="11" text-anchor="start">наблюдается сегодня</text>
  <text x="560" y="85" fill="#8b949e" font-size="11" text-anchor="end">структурный аргумент,</text>
  <text x="560" y="100" fill="#8b949e" font-size="11" text-anchor="end">не проверен эмпирически</text>
</svg>
