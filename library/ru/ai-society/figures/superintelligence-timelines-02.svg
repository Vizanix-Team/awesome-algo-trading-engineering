<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три метода прогнозирования, три набора ограничений</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="70" width="180" height="190" rx="6"/>
    <rect x="230" y="70" width="180" height="190" rx="6"/>
    <rect x="430" y="70" width="180" height="190" rx="6"/>
  </g>
  <g fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="120" y="95">Экстраполяция</text>
    <text x="120" y="110">трендов</text>
    <text x="320" y="95">Опросы</text>
    <text x="320" y="110">экспертов</text>
    <text x="520" y="95">Структурные</text>
    <text x="520" y="110">аргументы</text>
  </g>
  <g fill="#8b949e" font-size="10">
    <text x="45" y="140">+ опирается на</text>
    <text x="45" y="153">  измеримые данные</text>
    <text x="45" y="175">- тренд может не</text>
    <text x="45" y="188">  продолжиться</text>

    <text x="245" y="140">+ инсайдерское</text>
    <text x="245" y="153">  знание ограничений</text>
    <text x="245" y="175">- история и оптимизма,</text>
    <text x="245" y="188">  и пессимизма</text>

    <text x="445" y="140">+ учитывает</text>
    <text x="445" y="153">  качественные скачки</text>
    <text x="445" y="175">- сложность прорыва</text>
    <text x="445" y="188">  оценить ненадёжно</text>
  </g>
  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Ни один метод сам по себе не даёт надёжного точечного прогноза.</text>
</svg>
