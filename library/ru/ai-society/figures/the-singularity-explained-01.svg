<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три логически независимых значения «сингулярности»</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Каждое может реализоваться без двух других</text>

  <g fill="#161b22" stroke="#30363d">
    <rect x="30" y="80" width="180" height="180" rx="6"/>
    <rect x="230" y="80" width="180" height="180" rx="6"/>
    <rect x="430" y="80" width="180" height="180" rx="6"/>
  </g>
  <g fill="#58a6ff"><rect x="30" y="80" width="180" height="8"/></g>
  <g fill="#3fb950"><rect x="230" y="80" width="180" height="8"/></g>
  <g fill="#a371f7"><rect x="430" y="80" width="180" height="8"/></g>

  <g fill="#c9d1d9" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="120" y="115">Предел</text>
    <text x="120" y="131">предсказуемости</text>
    <text x="320" y="115">Рекурсивное</text>
    <text x="320" y="131">самоулучшение</text>
    <text x="520" y="115">Экономический</text>
    <text x="520" y="131">разрыв роста</text>
  </g>
  <g fill="#8b949e" font-size="10">
    <text x="45" y="165">Будущее формируют</text>
    <text x="45" y="178">нечеловеческие агенты,</text>
    <text x="45" y="191">экстраполяция ломается</text>

    <text x="245" y="165">Система улучшает</text>
    <text x="245" y="178">себя, петля обратной</text>
    <text x="245" y="191">связи ускоряется</text>

    <text x="445" y="165">Темп роста экономики</text>
    <text x="445" y="178">резко и устойчиво</text>
    <text x="445" y="191">превышает норму</text>
  </g>
  <text x="320" y="290" fill="#8b949e" font-size="10" text-anchor="middle">Смешение этих трёх версий — источник большинства бесплодных споров о термине.</text>
</svg>
