<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Спор о концентрации: безопасность против открытости</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Оба лагеря опираются на реальные прецеденты</text>

  <line x1="320" y1="90" x2="320" y2="230" stroke="#30363d" stroke-width="2"/>
  <circle cx="320" cy="160" r="8" fill="#c9d1d9"/>

  <line x1="80" y1="160" x2="300" y2="160" stroke="#58a6ff" stroke-width="3" marker-end="url(#a10)"/>
  <line x1="560" y1="160" x2="340" y2="160" stroke="#3fb950" stroke-width="3" marker-end="url(#a10)"/>
  <defs><marker id="a10" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>

  <text x="80" y="100" fill="#58a6ff" font-size="12" text-anchor="start">За концентрацию</text>
  <text x="80" y="120" fill="#8b949e" font-size="10" text-anchor="start">подотчётные, крупные</text>
  <text x="80" y="134" fill="#8b949e" font-size="10" text-anchor="start">разработчики</text>

  <text x="560" y="100" fill="#3fb950" font-size="12" text-anchor="end">За открытость</text>
  <text x="560" y="120" fill="#8b949e" font-size="10" text-anchor="end">независимый аудит,</text>
  <text x="560" y="134" fill="#8b949e" font-size="10" text-anchor="end">противовес власти</text>

  <text x="320" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Разумный баланс, вероятно, зависит от класса возможностей, а не единого правила.</text>
</svg>
