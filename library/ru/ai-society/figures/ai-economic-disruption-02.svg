<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Резкий шок против растянутого процесса</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Иллюстративное сравнение внимания и совокупного эффекта</text>

  <line x1="90" y1="270" x2="580" y2="270" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="298" fill="#8b949e" font-size="12" text-anchor="middle">время</text>

  <path d="M90,260 C 150,255 200,90 250,85 C 300,82 350,260 580,262" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="250" y="70" fill="#f85149" font-size="10" text-anchor="middle">резкий шок: пик внимания, затем спад</text>

  <path d="M90,265 C 250,255 400,210 580,140" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="585" y="144" fill="#58a6ff" font-size="10" text-anchor="start">растянутый</text>
  <text x="585" y="157" fill="#58a6ff" font-size="10" text-anchor="start">процесс:</text>
  <text x="585" y="170" fill="#58a6ff" font-size="10" text-anchor="start">внимание отстаёт</text>

  <text x="320" y="230" fill="#8b949e" font-size="10" text-anchor="middle">Совокупный эффект растянутого процесса может сравняться с резким шоком,</text>
  <text x="320" y="244" fill="#8b949e" font-size="10" text-anchor="middle">но мобилизует значительно меньше политического внимания.</text>
</svg>
