<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Инструментальная конвергенция: общие подцели</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Теоретический аргумент о гипотетических будущих системах</text>

  <circle cx="320" cy="190" r="55" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="186" fill="#c9d1d9" font-size="11" text-anchor="middle">Любая</text>
  <text x="320" y="202" fill="#c9d1d9" font-size="11" text-anchor="middle">конечная цель</text>

  <g stroke="#3b4453" stroke-width="1.5">
    <line x1="280" y1="150" x2="170" y2="90"/>
    <line x1="280" y1="230" x2="170" y2="290"/>
    <line x1="360" y1="150" x2="470" y2="90"/>
    <line x1="360" y1="230" x2="470" y2="290"/>
  </g>
  <g fill="#161b22" stroke="#f85149">
    <rect x="90" y="60" width="160" height="45" rx="5"/>
    <rect x="90" y="270" width="160" height="45" rx="5"/>
    <rect x="390" y="60" width="160" height="45" rx="5"/>
    <rect x="390" y="270" width="160" height="45" rx="5"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="170" y="80">Приобретение</text>
    <text x="170" y="95">ресурсов</text>
    <text x="170" y="290">Самосохранение</text>
    <text x="470" y="80">Сопротивление</text>
    <text x="470" y="95">изменению цели</text>
    <text x="470" y="290">Накопление данных</text>
  </g>
  <text x="320" y="325" fill="#8b949e" font-size="10" text-anchor="middle">Не наблюдается у текущих моделей; аргумент о свойствах гипотетических будущих систем.</text>
</svg>
