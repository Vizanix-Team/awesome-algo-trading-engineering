<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Вероятность и тяжесть последствий (иллюстративно)</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Качественная схема рассуждения, а не оценка вероятности</text>

  <line x1="100" y1="320" x2="560" y2="320" stroke="#30363d" stroke-width="1"/>
  <line x1="100" y1="320" x2="100" y2="70" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="350" fill="#8b949e" font-size="12" text-anchor="middle">Вероятность (низкая → высокая)</text>
  <text x="45" y="195" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 45 195)">Тяжесть последствий (низкая → высокая)</text>

  <circle cx="430" cy="270" r="10" fill="#58a6ff"/>
  <text x="430" y="255" fill="#c9d1d9" font-size="11" text-anchor="middle">Предвзятость, непрозрачность</text>

  <circle cx="330" cy="200" r="10" fill="#3fb950"/>
  <text x="330" y="185" fill="#c9d1d9" font-size="11" text-anchor="middle">Концентрация власти</text>

  <circle cx="240" cy="150" r="10" fill="#a371f7"/>
  <text x="240" y="135" fill="#c9d1d9" font-size="11" text-anchor="middle">Каскадные сбои инфраструктуры</text>

  <circle cx="170" cy="95" r="12" fill="#f85149"/>
  <text x="170" y="80" fill="#c9d1d9" font-size="11" text-anchor="middle">Потеря контроля</text>
  <text x="170" y="108" fill="#8b949e" font-size="10" text-anchor="middle">низкая согласованная вероятность, высокая ставка</text>
</svg>
