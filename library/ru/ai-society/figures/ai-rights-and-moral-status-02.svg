<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Асимметрия двух ошибок</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Ни одна сторона не выбирается на основе чистой интуиции</text>

  <line x1="320" y1="80" x2="320" y2="230" stroke="#8b949e" stroke-width="2"/>
  <line x1="150" y1="100" x2="490" y2="100" stroke="#8b949e" stroke-width="2"/>
  <line x1="150" y1="100" x2="150" y2="130" stroke="#8b949e" stroke-width="2"/>
  <line x1="490" y1="100" x2="490" y2="130" stroke="#8b949e" stroke-width="2"/>

  <rect x="90" y="130" width="120" height="70" fill="#161b22" stroke="#f85149" rx="5"/>
  <text x="150" y="155" fill="#c9d1d9" font-size="10" text-anchor="middle">Излишнее</text>
  <text x="150" y="169" fill="#c9d1d9" font-size="10" text-anchor="middle">приписывание</text>
  <text x="150" y="185" fill="#8b949e" font-size="9" text-anchor="middle">тормозит полезные</text>
  <text x="150" y="196" fill="#8b949e" font-size="9" text-anchor="middle">разработки</text>

  <rect x="430" y="130" width="120" height="70" fill="#161b22" stroke="#f85149" rx="5"/>
  <text x="490" y="155" fill="#c9d1d9" font-size="10" text-anchor="middle">Излишний</text>
  <text x="490" y="169" fill="#c9d1d9" font-size="10" text-anchor="middle">отказ</text>
  <text x="490" y="185" fill="#8b949e" font-size="9" text-anchor="middle">риск морального</text>
  <text x="490" y="196" fill="#8b949e" font-size="9" text-anchor="middle">бедствия масштаба</text>

  <text x="320" y="260" fill="#8b949e" font-size="11" text-anchor="middle">Обе ошибки несут реальные, но разные издержки — решение требует</text>
  <text x="320" y="274" fill="#8b949e" font-size="11" text-anchor="middle">явного учёта обеих, а не выбора одной стороны интуитивно.</text>
</svg>
