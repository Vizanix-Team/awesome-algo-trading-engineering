<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три функции оплачиваемого труда</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Экономический вопрос отделён от психологического и институционального</text>

  <circle cx="320" cy="180" r="55" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="176" fill="#c9d1d9" font-size="11" text-anchor="middle">Оплачиваемый</text>
  <text x="320" y="192" fill="#c9d1d9" font-size="11" text-anchor="middle">труд</text>

  <g stroke="#3b4453" stroke-width="1.5">
    <line x1="270" y1="150" x2="150" y2="100"/>
    <line x1="320" y1="235" x2="320" y2="280"/>
    <line x1="370" y1="150" x2="490" y2="100"/>
  </g>
  <g fill="#161b22" stroke="#58a6ff">
    <rect x="70" y="70" width="160" height="45" rx="5"/>
    <rect x="240" y="285" width="160" height="30" rx="5"/>
    <rect x="410" y="70" width="160" height="45" rx="5"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="150" y="90">Доход</text>
    <text x="150" y="104">(экономический)</text>
    <text x="320" y="304">Социальная структура (институциональный)</text>
    <text x="490" y="90">Смысл и</text>
    <text x="490" y="104">идентичность</text>
  </g>
</svg>
