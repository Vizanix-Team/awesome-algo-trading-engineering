<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Четыре механизма создания выигрыша</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Все действуют одновременно, в разных секторах</text>

  <circle cx="320" cy="200" r="55" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="196" fill="#c9d1d9" font-size="11" text-anchor="middle">Модель</text>
  <text x="320" y="212" fill="#c9d1d9" font-size="11" text-anchor="middle">ИИ</text>

  <g stroke="#3b4453" stroke-width="1.5">
    <line x1="320" y1="145" x2="320" y2="90"/>
    <line x1="270" y1="165" x2="150" y2="110"/>
    <line x1="270" y1="235" x2="150" y2="290"/>
    <line x1="370" y1="235" x2="490" y2="290"/>
  </g>
  <g fill="#161b22" stroke="#58a6ff">
    <rect x="245" y="55" width="150" height="40" rx="5"/>
    <rect x="60" y="80" width="180" height="45" rx="5"/>
    <rect x="60" y="280" width="180" height="45" rx="5"/>
    <rect x="450" y="280" width="150" height="45" rx="5"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="320" y="75">Снижение стоимости задач</text>
    <text x="150" y="98">Доступ к экспертизе,</text>
    <text x="150" y="112">ранее дефицитной</text>
    <text x="150" y="298">Ускорение науки</text>
    <text x="150" y="312">и инженерии</text>
    <text x="525" y="298">Рента от труда</text>
    <text x="525" y="312">к капиталу</text>
  </g>
</svg>
