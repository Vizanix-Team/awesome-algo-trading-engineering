<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Сокращение рабочей недели: рост, а затем плато</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Иллюстративная историческая динамика, не точные данные</text>

  <line x1="90" y1="250" x2="580" y2="250" stroke="#30363d" stroke-width="1"/>
  <line x1="90" y1="250" x2="90" y2="80" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="278" fill="#8b949e" font-size="12" text-anchor="middle">год (иллюстративно, конец XIX века → сегодня)</text>
  <text x="50" y="165" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 50 165)">часы в неделю</text>

  <path d="M90,100 C 200,150 300,220 400,235 C 480,240 540,240 580,240" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <text x="120" y="90" fill="#8b949e" font-size="10" text-anchor="start">~60+ часов</text>
  <text x="480" y="225" fill="#8b949e" font-size="10" text-anchor="middle">плато ~40 часов, прогнозы дальнейшего падения не сбылись</text>
</svg>
