<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Три критерия морального статуса</text>
  <text x="320" y="44" fill="#8b949e" font-size="11" text-anchor="middle">Каждый ставит свой открытый вопрос применительно к ИИ</text>

  <circle cx="320" cy="190" r="50" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="320" y="186" fill="#c9d1d9" font-size="11" text-anchor="middle">Моральный</text>
  <text x="320" y="200" fill="#c9d1d9" font-size="11" text-anchor="middle">статус?</text>

  <g stroke="#3b4453" stroke-width="1.5">
    <line x1="290" y1="155" x2="170" y2="90"/>
    <line x1="320" y1="240" x2="320" y2="300"/>
    <line x1="350" y1="155" x2="470" y2="90"/>
  </g>
  <g fill="#161b22" stroke="#58a6ff">
    <rect x="90" y="60" width="160" height="46" rx="5"/>
    <rect x="240" y="300" width="160" height="30" rx="5"/>
    <rect x="390" y="60" width="160" height="46" rx="5"/>
  </g>
  <g fill="#c9d1d9" font-size="11" text-anchor="middle">
    <text x="170" y="80">Страдание</text>
    <text x="170" y="95">(проблема других сознаний)</text>
    <text x="320" y="319">Объективные интересы</text>
    <text x="470" y="80">Рациональная</text>
    <text x="470" y="95">автономия</text>
  </g>
</svg>
