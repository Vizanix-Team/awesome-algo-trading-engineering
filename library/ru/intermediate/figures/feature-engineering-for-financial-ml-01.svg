<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="280" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">As-of join разночастотных источников</text>

  <text x="60" y="70" fill="#58a6ff" font-size="12">быстрый ряд (минутные бары)</text>
  <line x1="60" y1="90" x2="640" y2="90" stroke="#30363d" stroke-width="2"/>
  <g fill="#58a6ff">
    <circle cx="120" cy="90" r="5"/>
    <circle cx="220" cy="90" r="5"/>
    <circle cx="320" cy="90" r="5"/>
    <circle cx="420" cy="90" r="5"/>
    <circle cx="520" cy="90" r="5"/>
  </g>

  <text x="60" y="160" fill="#a371f7" font-size="12">медленный ряд (дневные фундаментальные данные)</text>
  <line x1="60" y1="180" x2="640" y2="180" stroke="#30363d" stroke-width="2"/>
  <g fill="#a371f7">
    <circle cx="150" cy="180" r="6"/>
    <circle cx="400" cy="180" r="6"/>
  </g>

  <path d="M150,186 L150,220 L320,220 L320,96" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow7)"/>
  <text x="235" y="235" fill="#3fb950" font-size="11" text-anchor="middle">присоединяется последнее известное значение (backward)</text>

  <text x="350" y="260" fill="#8b949e" font-size="11" text-anchor="middle">Присоединение учитывает knowledge_time, а не event_time медленного источника</text>

  <defs>
    <marker id="arrow7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
