<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">VaR и Expected Shortfall на хвосте распределения</text>

  <path d="M40,250 C120,60 220,60 320,180 C420,60 520,60 600,250" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <line x1="40" y1="250" x2="600" y2="250" stroke="#30363d"/>

  <path d="M75,240 C80,180 95,150 110,240 Z" fill="#f85149" fill-opacity="0.5" stroke="none" transform="translate(0,0)"/>
  <path d="M40,250 L75,250 C78,220 90,190 95,250 Z" fill="#f85149" fill-opacity="0.6"/>

  <line x1="95" y1="250" x2="95" y2="90" stroke="#a371f7" stroke-dasharray="4 3"/>
  <text x="95" y="80" fill="#a371f7" font-size="11" text-anchor="middle">VaR 95%</text>

  <text x="60" y="270" fill="#f85149" font-size="11" text-anchor="middle">худшие 5%</text>
  <text x="60" y="285" fill="#f85149" font-size="11" text-anchor="middle">(ES: среднее здесь)</text>

  <text x="320" y="290" fill="#8b949e" font-size="12" text-anchor="middle">VaR отмечает порог; Expected Shortfall усредняет убытки за его пределами</text>
</svg>
