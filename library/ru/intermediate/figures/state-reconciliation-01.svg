<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Процедура сверки состояния</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="60" y="70" width="180" height="50" rx="6"/>
  </g>
  <text x="150" y="99" fill="#c9d1d9" font-size="12" text-anchor="middle">Внутренний снимок (OMS)</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="460" y="70" width="180" height="50" rx="6"/>
  </g>
  <text x="550" y="99" fill="#c9d1d9" font-size="12" text-anchor="middle">Снимок биржи (REST-запрос)</text>

  <path d="M240,95 L330,95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <path d="M460,95 L370,95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="300" y="140" width="100" height="45" rx="6"/>
  </g>
  <text x="350" y="167" fill="#f85149" font-size="12" text-anchor="middle">drift?</text>

  <path d="M350,120 L350,140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <path d="M300,163 C180,190 150,150 150,120" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#arrow6g)"/>
  <text x="180" y="215" fill="#3fb950" font-size="11" text-anchor="middle">в допуске: игнорировать</text>

  <g fill="#161b22" stroke="#da3633" stroke-width="2">
    <rect x="280" y="220" width="140" height="50" rx="6"/>
  </g>
  <text x="350" y="242" fill="#f85149" font-size="12" text-anchor="middle">классификация</text>
  <text x="350" y="258" fill="#f85149" font-size="11" text-anchor="middle">и реакция по величине</text>
  <path d="M350,185 L350,220" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow6r)"/>

  <defs>
    <marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrow6g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrow6r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>
</svg>
