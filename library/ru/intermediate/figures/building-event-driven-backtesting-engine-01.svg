<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Конвейер событий event-driven движка</text>

  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="20" y="120" width="130" height="55" rx="6"/>
    <rect x="200" y="120" width="130" height="55" rx="6"/>
    <rect x="380" y="120" width="130" height="55" rx="6"/>
    <rect x="560" y="120" width="120" height="55" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="85" y="143">DataHandler</text>
    <text x="85" y="160">MarketData</text>
    <text x="265" y="143">Strategy</text>
    <text x="265" y="160">Signal</text>
    <text x="445" y="143">PortfolioMgr</text>
    <text x="445" y="160">Order</text>
    <text x="620" y="143">ExecutionSim</text>
    <text x="620" y="160">Fill</text>
  </g>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow4)">
    <line x1="150" y1="147" x2="200" y2="147"/>
    <line x1="330" y1="147" x2="380" y2="147"/>
    <line x1="510" y1="147" x2="560" y2="147"/>
  </g>
  <path d="M620,175 C620,230 445,230 445,175" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#arrow4g)"/>
  <text x="530" y="220" fill="#3fb950" font-size="11" text-anchor="middle">FillEvent обновляет позиции и P&amp;L</text>

  <text x="350" y="65" fill="#8b949e" font-size="12" text-anchor="middle">Приоритетная очередь событий, упорядоченная строго по timestamp</text>
  <line x1="60" y1="85" x2="640" y2="85" stroke="#30363d" stroke-dasharray="4 3"/>

  <text x="350" y="270" fill="#8b949e" font-size="11" text-anchor="middle">Strategy никогда не обращается к данным напрямую — только через события движка</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow4g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
