<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Нестационарная цена и стационарная доходность</text>

  <text x="160" y="55" fill="#f85149" font-size="12" text-anchor="middle">Цена: случайное блуждание (unit root)</text>
  <path d="M60,150 L100,145 L140,155 L180,130 L220,140 L260,110 L300,120 L340,90 L380,100 L420,70"
        stroke="#f85149" stroke-width="2" fill="none"/>
  <line x1="60" y1="200" x2="420" y2="200" stroke="#30363d"/>

  <text x="560" y="55" fill="#3fb950" font-size="12" text-anchor="middle">Доходность: стационарный ряд</text>
  <path d="M460,250 L480,240 L500,258 L520,235 L540,255 L560,242 L580,260 L600,238 L620,252 L640,245"
        stroke="#3fb950" stroke-width="2" fill="none"/>
  <line x1="460" y1="248" x2="640" y2="248" stroke="#30363d" stroke-dasharray="3 2"/>
  <text x="550" y="290" fill="#8b949e" font-size="11" text-anchor="middle">колеблется вокруг стабильного среднего</text>

  <text x="240" y="290" fill="#8b949e" font-size="11" text-anchor="middle">дисперсия растёт со временем</text>

  <text x="350" y="60" fill="#c9d1d9" font-size="12" text-anchor="middle" opacity="0"> </text>
</svg>
