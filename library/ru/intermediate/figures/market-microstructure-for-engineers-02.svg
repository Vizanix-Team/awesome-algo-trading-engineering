<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Price-time priority против pro-rata</text>

  <text x="175" y="55" fill="#58a6ff" font-size="13" text-anchor="middle">Price-time (FIFO)</text>
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="70" y="70" width="210" height="30" rx="4"/>
    <rect x="70" y="105" width="150" height="30" rx="4"/>
    <rect x="70" y="140" width="100" height="30" rx="4"/>
  </g>
  <g fill="#c9d1d9" font-size="11">
    <text x="80" y="89">заявка A: t=1, полное исполнение первой</text>
    <text x="80" y="124">заявка B: t=2</text>
    <text x="80" y="159">заявка C: t=3</text>
  </g>

  <text x="525" y="55" fill="#a371f7" font-size="13" text-anchor="middle">Pro-rata (по объёму)</text>
  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="420" y="70" width="210" height="30" rx="4"/>
    <rect x="420" y="105" width="210" height="30" rx="4"/>
    <rect x="420" y="140" width="210" height="30" rx="4"/>
  </g>
  <g fill="#c9d1d9" font-size="11">
    <text x="430" y="89">A: 500 шт → доля 50%</text>
    <text x="430" y="124">B: 300 шт → доля 30%</text>
    <text x="430" y="159">C: 200 шт → доля 20%</text>
  </g>

  <text x="350" y="210" fill="#8b949e" font-size="12" text-anchor="middle">В price-time скорость определяет позицию в очереди.</text>
  <text x="350" y="230" fill="#8b949e" font-size="12" text-anchor="middle">В pro-rata исполнение делится пропорционально размеру заявки на уровне.</text>
</svg>
