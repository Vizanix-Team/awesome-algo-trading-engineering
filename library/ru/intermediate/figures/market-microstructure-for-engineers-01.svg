<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Глубина книги заявок</text>

  <line x1="320" y1="60" x2="320" y2="280" stroke="#30363d"/>
  <text x="160" y="50" fill="#3fb950" font-size="12" text-anchor="middle">Bid (покупка)</text>
  <text x="480" y="50" fill="#f85149" font-size="12" text-anchor="middle">Ask (продажа)</text>

  <g fill="#3fb950" fill-opacity="0.8">
    <rect x="260" y="120" width="60" height="18"/>
    <rect x="230" y="140" width="90" height="18"/>
    <rect x="200" y="160" width="120" height="18"/>
    <rect x="170" y="180" width="150" height="18"/>
    <rect x="140" y="200" width="180" height="18"/>
  </g>
  <g fill="#f85149" fill-opacity="0.8">
    <rect x="320" y="120" width="55" height="18"/>
    <rect x="320" y="140" width="80" height="18"/>
    <rect x="320" y="160" width="110" height="18"/>
    <rect x="320" y="180" width="140" height="18"/>
    <rect x="320" y="200" width="170" height="18"/>
  </g>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="320" y="115">99.98</text>
    <text x="320" y="135">99.96</text>
    <text x="320" y="155">99.94</text>
    <text x="320" y="175">99.92</text>
    <text x="320" y="195">99.90</text>
  </g>

  <text x="320" y="240" fill="#c9d1d9" font-size="12" text-anchor="middle">спред = best ask − best bid</text>
  <line x1="260" y1="255" x2="380" y2="255" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="270" fill="#58a6ff" font-size="11" text-anchor="middle">← спред →</text>

  <text x="320" y="310" fill="#8b949e" font-size="11" text-anchor="middle">Внутри уровня заявки упорядочены очередью по времени поступления (FIFO)</text>
</svg>
