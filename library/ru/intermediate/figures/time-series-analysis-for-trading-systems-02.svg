<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Walk-forward валидация: rolling window</text>

  <line x1="60" y1="220" x2="640" y2="220" stroke="#30363d"/>
  <text x="350" y="250" fill="#8b949e" font-size="12" text-anchor="middle">время</text>

  <g>
    <rect x="60" y="80" width="180" height="24" fill="#58a6ff" fill-opacity="0.8"/>
    <rect x="240" y="80" width="60" height="24" fill="#3fb950" fill-opacity="0.9"/>

    <rect x="130" y="120" width="180" height="24" fill="#58a6ff" fill-opacity="0.8"/>
    <rect x="310" y="120" width="60" height="24" fill="#3fb950" fill-opacity="0.9"/>

    <rect x="200" y="160" width="180" height="24" fill="#58a6ff" fill-opacity="0.8"/>
    <rect x="380" y="160" width="60" height="24" fill="#3fb950" fill-opacity="0.9"/>

    <rect x="270" y="200" width="180" height="24" fill="#58a6ff" fill-opacity="0.8"/>
    <rect x="450" y="200" width="60" height="24" fill="#3fb950" fill-opacity="0.9"/>
  </g>

  <g fill="#c9d1d9" font-size="11">
    <rect x="560" y="80" width="14" height="14" fill="#58a6ff"/>
    <text x="580" y="92">train</text>
    <rect x="560" y="105" width="14" height="14" fill="#3fb950"/>
    <text x="580" y="117">out-of-sample test</text>
  </g>

  <text x="350" y="60" fill="#8b949e" font-size="11" text-anchor="middle">окно калибровки сдвигается вперёд, старые данные выпадают</text>
</svg>
