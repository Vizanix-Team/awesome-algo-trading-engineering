<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Восстановление состояния: снапшот + журнал событий</text>

  <line x1="60" y1="150" x2="580" y2="150" stroke="#30363d" stroke-width="2"/>

  <g fill="#a371f7">
    <circle cx="100" cy="150" r="6"/>
    <circle cx="160" cy="150" r="6"/>
    <circle cx="220" cy="150" r="6"/>
  </g>
  <text x="160" y="130" fill="#8b949e" font-size="11" text-anchor="middle">события 1..50</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="2">
    <rect x="290" y="130" width="90" height="40" rx="6"/>
  </g>
  <text x="335" y="155" fill="#3fb950" font-size="12" text-anchor="middle">снапшот</text>

  <g fill="#58a6ff">
    <circle cx="420" cy="150" r="6"/>
    <circle cx="470" cy="150" r="6"/>
    <circle cx="520" cy="150" r="6"/>
  </g>
  <text x="470" y="130" fill="#8b949e" font-size="11" text-anchor="middle">события после снапшота</text>

  <g fill="#f85149">
    <circle cx="560" cy="150" r="7"/>
  </g>
  <text x="560" y="130" fill="#f85149" font-size="11" text-anchor="middle">рестарт</text>

  <path d="M335,175 C335,220 560,220 560,175" stroke="#8b949e" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow3)"/>
  <text x="447" y="245" fill="#8b949e" font-size="12" text-anchor="middle">state = load(snapshot) → apply(события после last_sequence)</text>

  <text x="320" y="280" fill="#8b949e" font-size="11" text-anchor="middle">Время восстановления не зависит от общей длины истории ордера</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
