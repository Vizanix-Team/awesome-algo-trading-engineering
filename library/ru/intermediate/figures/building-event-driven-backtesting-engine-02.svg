<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">event_time против knowledge_time</text>

  <text x="60" y="70" fill="#8b949e" font-size="12">event_time (к чему относится значение)</text>
  <line x1="60" y1="90" x2="580" y2="90" stroke="#30363d" stroke-width="2"/>
  <circle cx="150" cy="90" r="6" fill="#58a6ff"/>
  <text x="150" y="112" fill="#58a6ff" font-size="11" text-anchor="middle">конец квартала</text>

  <text x="60" y="170" fill="#8b949e" font-size="12">knowledge_time (когда данные стали известны)</text>
  <line x1="60" y1="190" x2="580" y2="190" stroke="#30363d" stroke-width="2"/>
  <circle cx="380" cy="190" r="6" fill="#a371f7"/>
  <text x="380" y="212" fill="#a371f7" font-size="11" text-anchor="middle">публикация отчётности</text>

  <path d="M150,96 L150,150 L380,150 L380,184" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow5)"/>
  <text x="265" y="145" fill="#f85149" font-size="11" text-anchor="middle">разрыв: окно ложного знания будущего</text>

  <rect x="60" y="250" width="520" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="320" y="272" fill="#c9d1d9" font-size="12" text-anchor="middle">DataHandler фильтрует: knowledge_time ≤ current_simulation_time</text>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>
</svg>
