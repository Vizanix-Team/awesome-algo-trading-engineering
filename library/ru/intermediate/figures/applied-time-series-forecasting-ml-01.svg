<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="280" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Градиентный бустинг: последовательная коррекция ошибки</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="40" y="90" width="110" height="50" rx="6"/>
    <rect x="210" y="90" width="110" height="50" rx="6"/>
    <rect x="380" y="90" width="110" height="50" rx="6"/>
    <rect x="550" y="90" width="110" height="50" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle" font-size="12">
    <text x="95" y="120">F₀: среднее</text>
    <text x="265" y="112">дерево 1</text>
    <text x="265" y="128">на остатке</text>
    <text x="435" y="112">дерево 2</text>
    <text x="435" y="128">на остатке</text>
    <text x="605" y="112">дерево M</text>
    <text x="605" y="128">на остатке</text>
  </g>

  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow8)">
    <line x1="150" y1="115" x2="210" y2="115"/>
    <line x1="320" y1="115" x2="380" y2="115"/>
    <line x1="490" y1="115" x2="550" y2="115"/>
  </g>

  <text x="350" y="185" fill="#8b949e" font-size="12" text-anchor="middle">F_m(x) = F_{m-1}(x) + learning_rate · tree_m(x)</text>
  <text x="350" y="220" fill="#8b949e" font-size="12" text-anchor="middle">Каждое дерево обучается предсказывать ошибку совокупности предыдущих</text>
</svg>
