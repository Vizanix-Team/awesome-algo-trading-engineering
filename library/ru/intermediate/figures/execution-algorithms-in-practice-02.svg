<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Square-root модель market impact</text>

  <line x1="60" y1="260" x2="580" y2="260" stroke="#30363d"/>
  <line x1="60" y1="50" x2="60" y2="260" stroke="#30363d"/>
  <text x="320" y="295" fill="#8b949e" font-size="12" text-anchor="middle">размер дочернего ордера / средний дневной объём</text>
  <text x="30" y="150" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 30 150)">временный impact</text>

  <path d="M60,260 Q150,230 250,190 T450,110 T580,70" stroke="#f85149" stroke-width="2.5" fill="none"/>

  <g fill="#f85149">
    <circle cx="120" cy="243" r="4"/>
    <circle cx="250" cy="190" r="4"/>
    <circle cx="450" cy="110" r="4"/>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="120" y="230">1% ADV</text>
    <text x="250" y="177">4% ADV</text>
    <text x="450" y="97">16% ADV</text>
  </g>

  <line x1="120" y1="260" x2="120" y2="243" stroke="#30363d" stroke-dasharray="3 2"/>
  <line x1="250" y1="260" x2="250" y2="190" stroke="#30363d" stroke-dasharray="3 2"/>
  <line x1="450" y1="260" x2="450" y2="110" stroke="#30363d" stroke-dasharray="3 2"/>

  <text x="320" y="60" fill="#8b949e" font-size="11" text-anchor="middle">impact ≈ k · σ · sqrt(qty / ADV): удвоение объёма даёт рост в ~1.4 раза, а не в 2 раза</text>
</svg>
