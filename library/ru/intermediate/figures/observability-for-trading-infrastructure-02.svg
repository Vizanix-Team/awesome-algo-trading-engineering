<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Распределённый трейсинг жизненного цикла ордера</text>

  <text x="60" y="60" fill="#8b949e" font-size="11">trace_id: abc-123</text>

  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="60" y="80" width="90" height="26" rx="4"/>
  </g>
  <text x="105" y="97" fill="#c9d1d9" font-size="10" text-anchor="middle">strategy</text>

  <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
    <rect x="160" y="80" width="140" height="26" rx="4"/>
  </g>
  <text x="230" y="97" fill="#c9d1d9" font-size="10" text-anchor="middle">risk.pretrade_check</text>

  <g fill="#161b22" stroke="#a371f7" stroke-width="1.5">
    <rect x="310" y="80" width="120" height="26" rx="4"/>
  </g>
  <text x="370" y="97" fill="#c9d1d9" font-size="10" text-anchor="middle">oms.submit_order</text>

  <g fill="#161b22" stroke="#f85149" stroke-width="1.5">
    <rect x="440" y="80" width="220" height="26" rx="4"/>
  </g>
  <text x="550" y="97" fill="#c9d1d9" font-size="10" text-anchor="middle">gateway.send_to_exchange</text>

  <line x1="60" y1="130" x2="660" y2="130" stroke="#30363d"/>
  <text x="105" y="150" fill="#58a6ff" font-size="10" text-anchor="middle">0.4мс</text>
  <text x="230" y="150" fill="#3fb950" font-size="10" text-anchor="middle">1.1мс</text>
  <text x="370" y="150" fill="#a371f7" font-size="10" text-anchor="middle">0.6мс</text>
  <text x="550" y="150" fill="#f85149" font-size="10" text-anchor="middle">2.3мс (доминирует)</text>

  <text x="350" y="200" fill="#8b949e" font-size="12" text-anchor="middle">Каждый span соединён общим trace_id и client_order_id,</text>
  <text x="350" y="220" fill="#8b949e" font-size="12" text-anchor="middle">что позволяет за один запрос восстановить полную хронологию</text>
</svg>
