<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="340" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">TWAP против VWAP: распределение объёма по времени</text>

  <line x1="60" y1="270" x2="650" y2="270" stroke="#30363d"/>
  <line x1="60" y1="60" x2="60" y2="270" stroke="#30363d"/>

  <text x="30" y="70" fill="#8b949e" font-size="11" text-anchor="middle">объём</text>
  <text x="350" y="300" fill="#8b949e" font-size="11" text-anchor="middle">время торговой сессии</text>

  <!-- TWAP: flat bars -->
  <g fill="#58a6ff" fill-opacity="0.85">
    <rect x="75" y="215" width="60" height="55"/>
    <rect x="150" y="215" width="60" height="55"/>
    <rect x="225" y="215" width="60" height="55"/>
    <rect x="300" y="215" width="60" height="55"/>
    <rect x="375" y="215" width="60" height="55"/>
  </g>
  <text x="255" y="205" fill="#58a6ff" font-size="12" text-anchor="middle">TWAP: равные доли</text>

  <!-- VWAP: U-shaped bars -->
  <g fill="#a371f7" fill-opacity="0.85">
    <rect x="465" y="150" width="30" height="120"/>
    <rect x="500" y="220" width="30" height="50"/>
    <rect x="535" y="235" width="30" height="35"/>
    <rect x="570" y="200" width="30" height="70"/>
    <rect x="605" y="130" width="30" height="140"/>
  </g>
  <text x="555" y="205" fill="#a371f7" font-size="12" text-anchor="middle">VWAP: следует U-образному</text>
  <text x="555" y="220" fill="#a371f7" font-size="12" text-anchor="middle">профилю дневного объёма</text>

  <text x="350" y="60" fill="#8b949e" font-size="11" text-anchor="middle">высокий объём рынка на открытии и закрытии сессии</text>

  <text x="350" y="320" fill="#8b949e" font-size="11" text-anchor="middle">TWAP игнорирует профиль ликвидности; VWAP пропорционален ожидаемому объёму торгов</text>
</svg>
