<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="700" height="360" fill="#0d1117"/>
  <text x="350" y="26" fill="#c9d1d9" font-size="16" text-anchor="middle">Trading System Architecture</text>
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="30" y="60" width="140" height="50" rx="6"/>
    <rect x="30" y="150" width="140" height="50" rx="6"/>
    <rect x="270" y="60" width="160" height="50" rx="6"/>
    <rect x="270" y="150" width="160" height="50" rx="6"/>
    <rect x="270" y="240" width="160" height="50" rx="6"/>
    <rect x="530" y="60" width="140" height="50" rx="6"/>
    <rect x="530" y="150" width="140" height="50" rx="6"/>
    <rect x="530" y="240" width="140" height="50" rx="6"/>
  </g>
  <g fill="#c9d1d9" text-anchor="middle">
    <text x="100" y="89">Market Data Feed</text>
    <text x="100" y="179">Exchange WebSocket</text>
    <text x="350" y="80">Event Bus / Kafka</text>
    <text x="350" y="90">(order book, trades)</text>
    <text x="350" y="170">Strategy Engine</text>
    <text x="350" y="180">(signal, risk checks)</text>
    <text x="350" y="260">Order Management</text>
    <text x="350" y="270">System (OMS)</text>
    <text x="600" y="80">Risk Layer</text>
    <text x="600" y="90">(pre-trade)</text>
    <text x="600" y="170">Exchange Gateway</text>
    <text x="600" y="240">Reconciliation</text>
    <text x="600" y="260">&amp; Monitoring</text>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="85" x2="270" y2="85"/>
    <line x1="170" y1="175" x2="270" y2="175"/>
    <line x1="350" y1="110" x2="350" y2="150"/>
    <line x1="350" y1="200" x2="350" y2="240"/>
    <line x1="430" y1="175" x2="530" y2="175"/>
    <line x1="430" y1="265" x2="530" y2="265"/>
    <line x1="600" y1="150" x2="600" y2="110"/>
    <line x1="600" y1="200" x2="600" y2="240"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
