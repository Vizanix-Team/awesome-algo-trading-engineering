<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="320" fill="#0d1117"/>
  <text x="320" y="28" fill="#c9d1d9" font-size="16" text-anchor="middle">Order Book Depth</text>
  <line x1="320" y1="50" x2="320" y2="270" stroke="#30363d" stroke-width="1"/>
  <line x1="40" y1="270" x2="600" y2="270" stroke="#30363d" stroke-width="1"/>
  <!-- bids (left, green) -->
  <polygon points="320,270 300,260 275,245 245,225 210,200 170,170 120,140 60,105 60,270" fill="#238636" opacity="0.55"/>
  <polyline points="320,270 300,260 275,245 245,225 210,200 170,170 120,140 60,105" fill="none" stroke="#3fb950" stroke-width="2"/>
  <!-- asks (right, red) -->
  <polygon points="320,270 340,262 365,248 400,230 440,205 480,175 530,148 600,110 600,270" fill="#da3633" opacity="0.5"/>
  <polyline points="320,270 340,262 365,248 400,230 440,205 480,175 530,148 600,110" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="290" fill="#8b949e" font-size="12" text-anchor="middle">Bids</text>
  <text x="480" y="290" fill="#8b949e" font-size="12" text-anchor="middle">Asks</text>
  <text x="320" y="45" fill="#8b949e" font-size="11" text-anchor="middle">Mid Price</text>
  <text x="20" y="160" fill="#8b949e" font-size="11" transform="rotate(-90 20 160)">Cumulative Size</text>
</svg>
